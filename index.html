/** Noms affichés. L'ancien nom par défaut « Ciné Affiches » devient « Affiches ». */
function brandNames(s = {}) {
  const raw = (s.catalog_name || '').trim()
  const catalog = !raw || raw === 'Ciné Affiches' ? 'Affiches' : raw
  const cinema = (s.cinema_name || '').trim() || 'Le Lido'
  return { catalog, cinema, full: `${catalog} ${cinema}` }
}
/** Nom en lettres « AFFICHES / LE LIDO », remplacé par le logo s'il a été envoyé dans les réglages. */
function wordmarkHtml(s = {}, cls = '', href = null) {
  const n = brandNames(s)
  const u = img.storage(s.logo_path)
  const inner = u ? html`<img src="${u}" alt="${n.full}">` : html`<small>${n.catalog}</small><b>${n.cinema}</b>`
  return href ? html`<a class="wordmark ${cls}" href="${href}" aria-label="${n.full} — accueil">${inner}</a>` : html`<span class="wordmark ${cls}" role="img" aria-label="${n.full}">${inner}</span>`
}

async function loadPublic(force = false) {
  if (PUB.catalog && !force) return
  const [catalog, settings] = await Promise.all([api.publicCatalog(), api.publicSettings()])
  const sig = JSON.stringify([catalog, settings])
  const changed = sig !== PUB.signature
  // En vente : seuls les formats avec un exemplaire libre. À venir : tous les formats (réservables ou non).
  PUB.catalog = catalog.map((v) => (v.upcoming ? v : { ...v, formats: v.formats.filter((f) => f.free !== false) }))
  PUB.settings = settings || {}
  PUB.signature = sig
  applyBrand(PUB.settings)
  return changed
}

async function renderPublic(route) {
  document.body.classList.add('pub')
  document.title = brandNames(PUB.settings || {}).full
  if (!PUB.mounted) {
    PUB.mounted = true
    mountPublicShell()
    try {
      await loadPublic()
    } catch (e) {
      setHTML($('#pub-results'), html`<div class="empty"><div class="ico">${icon('alert')}</div><h3>Catalogue momentanément indisponible</h3>
        <p>${errMsg(e)}</p><button class="btn btn-primary" data-act="retry">Réessayer</button></div>`)
      return
    }
    fillPublicHeader()
    renderPublicResults()
    startPublicRefresh()
  }
  syncPublicDetail(route.params.visualId)
}

      <select id="pub-sort" aria-label="Trier les affiches">${Object.entries(SORTS).map(([k, l]) => html`<option value="${k}" ${attr((p.get('tri') || 'title-asc') === k, 'selected')}>${l}</option>`)}</select>
    </label>
  </div></div>
  <main class="container" style="padding-top:28px;padding-bottom:70px">
    <section id="pub-recent" class="hidden" aria-labelledby="recent-h" style="margin-bottom:44px"></section>
    <section aria-labelledby="all-h">
      <div class="section-title"><div><p class="pub-eyebrow" id="all-eyebrow">Catalogue</p><h2 id="all-h">Toutes les affiches</h2></div><span class="muted small" id="pub-count" aria-live="polite"></span></div>
      <div id="pub-results">${skeletonGrid()}</div>
      <div id="pub-more" style="height:40px"></div>
    </section>
  </main>
  <footer class="pub-foot"><div class="container">
    <div class="ornament" aria-hidden="true"><i></i></div>
    <div id="pub-foot-brand">${wordmarkHtml({}, 'md')}</div>
    <p id="pub-foot-note">Catalogue mis à jour selon les stocks du cinéma.</p>
    <button type="button" class="foot-link" data-act="credits">Crédits</button>
  </div></footer>`)

  const input = $('#pub-q')
  let t
  input.addEventListener('input', () => {
    $('#pub-clear').classList.toggle('hidden', !input.value)
    PUB.limit = PAGE_SIZE
    renderPublicResults()
    clearTimeout(t)
    t = setTimeout(() => { const q = qs(); input.value ? q.set('q', input.value) : q.delete('q'); setQuery(q) }, 300)
  })
  $('#pub-clear').addEventListener('click', () => { input.value = ''; input.dispatchEvent(new Event('input')); input.focus() })
  $('#pub-sort').addEventListener('change', (e) => { const q = qs(); e.target.value === 'title-asc' ? q.delete('tri') : q.set('tri', e.target.value); setQuery(q); PUB.limit = PAGE_SIZE; renderPublicResults() })
  $('#pub-formats').addEventListener('click', (e) => {
    const b = e.target.closest('[data-format]')
    if (!b) return
    const q = qs(); b.dataset.format === 'all' ? q.delete('format') : q.set('format', b.dataset.format); setQuery(q)
    PUB.limit = PAGE_SIZE
    renderPublicResults()
  })
  $('#app').addEventListener('click', (e) => {
    if (e.target.closest('[data-act="retry"]')) { PUB.mounted = false; render() }
    if (e.target.closest('[data-act="credits"]')) openModal({ title: 'Crédits', size: 'sm', body: html`<div class="stack">
      <p>Informations et visuels de films fournis par <b>TMDB</b> (The Movie Database).</p>
      <p class="muted small">Ce site utilise l’API TMDB mais n’est ni approuvé ni certifié par TMDB.</p></div>` })
    if (e.target.closest('[data-act="reset"]')) { input.value = ''; setQuery(new URLSearchParams()); $('#pub-sort').value = 'title-asc'; renderPublicResults() }
  })
  new IntersectionObserver((entries) => {
    if (entries[0].isIntersecting && PUB.catalog && PUB.limit < PUB.lastCount) { PUB.limit += PAGE_SIZE; renderPublicResults(true) }
  }, { rootMargin: '700px' }).observe($('#pub-more'))
}

function renderPublicResults(appendOnly = false) {
  if (!PUB.catalog) return
  const p = qs()
  const query = $('#pub-q')?.value || ''
  const format = p.get('format') || 'all'
  const sort = SORTS[p.get('tri')] ? p.get('tri') : 'title-asc'

  const chips = [{ code: 'all', label: 'Toutes' }, ...formats]
  if (PUB.catalog.some((v) => v.upcoming)) chips.push({ code: 'upcoming', label: 'Bientôt' })
  setHTML($('#pub-formats'), chips.map((f) =>
    html`<button class="chip" role="radio" aria-checked="${String(format === f.code)}" data-format="${f.code}">${f.code === 'all' || f.code === 'upcoming' ? f.label : shortFormat(f.label)}</button>`))
  $('#pub-sort-label').textContent = sort === 'title-asc' ? 'Trier' : SORTS[sort]

  const recentBox = $('#pub-recent')
  const recent = PUB.settings.show_recent && PUB.settings.recent_count > 0 ? recentlyAdded(PUB.catalog, PUB.settings.recent_count) : []
  if (!searching && recent.length && !appendOnly) {
    recentBox.classList.remove('hidden')

    setHTML(recentBox, html`<div class="section-title"><div><p class="pub-eyebrow">Nouveautés</p><h2 id="recent-h">Dernières arrivées</h2></div></div>
      <div class="carousel no-scrollbar">${recent.map((v, i) => html`<div>${posterCard(v, i, { ribbon: 'Nouveau' })}</div>`)}</div>`)

  } else if (searching) recentBox.classList.add('hidden')

  const results = filterCatalog(PUB.catalog, { query, format, sort })
  PUB.lastCount = results.length
  $('#all-h').textContent = searching ? 'Résultats' : 'Toutes les affiches'
  $('#all-eyebrow').textContent = searching ? 'Recherche' : 'Catalogue'

  if (!results.length) {

          <p>${query ? `Aucune affiche disponible ne correspond à « ${query} ».` : 'Aucune affiche dans ce format pour le moment.'} N’hésitez pas à demander à la caisse.</p>

      : html`<div class="empty"><div class="ico">${icon('sparkles')}</div><h3>Le catalogue est en préparation</h3><p>Revenez bientôt : de nouvelles affiches arrivent régulièrement.</p></div>`)

  }
  setHTML(box, html`<div class="grid-posters">${results.slice(0, PUB.limit).map((v, i) => html`<div class="${appendOnly ? '' : 'anim-rise'}" style="animation-delay:${Math.min(i, 12) * 22}ms">${posterCard(v, i)}</div>`)}</div>`)
}

/**
 * Vitrine en direct : chaque changement côté administration (vente, retour en stock, réservation,
 * nouvelle affiche, prix…) envoie un simple signal « le catalogue a changé » sur le canal privé
 * « vitrine » (aucune donnée dans le signal). La vitrine recharge alors le catalogue public.
 * Personne d'autre que la base ne peut émettre sur ce canal. En secours : actualisation régulière.
 */
const LIVE_FALLBACK_MS = 20_000   // sans connexion temps réel
const LIVE_SAFETY_MS = 120_000    // avec connexion temps réel (filet de sécurité)
let liveTimer = null, lastLiveRefresh = 0
async function refreshPublicNow() {
  if (document.visibilityState !== 'visible' || currentRoute?.area !== 'public') { PUB.stale = true; return }
  lastLiveRefresh = Date.now()
  PUB.stale = false
  const openId = currentRoute.params.visualId
  const before = openId ? JSON.stringify(PUB.catalog?.find((v) => v.visual_id === openId) || null) : null
  try {
    if (!(await loadPublic(true))) return
    fillPublicHeader()
    renderPublicResults()
    if (openId && JSON.stringify(PUB.catalog.find((v) => v.visual_id === openId) || null) !== before) syncPublicDetail(openId)
  } catch { PUB.stale = true /* réseau momentanément indisponible : nouvel essai au prochain signal */ }
}
/** Regroupe les signaux rapprochés (une vente = plusieurs changements) : au plus une actualisation toutes les 2 s. */
function scheduleLiveRefresh() {
  clearTimeout(liveTimer)
  const wait = Math.max(400, 2000 - (Date.now() - lastLiveRefresh))
  liveTimer = setTimeout(refreshPublicNow, wait)
}
function startPublicRefresh() {
  clearInterval(PUB.timer)
  const arm = () => { clearInterval(PUB.timer); PUB.timer = setInterval(refreshPublicNow, PUB.live ? LIVE_SAFETY_MS : LIVE_FALLBACK_MS) }
  if (!PUB.channel && sb) {
    try {
      PUB.channel = sb.channel('vitrine', { config: { private: true } })
        .on('broadcast', { event: 'catalogue' }, scheduleLiveRefresh)
        .subscribe((status) => {
          const live = status === 'SUBSCRIBED'
          if (live && PUB.live === false) scheduleLiveRefresh()  // reconnexion : rattraper ce qui a pu être manqué
          PUB.live = live
          arm()
        })
    } catch { PUB.live = false }
  }
  arm()
  const wake = () => { if (document.visibilityState === 'visible' && (PUB.stale || Date.now() - lastLiveRefresh > 10_000)) scheduleLiveRefresh() }
  document.addEventListener('visibilitychange', wake)
  window.addEventListener('focus', wake)
  window.addEventListener('online', scheduleLiveRefresh)
}

/* ═══════════════════════════════════════════════════════════════════════
   F. ADMINISTRATION — session, droits, mise en page
   ═══════════════════════════════════════════════════════════════════════ */
const ADM = {
  profile: null, visuals: [], formats: [], locations: [], settings: null, reservations: [],
  loaded: false, shell: false, refreshView: null, channel: null, lastLoad: 0, movementVersion: 0,
}
const isOwner = () => ADM.profile?.role === 'owner' && ADM.profile?.status === 'active'
const activeFormats = () => ADM.formats.filter((f) => f.is_active)
const activeFormatIds = () => new Set(activeFormats().map((f) => f.id))

async function loadAdminData() {
  const [visuals, formats, locations, settings, reservations] = await Promise.all([api.visuals(), api.formats(), api.locations(), api.settings(), api.reservations()])
  Object.assign(ADM, { visuals, formats, locations, settings, reservations, loaded: true, lastLoad: Date.now() })
  applyBrand(settings)
  updateResaBadge()
}
/** Réservations demandant une action (client à prévenir, à rappeler, délai dépassé). */
function resaTodo() {
  const today = todayParis()
  let n = 0
  for (const r of ADM.reservations) {
    if (r.status !== 'active') continue
    const st = reservationInfo(r, findVisual(r.visual_id), ADM.settings, today).state
    if (st === 'overdue' || st === 'to_notify' || st === 'to_remind') n++
  }
  return n
}
function updateResaBadge() {
  const n = ADM.loaded ? resaTodo() : 0
  $$('[data-nav="reservations"] .nav-count').forEach((el) => { el.textContent = n ? String(n) : ''; el.hidden = !n })
}
let purgeDone = false
/** Effacement automatique des données clients 30 jours après la clôture (une fois par session). */
function purgeOldReservations() {
  if (purgeDone) return
  purgeDone = true
  api.rpc('purge_reservations', {}).then((n) => { if (n) reloadAdmin() }).catch(() => { purgeDone = false })
}
async function reloadAdmin({ quiet = true } = {}) {
  try { await loadAdminData(); ADM.refreshView?.() } catch (e) { if (!quiet) toast(errMsg(e), 'error') }
}
let rtTimer
function subscribeRealtime() {
  if (ADM.channel) return
  const bump = () => { clearTimeout(rtTimer); rtTimer = setTimeout(() => { ADM.movementVersion++; reloadAdmin() }, 700) }
  try {
    ADM.channel = sb.channel('ca-stock')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'stocks' }, bump)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'poster_visuals' }, bump)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'reservations' }, bump)
      .subscribe()
  } catch { /* temps réel indisponible : actualisation au retour sur l'onglet */ }
}
function unsubscribeRealtime() { if (ADM.channel) { sb.removeChannel(ADM.channel); ADM.channel = null } }
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && currentRoute?.area === 'admin' && ADM.loaded && Date.now() - ADM.lastLoad > 20_000) { recheckAccess(); reloadAdmin() }
})
/** Vérifie que le compte est toujours actif (révocation effective d'un compte désactivé). */
async function recheckAccess() {
  try {
    const p = await api.myProfile()
    if (!p || p.status !== 'active') {
      toast(p?.status === 'disabled' ? 'Ce compte a été désactivé.' : 'Vos droits d’accès ont été retirés.', 'error')
      await signOut(true)
      return false
    }
    const roleChanged = ADM.profile && p.role !== ADM.profile.role
    ADM.profile = p
    if (roleChanged) { ADM.shell = false; render() }
    return true
  } catch { return true }
}
window.addEventListener('ca:recheck-access', () => { if (currentRoute?.area === 'admin') recheckAccess() })

async function signOut(silent = false) {
  unsubscribeRealtime()
  await sb.auth.signOut().catch(() => {})
  Object.assign(ADM, { profile: null, visuals: [], reservations: [], loaded: false, shell: false, refreshView: null })
  purgeDone = false
  if (!silent) toast('Vous êtes déconnecté.', 'info')
  navigate(A(), { replace: true })
}

async function renderAdmin(route) {
  document.body.classList.remove('pub')
  document.title = `Administration — ${brandNames(ADM.settings || {}).full}`
  if (PUB.mounted) { PUB.mounted = false; clearInterval(PUB.timer); PUB.detail?.close() }

  if (PUBLIC_ADMIN_PAGES.has(route.name)) { ADM.shell = false; return AUTH_PAGES[route.name](route) }

  const { data } = await sb.auth.getSession()
  if (!data.session) { ADM.shell = false; ADM.profile = null; return renderLogin() }

  if (!ADM.profile || ADM.profile.user_id !== data.session.user.id) {
    try { ADM.profile = await api.myProfile() } catch (e) { return renderAuthMessage('Connexion impossible', errMsg(e), true) }
  }
  const p = ADM.profile
  if (!p) return renderAuthMessage('Accès refusé', 'Ce compte n’est pas autorisé à accéder à l’administration du cinéma.', true)
  if (p.status === 'invited') return navigate(A('/activation'), { replace: true })
  if (p.status === 'disabled') return renderAuthMessage('Compte désactivé', 'Ce compte administrateur a été désactivé. Contactez l’administrateur principal.', true)
  if (!(await mfaGate(p))) { ADM.shell = false; return }

  if (!ADM.loaded) {
    ADM.shell = false
    setHTML($('#app'), html`<div class="boot"><span class="spinner"></span> Chargement du stock…</div>`)
    try { await loadAdminData() } catch (e) { return renderAuthMessage('Impossible de charger les données', errMsg(e), false, true) }
    subscribeRealtime()
    purgeOldReservations()
  }
  if (!ADM.shell) mountAdminShell()
  updateNav(route.name)
  const main = $('#adm-main')
  const page = document.createElement('div')
  page.className = 'anim-fade'
  main.replaceChildren(page)
  ADM.refreshView = null
  const fn = ADMIN_PAGES[route.name]
  if ((route.name === 'admins') && !isOwner()) {
    setHTML(page, html`<div class="empty"><div class="ico">${icon('shield')}</div><h3>Réservé à l’administrateur principal</h3><p>Seul l’administrateur principal peut gérer les comptes.</p></div>`)
    return
  }
  try { await fn(page, route.params) } catch (e) { console.error(e); setHTML(page, html`<div class="alert error">${errMsg(e)}</div>`) }
}

  }
  return $('.auth-card')

function formAlert(card, tone, message) {
  const box = $('[data-alert]', card)
  if (!box) return
  if (!message) { box.innerHTML = ''; return }
  setHTML(box, html`<div class="alert ${tone}" role="${tone === 'error' ? 'alert' : 'status'}">${message}</div>`)
}
function renderAuthMessage(title, message, withSignOut, withRetry) {
  const card = authShell(title, 'Espace interne', html`<div class="stack">
    <div class="alert info">${message}</div>
    ${withRetry ? html`<button class="btn btn-primary block" data-retry>Réessayer</button>` : ''}
    ${withSignOut ? html`<button class="btn btn-secondary block" data-out>Se déconnecter</button>` : ''}
    <a class="link" style="text-align:center" href="/">Retour à la vitrine</a></div>`)
  $('[data-out]', card)?.addEventListener('click', () => signOut(true))
  $('[data-retry]', card)?.addEventListener('click', () => render())
}

/* ── Double authentification (code à 6 chiffres d'une application du téléphone) ──
   La base de données refuse toute donnée tant que la session n'a pas été validée par un code
   (quand l'option est obligatoire) : ces écrans ne sont que le chemin pour y arriver. */
/** Niveau de la session, vérifié auprès du serveur (et non d'après une copie locale ancienne). */
async function mfaLevel() {
  try {
    const { data: { session } } = await sb.auth.getSession()
    if (!session) return { expired: true }
    const { data, error } = await sb.auth.mfa.getAuthenticatorAssuranceLevel(session.access_token)
    if (error) return isExpiredSession(error) ? { expired: true } : null
    return data
  } catch { return null }
}
/** Session coupée côté serveur (ex. double authentification activée depuis un autre appareil). */
function isExpiredSession(e) {
  const m = String(e?.message || '')
  return e?.name === 'AuthSessionMissingError' || e?.status === 401 || e?.status === 403 || ['session_not_found', 'bad_jwt', 'no_authorization', 'refresh_token_not_found'].includes(e?.code) || /bearer token|session missing|session.*(not|n't) exist|jwt|invalid claim/i.test(m)
}
async function expiredSessionLogout() {
  await signOut(true)
  toast('Votre session a expiré (sécurité renforcée sur ce compte). Reconnectez-vous.', 'info')
}
async function verifiedTotp() {
  const { data, error } = await sb.auth.mfa.listFactors()
  if (error) throw error
  return data?.totp || []
}
/** true = accès autorisé ; false = un écran de double authentification est affiché. */
async function mfaGate(p) {
  const lvl = await mfaLevel()
  if (lvl?.expired) { await expiredSessionLogout(); return false }
  if (!lvl || lvl.currentLevel === 'aal2') return true
  if (lvl.nextLevel === 'aal2') { renderMfaChallenge(); return false }
  if (p.mfa_required) { renderMfaSetupPage(); return false }
  return true
}
function mfaErrorMessage(e) {
  const m = String(e?.message || ''), code = e?.code || ''
  if (code === 'mfa_verification_failed' || /invalid totp|invalid code|verification failed/i.test(m)) return 'Code incorrect ou expiré. Saisissez le code affiché en ce moment (il change toutes les 30 secondes). Vérifiez aussi que l’heure de votre téléphone est automatique.'
  if (code === 'over_request_rate_limit' || e?.status === 429) return 'Trop de tentatives. Patientez une minute avant de réessayer.'
  if (code === 'mfa_totp_enroll_not_enabled' || /enroll.*disabled|not enabled/i.test(m)) return 'La double authentification n’est pas activée sur le serveur Supabase (Authentication → Multi-Factor → TOTP).'
  return errMsg(e)
}
const codeInput = (id = 'mfa-code') => html`<input class="input mono" id="${id}" name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]*" maxlength="6" placeholder="123456" style="font-size:24px;letter-spacing:.3em;text-align:center;height:60px" required>`
const cleanCode = (v) => String(v || '').replace(/\D/g, '').slice(0, 6)

function renderMfaChallenge() {
  const card = authShell('Code de vérification', 'Double authentification', html`<form class="stack" data-mfa novalidate>
    <p class="muted small">Ouvrez votre application d’authentification (Google Authenticator, Microsoft Authenticator…) et saisissez le code à 6 chiffres affiché pour <b>${brandNames(ADM.settings || PUB.settings || {}).full}</b>.</p>
    <div data-alert></div>
    <div class="field"><label for="mfa-code">Code à 6 chiffres</label>${codeInput()}</div>
    <button class="btn btn-primary lg block" type="submit">${icon('shield')} Valider</button>
    <details class="small"><summary class="link" style="cursor:pointer">Téléphone perdu ou changé ?</summary>
      <div class="stack tight muted" style="margin-top:8px">
        <p>• Si vous avez noté votre <b>clé de secours</b> : ajoutez-la dans l’application d’authentification du nouveau téléphone (« Saisir une clé de configuration »), puis saisissez le code.</p>
        <p>• Sinon, demandez à l’administrateur principal de <b>réinitialiser votre double authentification</b> (Gestion des administrateurs). Vous pourrez alors activer le nouveau téléphone.</p></div></details>
    <button type="button" class="btn btn-ghost block" data-out>Se déconnecter</button></form>`)
  const f = $('[data-mfa]', card)
  f.code.focus()
  f.code.addEventListener('input', () => { f.code.value = cleanCode(f.code.value); if (f.code.value.length === 6) f.requestSubmit() })
  $('[data-out]', card).onclick = () => signOut(true)
  f.onsubmit = (e) => {
    e.preventDefault()
    const code = cleanCode(f.code.value)
    if (code.length !== 6) return formAlert(card, 'error', 'Saisissez les 6 chiffres du code.')
    busy($('[type=submit]', f), async () => {
      try {
        const factors = await verifiedTotp()
        let lastErr = null
        for (const fa of factors) {
          const { error } = await sb.auth.mfa.challengeAndVerify({ factorId: fa.id, code })
          if (!error) { ADM.profile = null; return render() }
          lastErr = error
        }
        throw lastErr || new Error('Aucun appareil enregistré.')
      } catch (err) {
        if (isExpiredSession(err)) return expiredSessionLogout()
        f.code.value = ''; f.code.focus(); formAlert(card, 'error', mfaErrorMessage(err))
      }
    })
  }
}

/** Écran d'activation : QR code (ordinateur), bouton direct et clé (téléphone). */
async function mountMfaEnroll(box, { onDone, replaceOthers = false } = {}) {
  setHTML(box, html`<div class="boot" style="min-height:120px"><span class="spinner"></span> Préparation…</div>`)
  let factor
  try {
    // Nettoyage d'une activation commencée mais jamais terminée
    const { data } = await sb.auth.mfa.listFactors()
    for (const fa of (data?.all || []).filter((x) => x.status !== 'verified')) await sb.auth.mfa.unenroll({ factorId: fa.id }).catch(() => {})
    const r = await sb.auth.mfa.enroll({ factorType: 'totp', friendlyName: `Téléphone ${new Date().toLocaleDateString('fr-FR')} ${String(Date.now()).slice(-4)}`, issuer: brandNames(ADM.settings || PUB.settings || {}).full })
    if (r.error) throw r.error
    factor = r.data
  } catch (e) {
    if (isExpiredSession(e)) return expiredSessionLogout()
    setHTML(box, html`<div class="alert error">${mfaErrorMessage(e)}</div>`); return
  }
  const secret = factor.totp.secret
  const pretty = secret.replace(/(.{4})/g, '$1 ').trim()
  const phone = matchMedia('(pointer: coarse)').matches
  const direct = html`<a class="btn btn-primary lg block multiline" href="${factor.totp.uri}">${icon('external')} Ajouter à mon application d’authentification</a>`
  const qrBox = html`<div class="mfa-qr" data-qr aria-label="QR code à scanner avec l’application d’authentification"></div>`
  const keyBox = html`<div class="mfa-key"><p class="label">Clé de secours (à noter et ranger en lieu sûr)</p>
      <div class="row" style="gap:8px"><code class="mono grow" data-key>${pretty}</code><button type="button" class="btn btn-secondary sm" data-copy>${icon('copy')} Copier</button></div>
      <p class="hint">Elle permet de retrouver vos codes sur un nouveau téléphone. Ne la communiquez à personne.</p></div>`
  setHTML(box, html`<form class="stack" data-enroll novalidate>
    <ol class="mfa-steps">
      <li><b>Installez une application d’authentification</b> sur votre téléphone : Google Authenticator ou Microsoft Authenticator (gratuites). Sur iPhone, l’app « Mots de passe » convient aussi.</li>
      ${phone ? html`<li><b>Sur ce téléphone :</b> appuyez sur le bouton ci-dessous, l’application s’ouvre et enregistre le compte. Revenez ensuite ici.
          <div style="margin-top:10px">${direct}</div>
          <p class="hint" style="margin-top:8px">Si rien ne s’ouvre : copiez la clé ci-dessous et, dans l’application, choisissez « + » puis « Saisir une clé de configuration ».</p></li>`
        : html`<li><b>Scannez ce QR code</b> avec l’application (bouton « + » puis « Scanner un QR code »).<div style="margin-top:12px">${qrBox}</div></li>`}
      <li><b>Saisissez le code à 6 chiffres</b> affiché par l’application :<div class="field" style="margin-top:8px">${codeInput('mfa-new')}</div></li>
    </ol>
    ${keyBox}
    ${phone ? html`<details class="small"><summary class="link" style="cursor:pointer">Afficher le QR code (pour un autre appareil)</summary><div style="margin-top:10px">${qrBox}</div></details>` : ''}
    <div data-alert></div>
    <button class="btn btn-primary lg block" type="submit">${icon('shield')} Activer la double authentification</button></form>`)
  loadQr().then((qrcode) => {
    const qr = qrcode(0, 'M'); qr.addData(factor.totp.uri); qr.make()
    $$('[data-qr]', box).forEach((el) => { el.innerHTML = qr.createSvgTag({ cellSize: 4, margin: 2, scalable: true }) })
  }).catch(() => $$('[data-qr]', box).forEach((el) => { el.innerHTML = '<p class="xs muted">QR code indisponible : utilisez la clé.</p>' }))
  $('[data-copy]', box).onclick = async () => {
    try { await navigator.clipboard.writeText(secret); toast('Clé copiée.') } catch { toast('Copie impossible : recopiez la clé à la main.', 'error') }
  }
  const f = $('[data-enroll]', box)
  f.code.addEventListener('input', () => { f.code.value = cleanCode(f.code.value) })
  f.onsubmit = (e) => {
    e.preventDefault()
    const code = cleanCode(f.code.value)
    const alertBox = (msg) => setHTML($('[data-alert]', f), msg ? html`<div class="alert error" role="alert">${msg}</div>` : '')
    if (code.length !== 6) return alertBox('Saisissez les 6 chiffres affichés par l’application.')
    busy($('[type=submit]', f), async () => {
      try {
        const { error } = await sb.auth.mfa.challengeAndVerify({ factorId: factor.id, code })
        if (error) throw error
        if (replaceOthers) {
          const { data } = await sb.auth.mfa.listFactors()
          for (const fa of (data?.all || []).filter((x) => x.id !== factor.id)) await sb.auth.mfa.unenroll({ factorId: fa.id }).catch(() => {})
        }
        await onDone?.()
      } catch (err) { f.code.value = ''; alertBox(mfaErrorMessage(err)) }
    })
  }
}
function renderMfaSetupPage() {
  const card = authShell('Sécurisez votre compte', 'Double authentification obligatoire', html`<div class="stack">
    <p class="muted small">Pour protéger les données du cinéma (dont les coordonnées des clients), chaque connexion depuis un nouvel appareil demandera un code à 6 chiffres généré par votre téléphone. À activer une seule fois.</p>
    <div data-enroll-box></div>
    <button type="button" class="btn btn-ghost block" data-out>Se déconnecter</button></div>`)
  $('[data-out]', card).onclick = () => signOut(true)
  mountMfaEnroll($('[data-enroll-box]', card), { onDone: async () => { toast('Double authentification activée.'); ADM.profile = null; render() } })
}

function loginErrorMessage(e) {
  const m = String(e?.message || '')
  if (e?.code === 'invalid_credentials' || /invalid login credentials/i.test(m)) return 'Adresse e-mail ou mot de passe incorrect.'
  if (e?.code === 'user_banned' || /banned/i.test(m)) return 'Ce compte a été désactivé. Contactez l’administrateur principal.'
  if (e?.code === 'email_not_confirmed') return 'Ce compte n’a pas encore été activé : ouvrez le lien d’invitation reçu par e-mail.'
  if (e?.status === 429) return 'Trop de tentatives. Patientez quelques minutes.'
  if (/fetch|network/i.test(m)) return 'Connexion impossible. Vérifiez votre réseau.'
  return m || 'La connexion a échoué.'
}

async function renderLogin(message) {
  const card = authShell('Connexion', 'Espace interne', html`
    <form class="stack" novalidate>
      <div data-alert>${message ? html`<div class="alert success" role="status">${message}</div>` : ''}</div>
      <div class="field"><label for="l-email">Adresse e-mail</label><input class="input" id="l-email" name="email" type="email" inputmode="email" autocomplete="username" required autofocus></div>
      ${passwordField('password', 'Mot de passe')}
      <label class="check"><input type="checkbox" name="remember" ${attr(remember(), 'checked')}> Rester connecté sur cet appareil</label>
      <button class="btn btn-primary lg block" type="submit">${icon('lock')} Se connecter</button>
      <a class="link" style="text-align:center" href="${A('/mot-de-passe-oublie')}">Mot de passe oublié ?</a>
    </form><p data-setup class="hidden" style="margin-top:22px;text-align:center"></p>`)
  const form = $('form', card)
  form.addEventListener('submit', async (e) => {
    e.preventDefault()
    const email = form.email.value.trim(), password = form.password.value
    if (!email || !password) return formAlert(card, 'error', 'Renseignez l’adresse e-mail et le mot de passe.')
    await busy($('[type=submit]', form), async () => {
      formAlert(card)
      safe(() => localStorage.setItem(REMEMBER_KEY, form.remember.checked ? '1' : '0'))
      const { error } = await sb.auth.signInWithPassword({ email, password })
      if (error) return formAlert(card, 'error', loginErrorMessage(error))
      ADM.profile = null
      render()
    })
  })
  // Première installation : lien vers l'initialisation tant qu'aucun administrateur n'existe.
  api.isInitialized().then((done) => {
    if (!done) { const p = $('[data-setup]', card); if (p) { p.classList.remove('hidden'); setHTML(p, html`<a class="btn btn-outline block multiline" href="${A('/initialisation')}">${icon('shield')} Première installation : créer le compte principal</a>`) } }
  }).catch(() => {})
}

const AUTH_PAGES = {
  async forgot() {
    const card = authShell('Mot de passe oublié', 'Espace interne', html`
      <form class="stack" novalidate><p class="muted small">Indiquez l’adresse e-mail de votre compte : vous recevrez un lien pour choisir un nouveau mot de passe.</p>
        <div data-alert></div>
        <div class="field"><label for="f-email">Adresse e-mail</label><input class="input" id="f-email" name="email" type="email" inputmode="email" autocomplete="username" required autofocus></div>
        <button class="btn btn-primary lg block" type="submit">${icon('mail')} Envoyer le lien</button>
        <a class="link" style="text-align:center" href="${A()}">Retour à la connexion</a></form>`)
    const form = $('form', card)
    form.addEventListener('submit', (e) => {
      e.preventDefault()
      const email = form.email.value.trim()
      if (!isEmail(email)) return formAlert(card, 'error', 'Saisissez une adresse e-mail valide.')
      busy($('[type=submit]', form), async () => {
        const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: `${location.origin}${A('/nouveau-mot-de-passe')}` })
        if (error) return formAlert(card, 'error', error.status === 429 ? 'Trop de demandes rapprochées. Patientez quelques minutes.' : 'L’e-mail n’a pas pu être envoyé. Réessayez plus tard.')
        setHTML(form, html`<div class="alert success">Si un compte administrateur existe pour <b>${email}</b>, un e-mail avec un lien de réinitialisation vient d’être envoyé. Pensez à vérifier les courriers indésirables.</div>
          <a class="link" style="text-align:center" href="${A()}">Retour à la connexion</a>`)
      })
    })
  },

  async recovery() {
    if (LINK.error) return linkExpired('Réinitialisation du mot de passe', A('/mot-de-passe-oublie'), 'Demander un nouveau lien')
    const { data } = await sb.auth.getSession()
    if (!data.session) return linkExpired('Réinitialisation du mot de passe', A('/mot-de-passe-oublie'), 'Demander un lien', 'Ouvrez cette page depuis le lien reçu par e-mail.')
    const card = authShell('Nouveau mot de passe', data.session.user.email, html`
      <form class="stack" novalidate><div data-alert></div>
        ${passwordField('pw', 'Nouveau mot de passe', { autocomplete: 'new-password', hint: `${MIN_PASSWORD} caractères minimum` })}
        ${passwordField('pw2', 'Confirmer le mot de passe', { autocomplete: 'new-password' })}
        <button class="btn btn-primary lg block" type="submit">${icon('key')} Enregistrer le mot de passe</button></form>`)
    const form = $('form', card)
    form.addEventListener('submit', (e) => {
      e.preventDefault()
      const problem = passwordProblem(form.pw.value, form.pw2.value)
      if (problem) return formAlert(card, 'error', problem)
      busy($('[type=submit]', form), async () => {
        const { error } = await sb.auth.updateUser({ password: form.pw.value })
        if (error) return formAlert(card, 'error', pwError(error))
        LINK.type = null
        await sb.auth.signOut().catch(() => {})
        ADM.profile = null
        history.replaceState(null, '', A())
        render()
        setTimeout(() => formAlert($('.auth-card'), 'success', 'Mot de passe modifié. Connectez-vous avec votre nouveau mot de passe.'), 0)
      })
    })
  },

  async activation() {
    if (LINK.error) return linkExpired('Activation du compte', A(), 'Aller à la connexion', 'Ce lien d’invitation a expiré ou a déjà été utilisé. Demandez à l’administrateur principal de renvoyer l’invitation.')
    const { data } = await sb.auth.getSession()
    if (!data.session) return linkExpired('Activation du compte', A(), 'Aller à la connexion', 'Ouvrez cette page depuis le lien d’invitation reçu par e-mail.')
    let profile = null
    try { profile = await api.myProfile() } catch { /* ignoré */ }
    if (!profile) return renderAuthMessage('Invitation introuvable', 'Ce compte n’a pas (ou plus) d’invitation active.', true)
    if (profile.status === 'active' && LINK.type !== 'invite' && LINK.type !== 'recovery') return navigate(A(), { replace: true })
    if (profile.status === 'disabled') return renderAuthMessage('Compte désactivé', 'Ce compte a été désactivé par l’administrateur principal.', true)
    const card = authShell('Bienvenue !', 'Activation de votre compte administrateur', html`
      <form class="stack" novalidate>
        <p class="muted small">Vous avez été invité à gérer les affiches du cinéma Le Lido avec l’adresse <b>${data.session.user.email}</b>. Choisissez votre mot de passe.</p>
        <div data-alert></div>
        <div class="field"><label for="a-name">Votre nom (affiché dans l’historique)</label><input class="input" id="a-name" name="name" autocomplete="name" value="${profile.display_name || ''}" placeholder="Ex. Cinéma Le Lido"></div>
        ${passwordField('pw', 'Mot de passe', { autocomplete: 'new-password', hint: `${MIN_PASSWORD} caractères minimum` })}
        ${passwordField('pw2', 'Confirmer le mot de passe', { autocomplete: 'new-password' })}
        <button class="btn btn-primary lg block" type="submit">${icon('check')} Activer mon compte</button></form>`)
    const form = $('form', card)
    form.addEventListener('submit', (e) => {
      e.preventDefault()
      const problem = passwordProblem(form.pw.value, form.pw2.value)
      if (problem) return formAlert(card, 'error', problem)
      busy($('[type=submit]', form), async () => {
        const { error } = await sb.auth.updateUser({ password: form.pw.value })
        if (error && error.code !== 'same_password') return formAlert(card, 'error', pwError(error))
        try {
          const status = await api.rpc('activate_my_account')
          if (status !== 'active') return formAlert(card, 'error', 'Ce compte ne peut pas être activé (désactivé ?).')
          if (form.name.value.trim()) await api.rpc('update_my_display_name', { p_name: form.name.value.trim() })
        } catch (err) { return formAlert(card, 'error', errMsg(err)) }
        LINK.type = null
        ADM.profile = null
        toast('Compte activé. Bienvenue !')
        navigate(A(), { replace: true })
      })
    })
  },

  async setup() {
    let state
    try { state = await api.server('/api/setup') } catch (e) { return renderAuthMessage('Initialisation', errMsg(e), false, true) }
    if (state.initialized) return renderAuthMessage('Déjà initialisé', 'Le compte administrateur principal existe déjà. Connectez-vous normalement.', false)
    if (!state.setupEnabled) return renderAuthMessage('Initialisation désactivée', 'Ajoutez la variable SETUP_CODE (un code secret de 12 caractères minimum, choisi par vous) dans Vercel → Settings → Environment Variables, redéployez, puis revenez sur cette page.', false, true)
    const card = authShell('Première installation', 'Création du compte administrateur principal', html`
      <form class="stack" novalidate>
        <p class="muted small">Ce compte personnel aura tous les droits. Vous pourrez ensuite inviter le compte du cinéma et lui transférer l’administration.</p>
        <div data-alert></div>
        ${passwordField('code', 'Code d’initialisation (SETUP_CODE défini dans Vercel)', { autocomplete: 'off' })}
        <div class="field"><label for="s-name">Votre nom</label><input class="input" id="s-name" name="name" autocomplete="name"></div>
        <div class="field"><label for="s-email">Votre adresse e-mail</label><input class="input" id="s-email" name="email" type="email" inputmode="email" autocomplete="username" required></div>
        ${passwordField('pw', 'Mot de passe', { autocomplete: 'new-password', hint: `${MIN_PASSWORD} caractères minimum` })}
        ${passwordField('pw2', 'Confirmer le mot de passe', { autocomplete: 'new-password' })}
        <button class="btn btn-primary lg block" type="submit">${icon('shield')} Créer le compte principal</button></form>`)
    const form = $('form', card)
    form.addEventListener('submit', (e) => {
      e.preventDefault()
      if (!form.code.value) return formAlert(card, 'error', 'Saisissez le code d’initialisation.')
      if (!isEmail(form.email.value)) return formAlert(card, 'error', 'Adresse e-mail invalide.')
      const problem = passwordProblem(form.pw.value, form.pw2.value)
      if (problem) return formAlert(card, 'error', problem)
      busy($('[type=submit]', form), async () => {
        try {
          await api.server('/api/setup', { method: 'POST', body: { setupCode: form.code.value, email: form.email.value.trim(), password: form.pw.value, displayName: form.name.value } })
        } catch (err) { return formAlert(card, 'error', errMsg(err)) }
        history.replaceState(null, '', A())
        await renderLogin('Compte principal créé. Connectez-vous avec votre adresse et votre mot de passe.')
        $('#l-email').value = form.email.value.trim()
      })
    })
  },
}
function linkExpired(title, href, label, message = 'Ce lien a expiré ou a déjà été utilisé.') {
  authShell(title, 'Espace interne', html`<div class="stack"><div class="alert error">${message}</div>
    <a class="btn btn-primary block" href="${href}">${label}</a></div>`)
}
function pwError(error) {
  if (error.code === 'same_password') return 'Choisissez un mot de passe différent de l’ancien.'
  if (error.code === 'weak_password') return 'Mot de passe trop faible : allongez-le ou ajoutez des chiffres et symboles.'
  if (error.code === 'reauthentication_needed') return 'Par sécurité, déconnectez-vous puis utilisez « Mot de passe oublié ».'
  return error.message || 'Modification impossible.'
}

/* ═══════════════════════════════════════════════════════════════════════
   H. GESTION DES ADMINISTRATEURS (principal uniquement)
   ═══════════════════════════════════════════════════════════════════════ */
const ADMIN_PAGES = {}
ADMIN_PAGES.admins = async (page) => {
  setHTML(page, html`${pageHead('Gestion des administrateurs', 'Invitez des comptes, gérez leurs droits et transférez l’administration.', { back: [A('/reglages'), 'Réglages'] })}
    <div class="card pad" style="margin-bottom:24px">
      <form class="stack" data-invite novalidate>
        <div><h2 class="display" style="font-size:19px;font-weight:600">Inviter un administrateur</h2>
        <p class="muted small" style="margin-top:4px">La personne reçoit un e-mail avec un lien pour choisir son mot de passe. Elle aura d’abord le rôle « Administrateur ».</p></div>
        <div class="row wrap"><input class="input grow" style="min-width:220px" name="email" type="email" inputmode="email" placeholder="adresse@exemple.fr" aria-label="Adresse e-mail à inviter" autocomplete="off">
          <button class="btn btn-primary" type="submit">${icon('send')} Envoyer l’invitation</button></div>
      </form></div>
    <div data-list><div class="boot" style="min-height:120px"><span class="spinner"></span></div></div>
    <div class="card pad" style="margin-top:24px"><p class="eyebrow">Les deux niveaux de droits</p>
      <div class="grid2" style="margin-top:12px">
        <div><p style="font-weight:800">${icon('crown')} Administrateur principal</p><p class="muted small">Tout gérer : affiches, stocks, prix, emplacements, historique, PDF, réglages, comptes administrateurs, transfert du rôle principal.</p></div>
        <div><p style="font-weight:800">${icon('users')} Administrateur</p><p class="muted small">Ajouter et modifier les affiches, gérer les stocks, emplacements et tarifs, consulter l’historique, générer les inventaires. Ne peut ni inviter ni modifier les comptes.</p></div>
      </div></div>`)

  const list = $('[data-list]', page)
  let admins = []
  async function load() {
    try { admins = await api.admins() } catch (e) { setHTML(list, html`<div class="alert error">${errMsg(e)}</div>`); return }
    const me = ADM.profile.user_id
    const owners = admins.filter((a) => a.role === 'owner' && a.status === 'active').length
    setHTML(list, html`<div class="card divide">${admins.map((a) => {
      const self = a.user_id === me
      const tone = { active: 'ok', invited: 'warn', disabled: 'gray' }[a.status]
      return html`<div class="admin-row" data-id="${a.user_id}">
        <span class="avatar">${(a.display_name || a.email).slice(0, 1)}</span>
        <div class="who"><b>${a.display_name || a.email}${self ? ' (vous)' : ''}</b>
          ${a.display_name ? html`<span class="muted small">${a.email}</span>` : ''}
          <div class="row wrap" style="gap:6px;margin-top:6px"><span class="badge ${a.role === 'owner' ? 'brand' : 'gray'}">${a.role === 'owner' ? icon('crown') : ''} ${ROLE_LABELS[a.role]}</span>
            <span class="badge ${tone}">${ADMIN_STATUS_LABELS[a.status]}</span></div>
          <p class="muted xs" style="margin-top:6px">${a.status === 'invited'
            ? `Invité le ${fmtDateTime(a.last_invite_sent_at || a.invited_at)}`
            : a.activated_at ? `Actif depuis le ${fmtDate(a.activated_at)}` : ''}${a.disabled_at ? ` · désactivé le ${fmtDate(a.disabled_at)}` : ''}</p></div>
        <div class="row wrap" style="gap:6px">
          ${a.status === 'invited' ? html`<button class="btn btn-secondary sm" data-act="resend">${icon('send')} Renvoyer</button>` : ''}
          ${a.status === 'active' && !self ? html`<button class="btn btn-ghost sm" data-act="reset-mfa">${icon('shield')} Réinitialiser la double authentification</button>` : ''}
          ${a.status === 'active' && !self && a.role === 'admin' ? html`<button class="btn btn-primary sm" data-act="transfer">${icon('crown')} Transférer le rôle principal</button>` : ''}
          ${a.status === 'active' && !self && a.role === 'admin' ? html`<button class="btn btn-secondary sm" data-act="promote">Rendre principal aussi</button>` : ''}
          ${a.role === 'owner' && !self ? html`<button class="btn btn-secondary sm" data-act="demote">Passer administrateur</button>` : ''}
          ${a.status !== 'disabled' && !(self && owners <= 1) ? html`<button class="btn btn-ghost sm" data-act="disable">${icon('ban')} Désactiver</button>` : ''}
          ${a.status === 'disabled' ? html`<button class="btn btn-secondary sm" data-act="enable">${icon('undo')} Réactiver</button>` : ''}
          ${!self ? html`<button class="btn btn-danger-ghost sm" data-act="remove">${icon('trash')} ${a.status === 'invited' ? 'Annuler l’invitation' : 'Retirer l’accès'}</button>` : ''}
        </div></div>`
    })}</div>
    ${owners <= 1 ? html`<p class="muted small" style="margin-top:10px">${icon('info')} Il doit toujours rester au moins un administrateur principal actif : vous ne pouvez pas désactiver ni retirer votre compte tant que vous êtes le seul.</p>` : ''}`)
  }
  await load()

  const form = $('[data-invite]', page)
  form.addEventListener('submit', (e) => {
    e.preventDefault()
    const email = form.email.value.trim()
    if (!isEmail(email)) return toast('Adresse e-mail invalide.', 'error')
    busy($('[type=submit]', form), async () => {
      try {
        const r = await api.server('/api/admins', { method: 'POST', body: { action: 'invite', email } })
        toast(r.message || 'Invitation envoyée.')
        form.reset()
        await load()
      } catch (err) { toast(errMsg(err), 'error') }
    })
  })

  list.addEventListener('click', async (e) => {
    const btn = e.target.closest('[data-act]')
    if (!btn) return
    const id = btn.closest('[data-id]').dataset.id
    const a = admins.find((x) => x.user_id === id)
    const who = a.display_name || a.email
    const act = btn.dataset.act
    const run = (fn, okMsg) => busy(btn, async () => {
      try { const r = await fn(); toast(r?.message || okMsg); await recheckAccess(); await load() } catch (err) { toast(errMsg(err), 'error') }
    })
    if (act === 'resend') return run(() => api.server('/api/admins', { method: 'POST', body: { action: 'resend', userId: id } }), 'Invitation renvoyée.')
    if (act === 'reset-mfa') {
      if (!(await confirmDialog({ title: 'Réinitialiser la double authentification ?', confirmLabel: 'Réinitialiser',
        message: html`<p>À utiliser si <b>${who}</b> a perdu ou changé de téléphone. À sa prochaine connexion, il activera un nouveau téléphone. Aucune donnée n’est modifiée.</p><p class="muted small" style="margin-top:8px">En cas de vol du téléphone, désactivez plutôt le compte.</p>` }))) return
      return run(() => api.server('/api/admins', { method: 'POST', body: { action: 'reset-mfa', userId: id } }), 'Double authentification réinitialisée.')
    }
    if (act === 'transfer') {
      const r = await confirmDialog({
        title: 'Transférer le rôle principal ?',
        message: html`<p><b>${who}</b> deviendra administrateur principal : il pourra gérer les comptes et les réglages. Vous deviendrez administrateur. Aucune donnée n’est modifiée : films, affiches, stocks, photos, historique et réglages sont conservés.</p>`,
        extra: html`<label class="check"><input type="checkbox" name="keep"> Rester également administrateur principal</label>`,
        confirmLabel: 'Transférer',
      })
      if (!r) return
      return busy(btn, async () => {
        try {
          await api.rpc('transfer_ownership', { p_user_id: id, p_keep_me_owner: Boolean(r.keep) })
          toast(`${who} est maintenant administrateur principal.`)
          await recheckAccess()
          if (!isOwner()) { ADM.shell = false; navigate(A('/reglages'), { replace: true }) } else await load()
        } catch (err) { toast(errMsg(err), 'error') }
      })
    }
    if (act === 'promote') return run(() => api.rpc('admin_set_role', { p_user_id: id, p_role: 'owner' }), `${who} est aussi administrateur principal.`)
    if (act === 'demote') return run(() => api.rpc('admin_set_role', { p_user_id: id, p_role: 'admin' }), `${who} est maintenant administrateur.`)
    if (act === 'enable') return run(() => api.server('/api/admins', { method: 'POST', body: { action: 'enable', userId: id } }), 'Compte réactivé.')
    if (act === 'disable') {
      const self = id === ADM.profile.user_id
      if (!(await confirmDialog({ title: 'Désactiver ce compte ?', danger: true, confirmLabel: 'Désactiver',
        message: html`<p>${self ? 'Vous serez déconnecté immédiatement et ne pourrez plus vous connecter.' : html`<b>${who}</b> perdra immédiatement l’accès à l’administration.`} L’historique de ses actions est conservé. Le compte peut être réactivé à tout moment.</p>` }))) return
      return busy(btn, async () => {
        try {
          await api.server('/api/admins', { method: 'POST', body: { action: 'disable', userId: id } })
          if (self) return signOut()
          toast('Compte désactivé.')
          await load()
        } catch (err) { toast(errMsg(err), 'error') }
      })
    }
    if (act === 'remove') {
      if (!(await confirmDialog({ title: a.status === 'invited' ? 'Annuler l’invitation ?' : 'Retirer l’accès ?', danger: true, confirmLabel: 'Retirer',
        message: html`<p>Le compte de connexion de <b>${who}</b> sera supprimé. L’historique de ses actions reste consultable. Pour une suspension temporaire, préférez « Désactiver ».</p>` }))) return
      return run(() => api.server('/api/admins', { method: 'POST', body: { action: 'remove', userId: id } }), 'Accès retiré.')
    }
  })
}

/* ═══════════════════════════════════════════════════════════════════════
   I. STOCK : composants partagés
   ═══════════════════════════════════════════════════════════════════════ */
const AVAIL_TONE = { available: 'ok', upcoming: 'soon', soldout: 'danger', hidden: 'warn', archived: 'gray' }
const availBadge = (v) => {
  const a = availability(v)
  const reserved = visualReserved(v)
  const allTaken = reserved > 0 && v.stocks.every((s) => s.quantity - stockReserved(s.id) <= 0)
  return html`<span class="badge ${AVAIL_TONE[a]}">${a === 'upcoming' ? html`${icon('calendar')} En vente dès le ${formatDay(v.available_from, { day: 'numeric', month: 'short' })}` : AVAILABILITY_LABELS[a]}</span>${allTaken ? html`<span class="badge full">${icon('bookmark')} Tout est réservé</span>` : reserved ? html`<span class="badge soon">${icon('bookmark')} ${reserved} réservé${reserved > 1 ? 's' : ''}</span>` : ''}`
}
const findVisual = (id) => ADM.visuals.find((v) => v.id === id)
const stockReserved = (stockId) => reservedQty(ADM.reservations, stockId)
const visualReserved = (v) => v.stocks.reduce((n, s) => n + stockReserved(s.id), 0)

function qtyControl(row) {
  const q = row.stock.quantity
  const free = q - stockReserved(row.stock.id)
  const d = `data-v="${esc(row.visual.id)}" data-f="${row.format.id}" data-l="${esc(row.location.id)}"`
  return html`<div class="qty">
    <button type="button" ${raw(d)} data-qty="minus" ${attr(free <= 0, 'disabled')} aria-label="Retirer un exemplaire (${row.format.label}, ${row.location.name})">${icon('minus')}</button>
    <output class="${q === 0 ? 'zero' : ''}" aria-label="${q} exemplaire${q > 1 ? 's' : ''}">${q}</output>
    <button type="button" class="plus" ${raw(d)} data-qty="plus" aria-label="Ajouter un exemplaire (${row.format.label}, ${row.location.name})">${icon('plus')}</button></div>`
}

function visualCard(v, { locationId } = {}) {
  const rows = stockRows([v], ADM.formats, ADM.locations, { locationId })
  const total = totalQuantity(v)
  return html`<article class="card vcard" data-card="${v.id}">
    <div class="top">
      <a href="${A(`/affiche/${v.id}`)}" aria-label="Ouvrir la fiche ${v.reference_code}">${posterHtml(img.visual(v, 'thumb'), v.label || v.film.title)}</a>
      <div class="grow">
        <div class="row between" style="align-items:flex-start"><h3><a href="${A(`/affiche/${v.id}`)}">${v.film.title}${yearOf(v.film) ? html` <span class="muted" style="font-family:var(--font);font-size:13.5px;font-weight:600">(${yearOf(v.film)})</span>` : ''}</a></h3>
          <a class="icon-btn" style="margin:-6px -6px 0 0" href="${A(`/affiche/${v.id}`)}" aria-label="Ouvrir la fiche">${icon('chevR')}</a></div>
        <p class="sub truncate"><span class="mono" style="color:var(--ink-2)">${v.reference_code}</span>${v.label ? ` · ${v.label}` : ''}</p>
        <div class="row wrap" style="gap:8px;margin-top:8px">${availBadge(v)}<span class="xs muted" style="font-weight:700">${plural(total, 'exemplaire')} au total</span></div>
      </div></div>
    ${rows.length ? html`<div class="lines">${rows.map((r) => html`<div class="sline"><p class="where"><b>${r.format.label}</b> · ${r.location.name}${reservedNote(r.stock)}</p>${qtyControl(r)}</div>`)}</div>`
      : html`<button class="dashed-btn" data-add-stock="${v.id}">${icon('packagePlus')} ${locationId ? 'Ajouter des exemplaires ici' : 'Remettre en stock'}</button>`}
  </article>`
}

function reservedNote(stock) {
  const n = stockReserved(stock.id)
  return n ? html`<span class="resa-note">${icon('bookmark')} ${n} réservé${n > 1 ? 's' : ''} · ${Math.max(stock.quantity - n, 0)} libre${stock.quantity - n > 1 ? 's' : ''}</span>` : ''
}

/** Clic sur −/+ et « Remettre en stock » dans n'importe quelle page d'administration. */
function bindStockControls(root, after) {
  root.addEventListener('click', async (e) => {
    const b = e.target.closest('button[data-qty]')
    if (b) {
      const args = { visualId: b.dataset.v, formatId: Number(b.dataset.f), locationId: b.dataset.l }
      if (b.dataset.qty === 'plus') return busy(b, () => moveStock({ ...args, delta: 1, reason: 'stock_in' }).then((r) => r && after?.()))
      return removeSheet(args, after)
    }
    const add = e.target.closest('[data-add-stock]')
    if (add) addStockSheet(findVisual(add.dataset.addStock), {}, after)
  })
}

async function moveStock({ visualId, formatId, locationId, delta, reason, note }) {
  try {
    const q = await api.rpc('adjust_stock', { p_visual_id: visualId, p_format_id: formatId, p_location_id: locationId, p_delta: delta, p_reason: reason, p_note: note || null })
    ADM.visuals = applyQuantity(ADM.visuals, visualId, formatId, locationId, q)
    ADM.movementVersion++
    toast(`${REASONS[reason]} : ${delta > 0 ? '+' : '−'}${Math.abs(delta)} · reste ${q}`)
    return true
  } catch (err) {
    toast(errMsg(err), 'error')
    reloadAdmin()
    return false
  }
}

function rowLabel({ visualId, formatId, locationId }) {
  const v = findVisual(visualId)
  const f = ADM.formats.find((x) => x.id === formatId)
  const l = ADM.locations.find((x) => x.id === locationId)
  const q = v?.stocks.find((s) => s.format_id === formatId && s.location_id === locationId)?.quantity ?? 0
  return { v, f, l, q, text: `${v?.film.title} · ${v?.reference_code} · ${f?.label} · ${l?.name}` }
}

function removeSheet(args, after) {
  const { v, q, text } = rowLabel(args)
  const stock = v?.stocks.find((s) => s.format_id === args.formatId && s.location_id === args.locationId)
  const reserved = stock ? stockReserved(stock.id) : 0
  const free = Math.max(q - reserved, 0)
  const upcoming = isUpcoming(v)
  const m = openModal({
    title: 'Retirer du stock', size: 'sm',
    body: html`<div class="stack"><p class="muted small">${text} — ${plural(q, 'exemplaire')} en stock${reserved ? html` dont <b>${reserved} réservé${reserved > 1 ? 's' : ''}</b> pour des clients` : ''}</p>
      ${upcoming ? html`<div class="alert warn">${icon('calendar')} Pas encore en vente : disponible à la vente à partir du <b>${formatDay(v.available_from)}</b>. Vous pouvez la réserver pour un client depuis sa fiche.</div>` : ''}
      <div class="row between" style="padding:12px;border:1px solid var(--line);border-radius:16px;background:var(--surface)"><b>Quantité à retirer</b>${stepperHtml('qty', 1, { min: 1, max: Math.max(1, free), label: 'Quantité à retirer' })}</div>
      <div class="field"><label for="rm-note">Commentaire (facultatif)</label><input class="input" id="rm-note" name="note" placeholder="Raison, précision…"></div>
      <p class="eyebrow">Motif</p>
      <div class="grid2" style="gap:8px">${REMOVAL_REASONS.map((r, i) => html`<button class="btn ${i === 0 ? 'btn-primary' : 'btn-secondary'} lg" style="${i === 0 || r === 'other' ? 'grid-column:1/-1' : ''}" data-reason="${r}" ${attr(i === 0 && !upcoming, 'data-autofocus')} ${attr(r === 'sale' && upcoming, 'disabled')}>${REASONS[r]}${r === 'sale' && upcoming ? ` (dès le ${formatDay(v.available_from, { day: 'numeric', month: 'short' })})` : ''}</button>`)}</div></div>`,
  })
  m.el.addEventListener('click', (e) => {
    const b = e.target.closest('[data-reason]')
    if (!b) return
    const all = $$('[data-reason]', m.el), was = all.map((x) => x.disabled)
    all.forEach((x) => { if (x !== b) x.disabled = true })
    busy(b, async () => {
      const okk = await moveStock({ ...args, delta: -stepperValue(m.el, 'qty'), reason: b.dataset.reason, note: $('#rm-note', m.el).value })
      all.forEach((x, i) => (x.disabled = was[i]))
      if (okk) { m.close(); after?.() }
    })
  })
}

const LAST_LOC = 'ca-last-location'
const lastLocation = () => { const id = safe(() => localStorage.getItem(LAST_LOC), null); return ADM.locations.find((l) => l.id === id && l.is_active)?.id || null }
const rememberLocation = (id) => safe(() => localStorage.setItem(LAST_LOC, id))

function locationPickerHtml(name, value, { exclude } = {}) {
  const list = ADM.locations.filter((l) => (l.is_active || l.id === value) && l.id !== exclude)
  return html`<div class="loc-pick" role="radiogroup" data-locpick="${name}" ${attr(exclude, 'data-exclude', exclude || '')}>
    ${list.map((l) => html`<button type="button" role="radio" aria-checked="${String(l.id === value)}" data-loc="${l.id}">${l.id === value ? icon('check') : ''}${l.name}</button>`)}
    <button type="button" class="new" data-newloc>${icon('plus')} Nouvel emplacement</button></div>

document.addEventListener('click', async (e) => {
  const pick = e.target.closest('[data-locpick] [data-loc]')
  if (pick) {
    const box = pick.parentElement
    $$('[data-loc]', box).forEach((b) => { const on = b === pick; b.setAttribute('aria-checked', String(on)); const svg = $('svg', b); if (on && !svg) b.insertAdjacentHTML('afterbegin', toHtml(icon('check'))); if (!on && svg) svg.remove() })
    box.dispatchEvent(new CustomEvent('change', { bubbles: true }))
    return
  }
  const nb = e.target.closest('[data-locpick] [data-newloc]')
  if (nb) {
    const name = await promptDialog('Nouvel emplacement', 'Nom de l’emplacement', 'Ex. Réserve B, Carton 3, Derrière la caisse')
    if (!name) return
    try {
      const loc = await api.insert('locations', { name: name.trim() })
      ADM.locations = await api.locations()
      const box = nb.parentElement
      const tmp = document.createElement('div')
      setHTML(tmp, locationPickerHtml(box.dataset.locpick, loc.id, { exclude: box.dataset.exclude }))
      box.nextElementSibling?.classList.contains('hint') && box.nextElementSibling.remove()
      box.replaceWith(...tmp.childNodes)
      toast(`Emplacement « ${loc.name} » créé`)
    } catch (err) { toast(errMsg(err), 'error') }
  }
})
const locPickValue = (root, name) => $(`[data-locpick="${name}"] [aria-checked="true"]`, root)?.dataset.loc || null

function promptDialog(title, label, placeholder = '', value = '') {
  return new Promise((resolve) => {
    const m = openModal({ title, size: 'sm',
      body: html`<form class="field" data-f><label for="pd-in">${label}</label><input class="input" id="pd-in" name="v" value="${value}" placeholder="${placeholder}" data-autofocus autocomplete="off"></form>`,
      footer: html`<div class="row"><button class="btn btn-secondary block" data-close>Annuler</button><button class="btn btn-primary block" data-ok>Valider</button></div>`,
      onClose: (r) => resolve(r || null) })
    const submit = () => { const v = $('#pd-in', m.el).value.trim(); if (v) m.close(v) }
    $('[data-ok]', m.el).addEventListener('click', submit)
    $('[data-f]', m.el).addEventListener('submit', (e) => { e.preventDefault(); submit() })
  })
}

function correctSheet(v, row, after) {
  const m = openModal({ title: 'Corriger la quantité', size: 'sm',
    body: html`<div class="stack"><p class="muted small">${row.format.label} · ${row.location.name}</p>
      <p>Quantité enregistrée : <b>${row.stock.quantity}</b>. Indiquez le nombre réellement compté.</p>
      ${stockReserved(row.stock.id) ? html`<p class="hint">${icon('bookmark')} ${stockReserved(row.stock.id)} exemplaire(s) réservé(s) ici : la quantité ne peut pas descendre en dessous (annulez d’abord une réservation si besoin).</p>` : ''}
      ${stepperHtml('qty', row.stock.quantity, { min: stockReserved(row.stock.id), size: 'lg', label: 'Quantité comptée' })}
      <div class="field"><label for="cs-note">Commentaire (facultatif)</label><input class="input" id="cs-note" placeholder="Ex. inventaire du 1er décembre"></div></div>`,
    footer: html`<button class="btn btn-primary lg block" data-ok>Enregistrer la correction</button>` })
  $('[data-ok]', m.el).addEventListener('click', (e) => busy(e.currentTarget, async () => {
    const qn = stepperValue(m.el, 'qty')
    if (qn === row.stock.quantity) return m.close()
    try {
      const q = await api.rpc('set_stock_quantity', { p_visual_id: v.id, p_format_id: row.format.id, p_location_id: row.location.id, p_quantity: qn, p_note: $('#cs-note', m.el).value || null })
      ADM.visuals = applyQuantity(ADM.visuals, v.id, row.format.id, row.location.id, q)

      toast(`Quantité corrigée : ${q}`)
      m.close(); after?.()
    } catch (err) { toast(errMsg(err), 'error') }
  }))
}

function transferSheet(v, row, after) {
  const free = Math.max(row.stock.quantity - stockReserved(row.stock.id), 0)
  if (!free) return toast('Tous les exemplaires de cet emplacement sont réservés : rien à déplacer.', 'error')
  const m = openModal({ title: 'Déplacer des exemplaires',
    body: html`<div class="stack"><p class="muted small">${v.film.title} · ${v.reference_code} · ${row.format.label} · depuis <b>${row.location.name}</b> (${row.stock.quantity} en stock${free < row.stock.quantity ? `, ${free} libre${free > 1 ? 's' : ''}` : ''})</p>
      <div class="field"><span class="label">Quantité à déplacer</span>${stepperHtml('qty', free, { min: 1, max: free, size: 'lg', label: 'Quantité à déplacer' })}</div>
      <div class="field"><span class="label">Vers l’emplacement</span>${locationPickerHtml('to', null, { exclude: row.location.id })}</div>
      <div class="field"><label for="ts-note">Commentaire (facultatif)</label><input class="input" id="ts-note"></div>
      <p class="hint">Le stock total ne change pas : deux lignes « Transfert d’emplacement » sont ajoutées à l’historique.</p></div>`,
    footer: html`<button class="btn btn-primary lg block" data-ok>${icon('transfer')} Déplacer</button>` })
  $('[data-ok]', m.el).addEventListener('click', (e) => {
    const to = locPickValue(m.el, 'to')
    if (!to) return toast('Choisissez l’emplacement de destination.', 'error')
    busy(e.currentTarget, async () => {
      try {
        const n = stepperValue(m.el, 'qty')
        await api.rpc('transfer_stock', { p_visual_id: v.id, p_format_id: row.format.id, p_from_location_id: row.location.id, p_to_location_id: to, p_quantity: n, p_note: $('#ts-note', m.el).value || null })
        await loadAdminData()
        ADM.movementVersion++
        toast(`${plural(n, 'exemplaire déplacé', 'exemplaires déplacés')}`)
        m.close(); after?.()
      } catch (err) { toast(errMsg(err), 'error') }
    })
  })
}

function movementList(moves, { showVisual = true } = {}) {
  const groups = []
  for (const mv of moves) {
    const d = fmtDay(mv.created_at)
    if (groups.at(-1)?.day === d) groups.at(-1).items.push(mv)
    else groups.push({ day: d, items: [mv] })
  }
  return html`<div class="moves">${groups.map((g) => html`<section><p class="eyebrow" style="margin-bottom:8px">${g.day}</p><ul>${g.items.map((m) => html`<li>
    <span class="delta ${m.reason === 'transfer' ? 'move' : m.delta > 0 ? 'pos' : 'neg'}">${m.delta > 0 ? '+' : '−'}${Math.abs(m.delta)}</span>
    <div class="what grow">
      ${showVisual ? html`<a href="${A(`/affiche/${m.visual_id}`)}">${m.film_title} <span class="mono xs muted">${m.visual_ref}</span></a>` : ''}
      <p style="color:var(--ink-2)"><b>${REASONS[m.reason]}</b> · ${m.format_label} · ${m.location_name}</p>
      ${m.note ? html`<p class="muted" style="font-style:italic">« ${m.note} »</p>` : ''}
      <p class="xs" style="color:var(--ink-4);margin-top:2px">${fmtTime(m.created_at)} · stock ${m.quantity_before} → ${m.quantity_after} · ${m.actor_name}</p>
    </div></li>`)}</ul></section>`)}</div>`
}

  const drawStats = () => {
    const s = dashboardStats(ADM.visuals)
    setHTML($('[data-stats]', page), [
      ['layers', s.totalCopies, 'Exemplaires disponibles', A('/stock')],
      ['images', s.availableRefs, 'Références d’affiches', A('/stock?statut=available')],
      ['film', s.films, 'Films distincts', A('/stock?statut=available')],
      ['packageX', s.soldOutRefs, 'Références épuisées', A('/stock?statut=soldout'), s.soldOutRefs > 0],
    ].map(([ic, n, l, href, alert]) => html`<a class="card stat ${alert ? 'alert-on' : ''}" href="${href}">${icon(ic)}<b>${n.toLocaleString('fr-FR')}</b><span>${l}</span></a>`))
  }
  const drawTodo = () => {
    const today = todayParis()
    const counts = {}
    for (const r of ADM.reservations) if (r.status === 'active') { const st = reservationInfo(r, findVisual(r.visual_id), ADM.settings, today).state; counts[st] = (counts[st] || 0) + 1 }
    const parts = [['to_notify', 'client(s) à prévenir'], ['to_remind', 'client(s) à rappeler'], ['overdue', 'délai(s) dépassé(s)']].filter(([k]) => counts[k]).map(([k, l]) => `${counts[k]} ${l}`)
    setHTML($('[data-todo]', page), parts.length ? html`<a class="todo-card" style="margin-top:14px" href="${A('/reservations')}">${icon('bell')}<span class="grow">Réservations : ${parts.join(' · ')}</span>${icon('chevR')}</a>` : '')
  }
  const drawResults = () => {
    const q = input.value.trim()
    $('[data-clear]', page).classList.toggle('hidden', !q)
    if (!q) return setHTML($('[data-results]', page), '')
    const list = filterAdminVisuals(ADM.visuals, { query: q, status: 'active' }, ADM.formats, ADM.locations).slice(0, 30)
    setHTML($('[data-results]', page), list.length ? list.map((v) => visualCard(v))
      : html`<div class="empty"><h3>Aucune affiche trouvée</h3><p>Aucun visuel ne correspond à « ${q} ».</p><a class="btn btn-primary" href="${A('/ajouter')}">${icon('plus')} Ajouter une affiche</a></div>`)

    if (version === ADM.movementVersion) return
    version = ADM.movementVersion
    try {
      const moves = await api.movements({ limit: 8 })
      setHTML($('[data-moves]', page), moves.length ? movementList(moves) : html`<div class="empty"><div class="ico">${icon('history')}</div><h3>Aucun mouvement</h3><p>Les entrées, ventes et corrections apparaîtront ici.</p></div>`)

  }
  bindBinderActions($('[data-binder]', page), () => drawBinder())
  const refresh = () => { drawStats(); drawTodo(); drawBinder(); drawResults(); drawMoves() }
  bindStockControls(page, refresh)
  ADM.refreshView = refresh
  refresh()
}

                  <div class="row" style="gap:2px;margin-top:2px"><button class="btn btn-ghost sm" style="height:30px;padding:0 6px" data-correct="${r.stock.id}">${icon('listChecks')} Corriger</button>
                  <button class="btn btn-ghost sm" style="height:30px;padding:0 6px" data-transfer="${r.stock.id}" ${attr(r.stock.quantity === 0, 'disabled')}>${icon('transfer')} Déplacer</button></div></div>${qtyControl(r)}</div>`)}

        </div></div>`)
    api.movements({ visualId: v.id, limit: 30 }).then((m) => { const box = $('[data-moves]', page); if (box) setHTML(box, m.length ? movementList(m, { showVisual: false }) : html`<p class="muted small">Aucun mouvement.</p>`) }).catch(() => {})

    $('[data-act="reserve"]', page).onclick = () => reserveSheet(v, draw)
    const catBtn = $('[data-act="catalogue"]', page)
    if (catBtn) catBtn.onclick = () => catalogueModal([v], 'Page du catalogue papier', draw)
    const fromInput = $('#v-from', page)
    const saveFrom = async (val) => {
      if ((val || null) === (v.available_from || null)) return
      try { await api.update('poster_visuals', { id: v.id }, { available_from: val || null }); v.available_from = val || null; toast(val ? `En vente à partir du ${formatDay(val)}` : 'En vente dès maintenant'); draw() } catch (err) { toast(errMsg(err), 'error'); draw() }
    }
    fromInput.onchange = () => saveFrom(fromInput.value)
    const fc = $('[data-act="from-clear"]', page)
    if (fc) fc.onclick = () => saveFrom(null)
    $('[data-act="photo"]', page).onclick = () => photoSheet(async (photo) => {
      const folder = `visuals/${v.id}/${Date.now()}`
      const full = `${folder}/full.jpg`, thumb = `${folder}/thumb.jpg`
      try {
        await api.upload(full, photo.full)
        await api.upload(thumb, photo.thumb)
        const old = [v.image_path, v.thumb_path]
        await api.update('poster_visuals', { id: v.id }, { source: 'photo', image_path: full, thumb_path: thumb })
        await api.removeFiles(old).catch(() => {})
        await loadAdminData(); toast('Photo enregistrée'); draw()
        return true
      } catch (err) { await api.removeFiles([full, thumb]).catch(() => {}); toast(errMsg(err), 'error'); return false }
    })
    const back = $('[data-act="back-tmdb"]', page)
    if (back) back.onclick = () => busy(back, async () => {
      try { const old = [v.image_path, v.thumb_path]; await api.update('poster_visuals', { id: v.id }, { source: 'tmdb', image_path: null, thumb_path: null }); await api.removeFiles(old).catch(() => {}); await loadAdminData(); toast('Visuel TMDB rétabli'); draw() } catch (err) { toast(errMsg(err), 'error') }
    })
    const label = $('#v-label', page)
    label.onblur = async () => { const val = label.value.trim(); if (val === (v.label || '')) return; try { await api.update('poster_visuals', { id: v.id }, { label: val || null }); v.label = val || null; toast('Nom du visuel enregistré') } catch (err) { toast(errMsg(err), 'error') } }
    label.onkeydown = (e) => { if (e.key === 'Enter') label.blur() }
    $('[data-seg="status"]', page).addEventListener('change', async (e) => {
      const st = e.detail
      if (st === 'archived' && !(await confirmDialog({ title: 'Archiver cette affiche ?', message: 'Elle sera retirée de la vitrine et des listes courantes. Son historique et ses informations sont conservés ; vous pourrez la republier à tout moment.', confirmLabel: 'Archiver' }))) return draw()
      try { await api.update('poster_visuals', { id: v.id }, { status: st }); v.status = st; toast(`Affiche ${STATUS_LABELS[st].toLowerCase()}`); draw() } catch (err) { toast(errMsg(err), 'error'); draw() }
    })
    $$('[data-price]', page).forEach((input) => {
      input.onkeydown = (e) => { if (e.key === 'Enter') input.blur() }
      input.onblur = async () => {
        const fid = Number(input.dataset.price)
        const cents = parsePriceToCents(input.value)
        const current = v.prices.find((pr) => pr.format_id === fid)?.price_cents ?? null
        if (Number.isNaN(cents)) return toast('Prix invalide (ex. 12,50).', 'error')
        if (cents === current) return
        try {
          if (cents === null) await api.remove('prices', { visual_id: v.id, format_id: fid })
          else ok(await sb.from('prices').upsert({ visual_id: v.id, format_id: fid, price_cents: cents }, { onConflict: 'visual_id,format_id' }))
          await loadAdminData(); toast(cents === null ? 'Prix par défaut rétabli' : 'Prix enregistré'); draw()
        } catch (err) { toast(errMsg(err), 'error') }
      }
    })
    page.onclick = (e) => {
      const rs = e.target.closest('[data-price-reset]')
      if (rs) { const i = $(`[data-price="${rs.dataset.priceReset}"]`, page); i.value = ''; i.dispatchEvent(new Event('blur')) }
      const af = e.target.closest('[data-add-format]')
      if (af) addStockSheet(v, { formatId: Number(af.dataset.addFormat) }, draw)
      const c = e.target.closest('[data-correct]')
      if (c) correctSheet(v, rowsAll.find((r) => r.stock.id === c.dataset.correct), draw)
      const t = e.target.closest('[data-transfer]')
      if (t) transferSheet(v, rowsAll.find((r) => r.stock.id === t.dataset.transfer), draw)
    }
  }
  bindStockControls(page, draw)
  bindResaActions(page, draw)
  bindBinderActions(page, draw)
  ADM.refreshView = draw
  await draw()
}

function locationCounts() {
  const map = new Map()
  for (const v of ADM.visuals) {
    if (v.status === 'archived') continue
    for (const s of v.stocks) {
      if (s.quantity <= 0) continue
      const e = map.get(s.location_id) || { copies: 0, refs: new Set() }
      e.copies += s.quantity; e.refs.add(v.id); map.set(s.location_id, e)
    }
  }
  return map
}
ADMIN_PAGES.locations = async (page) => {
  const draw = () => {
    const counts = locationCounts()
    setHTML(page, html`${pageHead('Emplacements', 'Où sont rangées les affiches. Informations strictement internes.')}
      <form class="card pad row wrap" data-new style="margin-bottom:20px"><input class="input grow" style="min-width:220px" name="name" placeholder="Nouvel emplacement (ex. Réserve B, Carton 4, Armoire)" aria-label="Nom du nouvel emplacement" autocomplete="off">
        <button class="btn btn-primary" type="submit">${icon('plus')} Créer</button></form>
      ${ADM.locations.length ? html`<div class="vgrid two">${ADM.locations.map((l) => { const c = counts.get(l.id); return html`<a class="card list-link" href="${A(`/emplacements/${l.id}`)}">
        <span class="ico">${icon('pin')}</span><span class="grow"><b class="display" style="font-size:18px;font-weight:600">${l.name}</b> ${l.is_active ? '' : html`<span class="badge gray">Inactif</span>`}<br>
        <span class="muted small">${c ? `${plural(c.copies, 'exemplaire')} · ${plural(c.refs.size, 'visuel')}` : 'Vide'}</span></span>${icon('chevR')}</a>` })}</div>`
        : html`<div class="empty"><div class="ico">${icon('pin')}</div><h3>Aucun emplacement</h3><p>Créez vos zones de rangement : réserve, cartons, armoire…</p></div>`}`)
    $('[data-new]', page).onsubmit = (e) => {
      e.preventDefault()
      const name = e.target.name.value.trim()
      if (!name) return
      busy($('[type=submit]', e.target), async () => {
        try { const l = await api.insert('locations', { name }); ADM.locations = await api.locations(); toast(`Emplacement « ${l.name} » créé`); draw() } catch (err) { toast(errMsg(err), 'error') }
      })
    }
  }
  ADM.refreshView = draw
  draw()
}
ADMIN_PAGES.location = async (page, { id }) => {
  const draw = () => {
    const l = ADM.locations.find((x) => x.id === id)
    if (!l) return setHTML(page, html`<div class="empty"><h3>Emplacement introuvable</h3><a class="btn btn-secondary" href="${A('/emplacements')}">Retour</a></div>`)
    const here = filterAdminVisuals(ADM.visuals, { locationId: id, status: 'all' }, ADM.formats, ADM.locations)
    const copies = here.reduce((s, v) => s + v.stocks.filter((x) => x.location_id === id).reduce((a, x) => a + x.quantity, 0), 0)
    const everUsed = ADM.visuals.some((v) => v.stocks.some((s) => s.location_id === id))
    setHTML(page, html`${pageHead(l.name, `${plural(copies, 'exemplaire')} · ${plural(here.length, 'visuel')}`, { back: [A('/emplacements'), 'Emplacements'],
        actions: html`<a class="btn btn-secondary" href="${A(`/inventaire?emplacement=${id}`)}">${icon('printer')} Inventaire</a>` })}
      <div class="split side-r">
        <section>${here.length > 4 ? html`<div class="search" style="margin-bottom:12px">${icon('search')}<input class="input" type="search" data-q placeholder="Filtrer…" aria-label="Filtrer"></div>` : ''}
          <div class="vgrid" data-list>${here.length ? here.map((v) => visualCard(v, { locationId: id })) : html`<div class="empty"><h3>Emplacement vide</h3><p>Aucune affiche en stock ici pour le moment.</p></div>`}</div></section>
        <aside><div class="card pad stack">
          <div class="field"><label for="l-name">Nom</label><input class="input" id="l-name" value="${l.name}"></div>
          <div class="field"><label for="l-notes">Notes internes</label><textarea class="textarea" id="l-notes" placeholder="Ex. étagère du haut, à gauche">${l.notes || ''}</textarea></div>
          ${switchHtml('active', l.is_active, 'Actif', 'Un emplacement inactif n’est plus proposé lors des ajouts.')}
          <button class="btn btn-danger-ghost" data-del ${attr(everUsed, 'disabled')}>${icon('trash')} Supprimer</button>
          ${everUsed ? html`<p class="hint">Déjà utilisé par des affiches : il peut être désactivé, pas supprimé (l’historique est conservé).</p>` : ''}
        </div></aside></div>`)
    const save = async (patch, msg = 'Enregistré') => { try { await api.update('locations', { id }, patch); ADM.locations = await api.locations(); toast(msg) } catch (err) { toast(errMsg(err), 'error'); draw() } }
    $('#l-name', page).onblur = (e) => { const v = e.target.value.trim(); if (v && v !== l.name) save({ name: v }, 'Emplacement renommé').then(draw) }
    $('#l-notes', page).onblur = (e) => { if (e.target.value !== (l.notes || '')) save({ notes: e.target.value || null }) }
    $('[name="active"]', page).onchange = (e) => save({ is_active: e.target.checked }, e.target.checked ? 'Emplacement réactivé' : 'Emplacement désactivé')
    $('[data-del]', page).onclick = async () => {
      if (!(await confirmDialog({ title: 'Supprimer cet emplacement ?', message: `« ${l.name} » sera définitivement supprimé.`, danger: true, confirmLabel: 'Supprimer' }))) return
      try { await api.remove('locations', { id }); ADM.locations = await api.locations(); toast('Emplacement supprimé'); navigate(A('/emplacements'), { replace: true }) } catch (err) { toast(errMsg(err), 'error') }
    }
    const q = $('[data-q]', page)
    if (q) q.oninput = () => setHTML($('[data-list]', page), here.filter((v) => matchesQuery(adminSearchText(v, ADM.formats, ADM.locations), q.value)).map((v) => visualCard(v, { locationId: id })))
  }
  bindStockControls(page, draw)
  ADM.refreshView = draw
  draw()
}
