    })
  }
  const rm = $('[data-logo-rm]', page)
  if (rm) rm.onclick = async () => { const old = s.logo_path; if (await saveSettings({ logo_path: null }, 'Logo retiré')) { await api.removeFiles([old]).catch(() => {}); ADM.shell = false; render() } }

  // Formats et prix par défaut
  const drawFormats = () => setHTML($('[data-formats]', page), ADM.formats.map((f) => html`<div class="card" style="padding:14px" data-fid="${f.id}"><div class="row wrap">
    <div class="field grow" style="min-width:160px"><label for="fl-${f.id}">Libellé</label><input class="input" id="fl-${f.id}" data-fl value="${f.label}"></div>
    <div class="field" style="width:140px"><label for="fp-${f.id}">Prix par défaut (€)</label><input class="input" id="fp-${f.id}" data-fp inputmode="decimal" placeholder="Non défini" value="${centsToInput(f.default_price_cents)}"></div>
    <div style="padding-top:22px">${switchHtml(`fa-${f.id}`, f.is_active, 'Actif')}</div></div></div>`))
  drawFormats()
  const fmtBox = $('[data-formats]', page)
  const saveFormat = async (id, patch, msg) => { try { await api.update('formats', { id }, patch); ADM.formats = await api.formats(); toast(msg) } catch (err) { toast(errMsg(err), 'error'); drawFormats() } }
  fmtBox.addEventListener('focusout', (e) => {
    const card = e.target.closest('[data-fid]')
    if (!card) return
    const id = Number(card.dataset.fid)
    const f = ADM.formats.find((x) => x.id === id)
    if (e.target.matches('[data-fl]') && e.target.value.trim() && e.target.value.trim() !== f.label) saveFormat(id, { label: e.target.value.trim() }, 'Format renommé')
    if (e.target.matches('[data-fp]')) {
      const c = parsePriceToCents(e.target.value)
      if (Number.isNaN(c)) return toast('Prix invalide (ex. 8,50).', 'error')
      if (c !== f.default_price_cents) saveFormat(id, { default_price_cents: c }, 'Prix par défaut enregistré')
    }
  })
  fmtBox.addEventListener('change', (e) => { if (e.target.name?.startsWith('fa-')) saveFormat(Number(e.target.name.slice(3)), { is_active: e.target.checked }, e.target.checked ? 'Format activé' : 'Format désactivé') })
  $('[data-new-format]', page).onsubmit = (e) => {
    e.preventDefault()
    const label = e.target.label.value.trim()
    if (!label) return
    const code = normalize(label).replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || `format-${Date.now()}`
    busy($('[type=submit]', e.target), async () => {
      try { await api.insert('formats', { code, label, sort_order: Math.max(0, ...ADM.formats.map((f) => f.sort_order)) + 1 }); ADM.formats = await api.formats(); e.target.reset(); drawFormats(); toast('Format ajouté') } catch (err) { toast(errMsg(err), 'error') }
    })
  }

  // QR code
  const publicUrl = `${location.origin}/`
  loadQr().then((qrcode) => {
    const qr = qrcode(0, 'M'); qr.addData(publicUrl); qr.make()
    $('[data-qr]', page).innerHTML = qr.createSvgTag({ cellSize: 4, margin: 2, scalable: true })
    $('[data-qr-png]', page).onclick = () => {
      const n = qr.getModuleCount(), size = 1024, m = 4, cell = Math.floor(size / (n + m * 2))
      const c = document.createElement('canvas'); c.width = c.height = cell * (n + m * 2)
      const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height); ctx.fillStyle = '#000'
      for (let r = 0; r < n; r++) for (let col = 0; col < n; col++) if (qr.isDark(r, col)) ctx.fillRect((col + m) * cell, (r + m) * cell, cell, cell)
      const a = document.createElement('a'); a.href = c.toDataURL('image/png'); a.download = 'qr-code-vitrine-affiches.png'; a.click()
    }
  }).catch(() => setHTML($('[data-qr]', page), html`<p class="xs muted">QR code indisponible (connexion).</p>`))
  $('[data-qr-pdf]', page).onclick = (e) => busy(e.currentTarget, async () => {
    try {
      const pdfMake = await loadPdfMake()
      const st = ADM.settings
      pdfMake.createPdf({
        pageSize: 'A4', pageMargins: [50, 70, 50, 50], info: { title: 'Affichette QR code' },
        content: [
          { text: brandNames(st).catalog.toUpperCase(), alignment: 'center', fontSize: 12, bold: true, characterSpacing: 7, color: '#a5823f' },
          { text: brandNames(st).cinema.toUpperCase(), alignment: 'center', fontSize: 40, bold: true, characterSpacing: 3, color: '#17120c', margin: [0, 2, 0, 0] },
          { canvas: [{ type: 'line', x1: 207, y1: 0, x2: 287, y2: 0, lineWidth: 1.5, lineColor: '#e8772e' }], margin: [0, 14, 0, 14] },
          { text: 'Les affiches de cinéma', alignment: 'center', fontSize: 30, bold: true, color: '#17120c', margin: [0, 0, 0, 6] },
          { text: 'sont en vente au cinéma !', alignment: 'center', fontSize: 19, color: '#17120c' },
          { qr: publicUrl, fit: 290, alignment: 'center', margin: [0, 44, 0, 30], foreground: '#000' },
          { text: 'Scannez ce code avec l’appareil photo de votre téléphone', alignment: 'center', fontSize: 15, bold: true, color: '#211d18' },
          { text: 'pour découvrir toutes les affiches disponibles, leurs formats et leurs prix.', alignment: 'center', fontSize: 12, color: '#6b6458', margin: [0, 6, 0, 0] },
          { text: st.contact_note || '', alignment: 'center', fontSize: 12, color: '#6b6458', margin: [0, 28, 0, 0] },
          { text: publicUrl, alignment: 'center', fontSize: 10, color: '#9a9184', margin: [0, 10, 0, 0] },
        ],
        defaultStyle: { font: 'Roboto' },
      }).download('affichette-qr-code.pdf')
    } catch (err) { toast(errMsg(err), 'error') }
  })

  // Mon compte
  const nameInput = $('#me-name', page)
  nameInput.onblur = async () => {
    const v = nameInput.value.trim()
    if (v === (ADM.profile.display_name || '')) return
    try { await api.rpc('update_my_display_name', { p_name: v }); ADM.profile.display_name = v || null; toast('Nom enregistré') } catch (err) { toast(errMsg(err), 'error') }
  }
  $('[data-pw]', page).onsubmit = (e) => {
    e.preventDefault()
    const f = e.target
    const problem = passwordProblem(f.pw.value, f.pw2.value)
    if (problem) return toast(problem, 'error')
    busy($('[type=submit]', f), async () => {
      // Protection : le mot de passe actuel est revérifié par le serveur avant toute modification
      // (sans rouvrir de session : la double authentification en cours est conservée).
      try { await api.server('/api/account', { method: 'POST', body: { action: 'check-password', password: f.current.value } }) } catch (err) { return toast(errMsg(err), 'error') }
      const { error } = await sb.auth.updateUser({ password: f.pw.value })
      if (error) return toast(pwError(error), 'error')
      f.reset(); toast('Mot de passe modifié')
    })
  }
  $('[data-logout]', page).onclick = () => signOut()

  // Réservations : délai de retrait et rappel (tout administrateur)
  $('[data-resa-settings]', page).onsubmit = (e) => {
    e.preventDefault()
    const f = e.target
    const pickup = Math.round(Number(f.pickup_days.value)), remind = Math.round(Number(f.reminder_days.value))
    if (!(pickup >= 1 && pickup <= 90)) return toast('Délai de retrait : entre 1 et 90 jours.', 'error')
    if (!(remind >= 0 && remind <= 30)) return toast('Rappel : entre 0 et 30 jours.', 'error')
    busy($('[type=submit]', f), async () => {
      try { await api.rpc('set_reservation_settings', { p_pickup_days: pickup, p_reminder_days: remind }); Object.assign(ADM.settings, { pickup_days: pickup, reminder_days: remind }); toast('Réglages des réservations enregistrés') } catch (err) { toast(errMsg(err), 'error') }
    })
  }

  // Double authentification
  mountMfaCard($('[data-mfa-card]', page), owner)
}

async function mountMfaCard(box, owner) {
  let factors = []
  try { factors = await verifiedTotp() } catch (e) { setHTML(box, html`<div class="alert error">${errMsg(e)}</div>`); return }
  if (!box.isConnected) return
  const required = ADM.settings.require_mfa !== false
  const on = factors.length > 0
  setHTML(box, html`<div class="row" style="justify-content:space-between;gap:10px;align-items:flex-start">
      <div><p style="font-weight:800">${icon('shield')} Double authentification</p>
        <p class="muted small" style="margin-top:4px">${on ? 'Un code à 6 chiffres de votre téléphone est demandé à chaque nouvelle connexion (nouvel appareil, après déconnexion).' : 'Non activée sur votre compte.'}</p></div>
      <span class="badge ${on ? 'ok' : 'warn'}">${on ? 'Activée' : 'Inactive'}</span></div>
    <div class="row wrap" style="gap:8px">
      ${on ? html`<button class="btn btn-secondary sm" data-mfa-change>${icon('phone')} Changer de téléphone</button>` : html`<button class="btn btn-primary sm" data-mfa-add>${icon('shield')} Activer</button>`}
      ${on && !required ? html`<button class="btn btn-ghost sm" data-mfa-off>Désactiver</button>` : ''}
    </div>
    ${owner ? html`<div style="border-top:1px solid var(--line);padding-top:14px">${switchHtml('require_mfa', required, 'Obligatoire pour tous les comptes', 'Recommandé : les administrateurs ont accès aux coordonnées des clients. Sans code validé, la base de données refuse tout accès.')}</div>` : ''}`)
  const enrollModal = (title, replaceOthers) => {
    const m = openModal({ title, size: 'sm', body: html`<div data-box></div>` })
    mountMfaEnroll($('[data-box]', m.el), { replaceOthers, onDone: async () => { m.close(); toast(replaceOthers ? 'Nouveau téléphone enregistré.' : 'Double authentification activée.'); mountMfaCard(box, owner) } })
  }
  $('[data-mfa-change]', box)?.addEventListener('click', () => enrollModal('Changer de téléphone', true))
  $('[data-mfa-add]', box)?.addEventListener('click', () => enrollModal('Activer la double authentification', false))
  $('[data-mfa-off]', box)?.addEventListener('click', async () => {
    if (!(await confirmDialog({ title: 'Désactiver la double authentification ?', danger: true, confirmLabel: 'Désactiver', message: html`<p>Votre compte ne sera plus protégé que par le mot de passe.</p>` }))) return
    for (const f of factors) await sb.auth.mfa.unenroll({ factorId: f.id }).catch(() => {})
    toast('Double authentification désactivée.')
    mountMfaCard(box, owner)
  })
  const sw = $('input[name="require_mfa"]', box)
  if (sw) sw.addEventListener('change', async () => {
    const want = sw.checked
    if (!want && !(await confirmDialog({ title: 'Rendre la double authentification facultative ?', danger: true, confirmLabel: 'Rendre facultative',
      message: html`<p>Chaque compte pourra se connecter avec son seul mot de passe s’il n’a pas activé la double authentification. Les coordonnées des clients seront moins protégées.</p>` }))) { sw.checked = true; return }
    if (want && !on && !(await confirmDialog({ title: 'Rendre obligatoire ?', confirmLabel: 'Rendre obligatoire',
      message: html`<p>Votre propre compte n’a pas encore de double authentification : l’application vous demandera de l’activer immédiatement.</p>` }))) { sw.checked = false; return }
    try {
      await api.update('app_settings', { id: true }, { require_mfa: want })
      ADM.settings.require_mfa = want
      toast(want ? 'Double authentification obligatoire.' : 'Double authentification facultative.')
      if (want && !on) { ADM.profile = null; ADM.loaded = false; render() } else mountMfaCard(box, owner)
    } catch (err) { sw.checked = !want; toast(errMsg(err), 'error') }
  })
}

/* Remise à zéro (période de test) — administrateur principal + mot de passe obligatoires.
   Disparaît dès que supabase/04_retirer_remise_a_zero.sql a été exécuté. */
const RESET_SCOPES = {
  history: { title: 'Effacer l’historique', btn: 'Effacer l’historique', icon: 'history',
    removes: ['Tout l’historique des mouvements (ventes, réservations, corrections, déplacements)'],
    keeps: ['Les affiches et leurs quantités en stock', 'Les réglages, formats, prix, emplacements et administrateurs'] },
  stock: { title: 'Vider le stock', btn: 'Vider le stock', icon: 'box',
    removes: ['Toutes les quantités, remises à 0 dans chaque emplacement', 'Toutes les réservations clients', 'Tout l’historique des mouvements'],
    keeps: ['Les fiches des affiches (elles apparaîtront épuisées)', 'Les réglages, formats, prix, emplacements et administrateurs'] },
  all: { title: 'Tout réinitialiser', btn: 'Tout réinitialiser', icon: 'trash',
    removes: ['Tous les films et toutes les affiches (et leurs photos)', 'Tous les stocks, prix personnalisés et réservations clients', 'Tout l’historique ; les références repartent à AF-0001'],
    keeps: ['Les réglages, le logo, les formats et tarifs par défaut', 'Les emplacements', 'Les comptes administrateurs'] },
}
async function mountResetZone(box, section) {
  let info, problem = null
  try { info = await api.server('/api/maintenance') } catch (err) { problem = errMsg(err) }
  if (!box.isConnected) return
  if (!info?.enabled) {
    // Explique pourquoi la zone n'apparaît pas (utile pendant l'installation)
    const why = problem && /404|introuvable|Erreur serveur/i.test(problem)
      ? 'la fonction serveur « api/maintenance.js » est introuvable sur le site (vérifiez qu’elle est bien dans le dossier api de GitHub, sans « .txt »).'
      : problem ? problem : 'désactivée (le script supabase/03_maintenance.sql n’est pas installé ou a été retiré).'
    setHTML(box, html`<p class="hint" style="margin-top:22px">${icon('info')} Remise à zéro : ${why}</p>`)
    return
  }
  setHTML(box, section('Remise à zéro (période de test)', 'Pour repartir de zéro à la fin des essais. Le mot de passe du compte principal est demandé à chaque fois.', html`
    <div class="card pad stack" style="border-color:var(--danger-line)">
      ${Object.entries(RESET_SCOPES).map(([k, r]) => html`<div class="row wrap" style="justify-content:space-between;gap:12px">
        <div style="flex:1;min-width:200px"><b>${r.title}</b><p class="muted small">${r.removes.join(' · ')}</p></div>
        <button class="btn btn-danger-ghost sm" data-reset="${k}">${icon(r.icon)} ${r.btn}</button></div>`)}
      <p class="hint">À la livraison, cette zone pourra être retirée définitivement (voir le guide).</p>
    </div>`))
  box.addEventListener('click', (e) => {
    const b = e.target.closest('[data-reset]')
    if (b) openResetDialog(b.dataset.reset, info.confirmWord || 'EFFACER')
  })
}
function openResetDialog(scope, word) {
  const r = RESET_SCOPES[scope]
  const m = openModal({
    title: r.title, size: 'sm',
    body: html`<form class="stack" data-reset-form novalidate>
      <div class="alert error"><b>Action définitive, sans retour possible.</b></div>
      <div><p class="label">Sera effacé</p><ul class="small" style="margin:6px 0 0;padding-left:18px">${r.removes.map((x) => html`<li>${x}</li>`)}</ul></div>
      <div><p class="label">Sera conservé</p><ul class="small muted" style="margin:6px 0 0;padding-left:18px">${r.keeps.map((x) => html`<li>${x}</li>`)}</ul></div>
      ${passwordField('password', 'Mot de passe du compte principal')}
      <div class="field"><label for="reset-confirm">Tapez <b class="mono">${word}</b> pour confirmer</label>
        <input class="input mono" id="reset-confirm" name="confirm" autocomplete="off" autocapitalize="characters" spellcheck="false"></div>
      <div class="row"><button type="button" class="btn btn-secondary block" data-close>Annuler</button>
        <button type="submit" class="btn btn-danger block">${icon(r.icon)} ${r.btn}</button></div>
    </form>`,
  })
  const f = $('[data-reset-form]', m.el)
  f.onsubmit = (e) => {
    e.preventDefault()
    if (!f.password.value) return toast('Saisissez le mot de passe du compte principal.', 'error')
    if (f.confirm.value.trim().toUpperCase() !== word) return toast(`Tapez ${word} pour confirmer.`, 'error')
    busy($('[type=submit]', f), async () => {
      try {
        const out = await api.server('/api/maintenance', { method: 'POST', body: { scope, password: f.password.value, confirm: f.confirm.value } })
        m.close()
        const parts = scope === 'history' ? [plural(out.movements, 'mouvement effacé', 'mouvements effacés')]
          : scope === 'stock' ? [plural(out.stocks, 'stock remis à 0', 'stocks remis à 0'), plural(out.movements, 'mouvement effacé', 'mouvements effacés')]
          : [plural(out.visuals, 'affiche supprimée', 'affiches supprimées'), plural(out.films, 'film supprimé', 'films supprimés')]
        toast(`${r.title} : terminé (${parts.join(', ')}).`)
        ADM.movementVersion++
        await reloadAdmin({ quiet: false })
      } catch (err) {
        f.password.value = ''
        toast(errMsg(err), 'error')
      }
    })
  }
}

/* ═══════════════════════════════════════════════════════════════════════
   S. DÉMARRAGE
   ═══════════════════════════════════════════════════════════════════════ */
async function render({ scroll = false } = {}) {
  const route = matchRoute(location.pathname)
  if (route.redirect) history.replaceState(null, '', route.redirect)
  const prev = currentRoute
  currentRoute = route
  $('#meta-robots').content = route.area === 'admin' ? 'noindex, nofollow, noarchive' : 'index, follow'
  if (route.area === 'public') await renderPublic(route)
  else await renderAdmin(route)
  if (scroll && !(prev?.area === 'public' && route.area === 'public')) window.scrollTo(0, 0)
}

function renderConfigError(kind) {
  setHTML($('#app'), html`<main class="auth"><div class="auth-card"><div class="auth-head">${logoHtml(null)}<h1>${kind === 'not-configured' ? 'Configuration requise' : 'Site momentanément indisponible'}</h1></div>
    <div class="alert info">${kind === 'not-configured'
      ? raw('Le site n’est pas encore relié à Supabase. Ajoutez <b>SUPABASE_URL</b> et <b>SUPABASE_ANON_KEY</b> dans Vercel → Settings → Environment Variables, puis redéployez (voir le guide de mise en service).')
      : 'Le serveur ne répond pas. Vérifiez votre connexion puis rechargez la page.'}</div>
    <button class="btn btn-primary block" style="margin-top:16px" onclick="location.reload()">Recharger</button></div></main>`)
}

async function boot() {
  try { CONFIG = await loadConfig() } catch (e) { return renderConfigError(e.message) }
  if (!window.supabase?.createClient) return renderConfigError('cdn')
  sb = window.supabase.createClient(CONFIG.supabaseUrl, CONFIG.supabaseAnonKey, {
    auth: { flowType: 'implicit', persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, storage: authStorage, storageKey: 'ca-auth' },
  })
  sb.auth.onAuthStateChange((event) => {
    if (event === 'PASSWORD_RECOVERY' && LINK.type !== 'invite') LINK.type = LINK.type || 'recovery'
  })
  // Les liens reçus par e-mail (invitation, mot de passe) arrivent parfois sur la page d'accueil :
  // on attend que Supabase ait lu le lien, puis on affiche la bonne page.
  if (LINK.type || LINK.error) await sb.auth.getSession()
  const path = location.pathname
  if (LINK.type === 'invite' && !path.endsWith('/activation')) history.replaceState(null, '', A('/activation'))
  else if (LINK.type === 'recovery' && !path.endsWith('/nouveau-mot-de-passe') && !path.endsWith('/activation')) history.replaceState(null, '', A('/nouveau-mot-de-passe'))
  await render()
}
boot()
