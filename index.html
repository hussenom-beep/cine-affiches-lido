/** Clic sur −/+ et « Remettre en stock » dans n'importe quelle page d'administration. */
function bindStockControls(root, after) {
  root.addEventListener('click', async (e) => {
    const b = e.target.closest('button[data-qty]')
    if (b) {
      const args = { visualId: b.dataset.v, formatId: Number(b.dataset.f), locationId: b.dataset.l }
      if (b.dataset.qty === 'plus') return busy(b, () => moveStock({ ...args, delta: 1, reason: 'stock_in' }).then((r) => r && after?.()))
      return removeSheet(args, after)
    }
    const add = e.target.closest('[data-add-stock]')
    if (add) addStockSheet(findVisual(add.dataset.addStock), {}, after)
  })
}

async function moveStock({ visualId, formatId, locationId, delta, reason, note }) {
  try {
    const q = await api.rpc('adjust_stock', { p_visual_id: visualId, p_format_id: formatId, p_location_id: locationId, p_delta: delta, p_reason: reason, p_note: note || null })
    ADM.visuals = applyQuantity(ADM.visuals, visualId, formatId, locationId, q)
    ADM.movementVersion++
    toast(`${REASONS[reason]} : ${delta > 0 ? '+' : '−'}${Math.abs(delta)} · reste ${q}`)
    return true
  } catch (err) {
    toast(errMsg(err), 'error')
    reloadAdmin()
    return false
  }
}

function rowLabel({ visualId, formatId, locationId }) {
  const v = findVisual(visualId)
  const f = ADM.formats.find((x) => x.id === formatId)
  const l = ADM.locations.find((x) => x.id === locationId)
  const q = v?.stocks.find((s) => s.format_id === formatId && s.location_id === locationId)?.quantity ?? 0
  return { v, f, l, q, text: `${v?.film.title} · ${v?.reference_code} · ${f?.label} · ${l?.name}` }
}

function removeSheet(args, after) {
  const { q, text } = rowLabel(args)
  const m = openModal({
    title: 'Retirer du stock', size: 'sm',
    body: html`<div class="stack"><p class="muted small">${text} — ${plural(q, 'exemplaire')} en stock</p>
      <div class="row between" style="padding:12px;border:1px solid var(--line);border-radius:16px;background:var(--surface)"><b>Quantité à retirer</b>${stepperHtml('qty', 1, { min: 1, max: Math.max(1, q), label: 'Quantité à retirer' })}</div>
      <div class="field"><label for="rm-note">Commentaire (facultatif)</label><input class="input" id="rm-note" name="note" placeholder="Nom du client, raison…"></div>
      <p class="eyebrow">Motif</p>
      <div class="grid2" style="gap:8px">${REMOVAL_REASONS.map((r, i) => html`<button class="btn ${i === 0 ? 'btn-primary' : 'btn-secondary'} lg" style="${i === 0 || r === 'other' ? 'grid-column:1/-1' : ''}" data-reason="${r}" ${attr(i === 0, 'data-autofocus')}>${REASONS[r]}</button>`)}</div></div>`,
  })
  m.el.addEventListener('click', (e) => {
    const b = e.target.closest('[data-reason]')
    if (!b) return
    $$('[data-reason]', m.el).forEach((x) => { if (x !== b) x.disabled = true })
    busy(b, async () => {
      const okk = await moveStock({ ...args, delta: -stepperValue(m.el, 'qty'), reason: b.dataset.reason, note: $('#rm-note', m.el).value })
      $$('[data-reason]', m.el).forEach((x) => (x.disabled = false))
      if (okk) { m.close(); after?.() }
    })
  })
}

const LAST_LOC = 'ca-last-location'
const lastLocation = () => { const id = safe(() => localStorage.getItem(LAST_LOC), null); return ADM.locations.find((l) => l.id === id && l.is_active)?.id || null }
const rememberLocation = (id) => safe(() => localStorage.setItem(LAST_LOC, id))

function locationPickerHtml(name, value, { exclude } = {}) {
  const list = ADM.locations.filter((l) => (l.is_active || l.id === value) && l.id !== exclude)
  return html`<div class="loc-pick" role="radiogroup" data-locpick="${name}" ${attr(exclude, 'data-exclude', exclude || '')}>
    ${list.map((l) => html`<button type="button" role="radio" aria-checked="${String(l.id === value)}" data-loc="${l.id}">${l.id === value ? icon('check') : ''}${l.name}</button>`)}
    <button type="button" class="new" data-newloc>${icon('plus')} Nouvel emplacement</button></div>
    ${list.length ? '' : html`<p class="hint" style="margin-top:6px">Aucun emplacement : créez-en un (ex. « Réserve A », « Carton 1 »).</p>`}`
}
document.addEventListener('click', async (e) => {
  const pick = e.target.closest('[data-locpick] [data-loc]')
  if (pick) {
    const box = pick.parentElement
    $$('[data-loc]', box).forEach((b) => { const on = b === pick; b.setAttribute('aria-checked', String(on)); const svg = $('svg', b); if (on && !svg) b.insertAdjacentHTML('afterbegin', toHtml(icon('check'))); if (!on && svg) svg.remove() })
    box.dispatchEvent(new CustomEvent('change', { bubbles: true }))
    return
  }
  const nb = e.target.closest('[data-locpick] [data-newloc]')
  if (nb) {
    const name = await promptDialog('Nouvel emplacement', 'Nom de l’emplacement', 'Ex. Réserve B, Carton 3, Derrière la caisse')
    if (!name) return
    try {
      const loc = await api.insert('locations', { name: name.trim() })
      ADM.locations = await api.locations()
      const box = nb.parentElement
      const tmp = document.createElement('div')
      setHTML(tmp, locationPickerHtml(box.dataset.locpick, loc.id, { exclude: box.dataset.exclude }))
      box.nextElementSibling?.classList.contains('hint') && box.nextElementSibling.remove()
      box.replaceWith(...tmp.childNodes)
      toast(`Emplacement « ${loc.name} » créé`)
    } catch (err) { toast(errMsg(err), 'error') }
  }
})
const locPickValue = (root, name) => $(`[data-locpick="${name}"] [aria-checked="true"]`, root)?.dataset.loc || null

function promptDialog(title, label, placeholder = '', value = '') {
  return new Promise((resolve) => {
    const m = openModal({ title, size: 'sm',
      body: html`<form class="field" data-f><label for="pd-in">${label}</label><input class="input" id="pd-in" name="v" value="${value}" placeholder="${placeholder}" data-autofocus autocomplete="off"></form>`,
      footer: html`<div class="row"><button class="btn btn-secondary block" data-close>Annuler</button><button class="btn btn-primary block" data-ok>Valider</button></div>`,
      onClose: (r) => resolve(r || null) })
    const submit = () => { const v = $('#pd-in', m.el).value.trim(); if (v) m.close(v) }
    $('[data-ok]', m.el).addEventListener('click', submit)
    $('[data-f]', m.el).addEventListener('submit', (e) => { e.preventDefault(); submit() })
  })
}

function addStockSheet(v, { formatId, locationId } = {}, after) {
  if (!v) return
  const fmts = activeFormats()
  const m = openModal({
    title: 'Ajouter du stock',
    body: html`<div class="stack"><p class="muted small">${v.film.title} · ${v.reference_code}${v.label ? ` · ${v.label}` : ''}</p>
      <div class="field"><span class="label">Format</span>${segHtml('format', formatId || fmts[0]?.id, fmts.map((f) => [f.id, f.label]), 'block')}</div>
      <div class="field"><span class="label">Emplacement</span>${locationPickerHtml('loc', locationId || lastLocation() || v.stocks.find((x) => ADM.locations.some((l) => l.id === x.location_id && l.is_active))?.location_id || ADM.locations.find((l) => l.is_active)?.id)}</div>
      <div class="field"><span class="label">Quantité</span>${stepperHtml('qty', 1, { min: 1, size: 'lg', label: 'Quantité à ajouter' })}</div>
      <div class="field"><span class="label">Motif</span>${segHtml('reason', 'stock_in', ADDITION_REASONS.map((r) => [r, REASONS[r]]), 'block')}</div>

  $('[data-ok]', m.el).addEventListener('click', (e) => {

    busy(e.currentTarget, async () => {
      const okk = await moveStock({ visualId: v.id, formatId: Number(segValue(m.el, 'format')), locationId: loc, delta: stepperValue(m.el, 'qty'), reason: segValue(m.el, 'reason'), note: $('#as-note', m.el).value })
      if (okk) { rememberLocation(loc); m.close(); after?.() }

function correctSheet(v, row, after) {
  const m = openModal({ title: 'Corriger la quantité', size: 'sm',
    body: html`<div class="stack"><p class="muted small">${row.format.label} · ${row.location.name}</p>
      <p>Quantité enregistrée : <b>${row.stock.quantity}</b>. Indiquez le nombre réellement compté.</p>
      ${stepperHtml('qty', row.stock.quantity, { min: 0, size: 'lg', label: 'Quantité comptée' })}
      <div class="field"><label for="cs-note">Commentaire (facultatif)</label><input class="input" id="cs-note" placeholder="Ex. inventaire du 1er décembre"></div></div>`,
    footer: html`<button class="btn btn-primary lg block" data-ok>Enregistrer la correction</button>` })
  $('[data-ok]', m.el).addEventListener('click', (e) => busy(e.currentTarget, async () => {
    const qn = stepperValue(m.el, 'qty')
    if (qn === row.stock.quantity) return m.close()
    try {
      const q = await api.rpc('set_stock_quantity', { p_visual_id: v.id, p_format_id: row.format.id, p_location_id: row.location.id, p_quantity: qn, p_note: $('#cs-note', m.el).value || null })
      ADM.visuals = applyQuantity(ADM.visuals, v.id, row.format.id, row.location.id, q)
      ADM.movementVersion++
      toast(`Quantité corrigée : ${q}`)
      m.close(); after?.()
    } catch (err) { toast(errMsg(err), 'error') }
  }))
}

function transferSheet(v, row, after) {
  const m = openModal({ title: 'Déplacer des exemplaires',
    body: html`<div class="stack"><p class="muted small">${v.film.title} · ${v.reference_code} · ${row.format.label} · depuis <b>${row.location.name}</b> (${row.stock.quantity} en stock)</p>
      <div class="field"><span class="label">Quantité à déplacer</span>${stepperHtml('qty', Math.min(row.stock.quantity, Math.max(1, row.stock.quantity)), { min: 1, max: Math.max(1, row.stock.quantity), size: 'lg', label: 'Quantité à déplacer' })}</div>
      <div class="field"><span class="label">Vers l’emplacement</span>${locationPickerHtml('to', null, { exclude: row.location.id })}</div>
      <div class="field"><label for="ts-note">Commentaire (facultatif)</label><input class="input" id="ts-note"></div>
      <p class="hint">Le stock total ne change pas : deux lignes « Transfert d’emplacement » sont ajoutées à l’historique.</p></div>`,
    footer: html`<button class="btn btn-primary lg block" data-ok>${icon('transfer')} Déplacer</button>` })
  $('[data-ok]', m.el).addEventListener('click', (e) => {
    const to = locPickValue(m.el, 'to')
    if (!to) return toast('Choisissez l’emplacement de destination.', 'error')
    busy(e.currentTarget, async () => {
      try {
        const n = stepperValue(m.el, 'qty')
        await api.rpc('transfer_stock', { p_visual_id: v.id, p_format_id: row.format.id, p_from_location_id: row.location.id, p_to_location_id: to, p_quantity: n, p_note: $('#ts-note', m.el).value || null })
        await loadAdminData()
        ADM.movementVersion++
        toast(`${plural(n, 'exemplaire déplacé', 'exemplaires déplacés')}`)
        m.close(); after?.()
      } catch (err) { toast(errMsg(err), 'error') }
    })
  })
}

function movementList(moves, { showVisual = true } = {}) {
  const groups = []
  for (const mv of moves) {
    const d = fmtDay(mv.created_at)
    if (groups.at(-1)?.day === d) groups.at(-1).items.push(mv)
    else groups.push({ day: d, items: [mv] })
  }
  return html`<div class="moves">${groups.map((g) => html`<section><p class="eyebrow" style="margin-bottom:8px">${g.day}</p><ul>${g.items.map((m) => html`<li>
    <span class="delta ${m.reason === 'transfer' ? 'move' : m.delta > 0 ? 'pos' : 'neg'}">${m.delta > 0 ? '+' : '−'}${Math.abs(m.delta)}</span>
    <div class="what grow">
      ${showVisual ? html`<a href="${A(`/affiche/${m.visual_id}`)}">${m.film_title} <span class="mono xs muted">${m.visual_ref}</span></a>` : ''}
      <p style="color:var(--ink-2)"><b>${REASONS[m.reason]}</b> · ${m.format_label} · ${m.location_name}</p>
      ${m.note ? html`<p class="muted" style="font-style:italic">« ${m.note} »</p>` : ''}
      <p class="xs" style="color:var(--ink-4);margin-top:2px">${fmtTime(m.created_at)} · stock ${m.quantity_before} → ${m.quantity_after} · ${m.actor_name}</p>
    </div></li>`)}</ul></section>`)}</div>`
}

ADMIN_PAGES.dashboard = async (page) => {
  setHTML(page, html`${pageHead('Tableau de bord', fmtDay(new Date()) + ' · ' + ADM.settings.catalog_name)}
    <div class="stats" data-stats></div>
    <a class="big-add" href="${A('/ajouter')}">${icon('plus')} Ajouter une affiche</a>

      <button class="icon-btn clear hidden" data-clear aria-label="Effacer">${icon('x')}</button></div>
      <div data-results class="vgrid" style="margin-top:14px"></div></section>
    <div class="split side-r section">
      <section><div class="section-title"><h2>Derniers mouvements</h2><a class="link small" href="${A('/historique')}">Tout l’historique</a></div><div data-moves><span class="spinner"></span></div></section>
      <aside class="stack">
        <a class="card list-link" href="${A('/inventaire')}"><span class="ico">${icon('printer')}</span><span class="grow"><b>Inventaire PDF</b><br><span class="muted small">Miniatures, quantités, emplacements et cases de suivi.</span></span>${icon('chevR')}</a>
        <a class="card list-link" href="${A('/emplacements')}"><span class="ico">${icon('pin')}</span><span class="grow"><b>Emplacements</b><br><span class="muted small">Voir le contenu de chaque carton ou réserve.</span></span>${icon('chevR')}</a>
      </aside></div>`)
  const input = $('[data-q]', page)
  const drawStats = () => {
    const s = dashboardStats(ADM.visuals)
    setHTML($('[data-stats]', page), [
      ['layers', s.totalCopies, 'Exemplaires disponibles', A('/stock')],
      ['images', s.availableRefs, 'Références d’affiches', A('/stock?statut=available')],
      ['film', s.films, 'Films distincts', A('/stock?statut=available')],
      ['packageX', s.soldOutRefs, 'Références épuisées', A('/stock?statut=soldout'), s.soldOutRefs > 0],
    ].map(([ic, n, l, href, alert]) => html`<a class="card stat ${alert ? 'alert-on' : ''}" href="${href}">${icon(ic)}<b>${n.toLocaleString('fr-FR')}</b><span>${l}</span></a>`))
  }
  const drawResults = () => {
    const q = input.value.trim()
    $('[data-clear]', page).classList.toggle('hidden', !q)
    if (!q) return setHTML($('[data-results]', page), '')
    const list = filterAdminVisuals(ADM.visuals, { query: q, status: 'active' }, ADM.formats, ADM.locations).slice(0, 30)
    setHTML($('[data-results]', page), list.length ? list.map((v) => visualCard(v))
      : html`<div class="empty"><h3>Aucune affiche trouvée</h3><p>Aucun visuel ne correspond à « ${q} ».</p><a class="btn btn-primary" href="${A('/ajouter')}">${icon('plus')} Ajouter une affiche</a></div>`)
  }
  let version = -1
  const drawMoves = async () => {
    if (version === ADM.movementVersion) return
    version = ADM.movementVersion
    try {
      const moves = await api.movements({ limit: 8 })
      setHTML($('[data-moves]', page), moves.length ? movementList(moves) : html`<div class="empty"><div class="ico">${icon('history')}</div><h3>Aucun mouvement</h3><p>Les entrées, ventes et corrections apparaîtront ici.</p></div>`)
    } catch (e) { setHTML($('[data-moves]', page), html`<div class="alert error">${errMsg(e)}</div>`) }
  }
  input.addEventListener('input', drawResults)
  $('[data-clear]', page).addEventListener('click', () => { input.value = ''; drawResults(); input.focus() })
  const refresh = () => { drawStats(); drawResults(); drawMoves() }
  bindStockControls(page, refresh)
  ADM.refreshView = refresh
  refresh()
}

ADMIN_PAGES.stock = async (page) => {
  const p = qs()
  const statusOpts = [['active', 'Toutes (hors archives)'], ['available', 'Disponibles'], ['soldout', 'Épuisées'], ['hidden', 'Masquées'], ['archived', 'Archivées'], ['all', 'Toutes, archives comprises']]
  setHTML(page, html`${pageHead('Stock des affiches', plural(ADM.visuals.filter((v) => v.status !== 'archived').length, 'visuel enregistré', 'visuels enregistrés'),
      { actions: html`<a class="btn btn-primary" href="${A('/ajouter')}">${icon('plus')} Ajouter</a>` })}
    <div class="search">${icon('search')}<input class="input" type="search" data-q value="${p.get('q') || ''}" placeholder="Film, titre original, année, référence, visuel, emplacement, format, statut…" aria-label="Rechercher dans le stock" autocomplete="off"></div>
    <div class="filters">
      <select class="select" data-f="statut" aria-label="Statut">${statusOpts.map(([k, l]) => html`<option value="${k}" ${attr((p.get('statut') || 'active') === k, 'selected')}>Statut : ${l}</option>`)}</select>
      <select class="select" data-f="format" aria-label="Format"><option value="all">Format : tous</option>${ADM.formats.map((f) => html`<option value="${f.id}" ${attr(p.get('format') === String(f.id), 'selected')}>Format : ${f.label} (en stock)</option>`)}</select>
      <select class="select" data-f="emplacement" aria-label="Emplacement"><option value="all">Emplacement : tous</option>${ADM.locations.map((l) => html`<option value="${l.id}" ${attr(p.get('emplacement') === l.id, 'selected')}>Emplacement : ${l.name}</option>`)}</select>
    </div>
    <p class="muted small" style="margin:18px 0 10px;font-weight:700" data-count aria-live="polite"></p>
    <div class="vgrid two" data-list></div>
    <div class="row" style="justify-content:center;margin-top:20px"><button class="btn btn-secondary hidden" data-more>Afficher plus</button></div>`)
  let limit = 30
  const input = $('[data-q]', page)
  const draw = () => {
    const sel = (k) => $(`[data-f="${k}"]`, page).value
    const filters = { query: input.value, status: sel('statut'), formatId: sel('format') === 'all' ? 'all' : Number(sel('format')), locationId: sel('emplacement') }
    const list = filterAdminVisuals(ADM.visuals, filters, ADM.formats, ADM.locations)
    $('[data-count]', page).textContent = plural(list.length, 'résultat')
    setHTML($('[data-list]', page), list.length ? list.slice(0, limit).map((v) => visualCard(v, { locationId: filters.locationId === 'all' ? undefined : filters.locationId }))
      : ADM.visuals.length ? html`<div class="empty" style="grid-column:1/-1"><h3>Aucun résultat</h3><p>Modifiez la recherche ou les filtres.</p></div>`
        : html`<div class="empty" style="grid-column:1/-1"><div class="ico">${icon('images')}</div><h3>Aucune affiche pour l’instant</h3><p>Commencez par rechercher un film sur TMDB ou par photographier une affiche.</p><a class="btn btn-primary" href="${A('/ajouter')}">${icon('plus')} Ajouter la première affiche</a></div>`)
    const more = $('[data-more]', page)
    more.classList.toggle('hidden', limit >= list.length)
    more.textContent = `Afficher plus (${list.length - limit} restants)`
  }
  const syncUrl = () => {
    const q = new URLSearchParams()
    if (input.value) q.set('q', input.value)
    for (const k of ['statut', 'format', 'emplacement']) { const v = $(`[data-f="${k}"]`, page).value; if (v !== 'all' && v !== 'active') q.set(k, v) }
    setQuery(q)
  }
  input.addEventListener('input', () => { limit = 30; draw(); syncUrl() })
  $$('[data-f]', page).forEach((s) => s.addEventListener('change', () => { limit = 30; draw(); syncUrl() }))
  $('[data-more]', page).addEventListener('click', () => { limit += 30; draw() })
  bindStockControls(page, draw)
  ADM.refreshView = draw
  draw()
}

    const visible = isPubliclyVisible(v, activeFormatIds())
    const siblings = ADM.visuals.filter((x) => x.film_id === v.film_id && x.id !== v.id)

function locationCounts() {
  const map = new Map()
  for (const v of ADM.visuals) {
    if (v.status === 'archived') continue
    for (const s of v.stocks) {
      if (s.quantity <= 0) continue
      const e = map.get(s.location_id) || { copies: 0, refs: new Set() }
      e.copies += s.quantity; e.refs.add(v.id); map.set(s.location_id, e)
    }
  }
  return map
}

/* ═══════════════════════════════════════════════════════════════════════
   O. PHOTO PERSONNELLE : prise de vue, recadrage, compression
   ═══════════════════════════════════════════════════════════════════════ */
const PHOTO = { maxBytes: 25 * 1024 * 1024, full: 1600, thumb: 480 }
function canvasToBlob(canvas, quality) {
  return new Promise((res, rej) => canvas.toBlob((b) => (b ? res(b) : rej(new AppError('Échec de la compression de l’image.'))), 'image/jpeg', quality))
}
function scaleCanvas(src, maxSide) {
  const k = Math.min(1, maxSide / Math.max(src.width, src.height))
  const c = document.createElement('canvas')
  c.width = Math.max(1, Math.round(src.width * k)); c.height = Math.max(1, Math.round(src.height * k))
  const ctx = c.getContext('2d')
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height)
  ctx.imageSmoothingQuality = 'high'
  ctx.drawImage(src, 0, 0, c.width, c.height)
  return c
}

/** Affiche le choix de photo puis le recadrage dans `box`. onDone({ full, thumb, previewUrl }) */
function photoCapture(box, onDone) {
  let cropper = null, url = null
  const pickView = () => {
    cropper?.destroy(); cropper = null
    if (url) { URL.revokeObjectURL(url); url = null }
    setHTML(box, html`<div class="stack">
      <input type="file" accept="image/*" capture="environment" class="hidden" data-cam>
      <input type="file" accept="image/jpeg,image/png,image/webp,image/heic,image/heif" class="hidden" data-file>
      <button type="button" class="photo-choice primary" data-open="cam">${icon('camera')}<span><b>Prendre une photo</b><span>Avec l’appareil photo du téléphone</span></span></button>
      <button type="button" class="photo-choice" data-open="file">${icon('imagePlus')}<span><b>Choisir une image</b><span>Galerie photo, ou fichier de l’ordinateur (JPEG, PNG, WebP)</span></span></button></div>`)
  }
  box.onclick = (e) => {
    const o = e.target.closest('[data-open]')
    if (o) $(o.dataset.open === 'cam' ? '[data-cam]' : '[data-file]', box).click()
    const r = e.target.closest('[data-rot]')
    if (r && cropper) cropper.rotate(Number(r.dataset.rot))
    if (e.target.closest('[data-again]')) pickView()
    const ok2 = e.target.closest('[data-crop-ok]')
    if (ok2) busy(ok2, async () => {
      try {
        const canvas = cropper.getCroppedCanvas({ maxWidth: 4000, maxHeight: 4000, fillColor: '#fff', imageSmoothingQuality: 'high' })
        if (!canvas) throw new AppError('Recadrage impossible.')
        const full = await canvasToBlob(scaleCanvas(canvas, PHOTO.full), 0.86)
        const thumb = await canvasToBlob(scaleCanvas(canvas, PHOTO.thumb), 0.8)
        await onDone({ full, thumb, previewUrl: URL.createObjectURL(full) })
      } catch (err) { toast(errMsg(err), 'error') }
    })
  }
  box.onchange = async (e) => {
    const input = e.target
    if (input.type !== 'file' || !input.files?.[0]) return
    const file = input.files[0]
    input.value = ''
    const typeOk = /^image\//.test(file.type) || /\.(jpe?g|png|webp|heic|heif)$/i.test(file.name)
    if (!typeOk) return toast('Format non pris en charge. Utilisez une photo JPEG, PNG ou WebP.', 'error')
    if (file.size > PHOTO.maxBytes) return toast('Image trop lourde (25 Mo maximum).', 'error')
    let Cropper
    try { Cropper = await loadCropper() } catch (err) { return toast(errMsg(err), 'error') }
    url = URL.createObjectURL(file)
    setHTML(box, html`<div class="stack">
      <div class="crop-stage"><img src="${url}" alt="Photo à recadrer" data-crop></div>
      <div class="row wrap between">${segHtml('ratio', '2:3', [['2:3', 'Affiche 2:3'], ['3:4', '3:4'], ['free', 'Libre']])}
        <div class="row" style="gap:4px"><button type="button" class="icon-btn" data-rot="-90" aria-label="Pivoter à gauche">${icon('rotL')}</button><button type="button" class="icon-btn" data-rot="90" aria-label="Pivoter à droite">${icon('rotR')}</button></div></div>
      <p class="hint">Faites glisser et pincez pour cadrer l’affiche. L’image est compressée avant l’envoi.</p>
      <div class="row"><button type="button" class="btn btn-secondary" data-again>${icon('rotL')} Autre photo</button><button type="button" class="btn btn-primary block" data-crop-ok>${icon('check')} Valider le cadrage</button></div></div>`)
    const imgEl = $('[data-crop]', box)
    imgEl.onerror = () => { toast('Impossible de lire cette image sur cet appareil (format HEIC ?). Essayez une photo JPEG.', 'error'); pickView() }
    imgEl.onload = () => {
      cropper = new Cropper(imgEl, { viewMode: 1, aspectRatio: 2 / 3, autoCropArea: 0.92, dragMode: 'move', background: false, checkOrientation: true, responsive: true })
    }
    $('[data-seg="ratio"]', box).addEventListener('change', (ev) => cropper?.setAspectRatio({ '2:3': 2 / 3, '3:4': 3 / 4, free: NaN }[ev.detail]))
  }
  pickView()
  return { destroy: () => { cropper?.destroy(); if (url) URL.revokeObjectURL(url) } }
}

function photoSheet(onSave) {
  const m = openModal({ title: 'Photo personnelle', size: 'lg', body: html`<div data-photo></div>` })
  const pc = photoCapture($('[data-photo]', m.el), async (photo) => {
    setHTML($('[data-photo]', m.el), html`<div class="boot" style="min-height:200px"><span class="spinner"></span> Envoi de la photo…</div>`)
    if (await onSave(photo)) m.close()
    else m.close()
  })
  const prevClose = m.close
  m.close = (r) => { pc.destroy(); prevClose(r) }
}

/* ═══════════════════════════════════════════════════════════════════════
   P. AJOUTER UNE AFFICHE  (TMDB → visuel exact → quantités / emplacements)
   ═══════════════════════════════════════════════════════════════════════ */
ADMIN_PAGES.add = async (page) => {
  const S = { step: 'search', film: null, image: null, createdId: null, q: '' }
  // film = { local?: Film, tmdb?: Details, manual?: {...} } ; image = { kind:'tmdb', poster } | { kind:'photo', photo }

  const localFilm = () => S.film?.local || (S.film?.tmdb && ADM.visuals.find((v) => v.film.tmdb_id === S.film.tmdb.id)?.film) || null
  const filmVisuals = () => { const lf = localFilm(); return lf ? ADM.visuals.filter((v) => v.film_id === lf.id) : [] }
  const filmTitle = () => S.film?.tmdb?.title || S.film?.local?.title || S.film?.manual?.title || ''
  const filmYear = () => S.film?.tmdb ? yearOf(S.film.tmdb) : S.film?.local ? yearOf(S.film.local) : Number(S.film?.manual?.release_year) || null

  const STEP_LABEL = { search: '1 · Rechercher le film', gallery: '2 · Choisir le visuel exact', manual: '1 · Créer la fiche du film', photo: '2 · Photographier l’affiche', form: '3 · Quantités, emplacements et prix', done: 'Terminé' }
  function frame(content) {
    page.onclick = null
    const back = ['gallery', 'manual', 'photo', 'form'].includes(S.step)
    setHTML(page, html`${pageHead(S.step === 'done' ? 'Affiche enregistrée' : 'Ajouter une affiche', STEP_LABEL[S.step], back ? { back: ['#', 'Retour'] } : {})}
      ${S.film && ['gallery', 'photo', 'form'].includes(S.step) ? filmBanner() : ''}${content}`)
    const b = $('.back', page)
    if (b) b.onclick = (e) => {
      e.preventDefault(); e.stopPropagation()
      if (S.step === 'gallery' || S.step === 'manual') go('search')
      else if (S.step === 'photo') go(S.film?.tmdb ? 'gallery' : S.film?.manual ? 'manual' : 'search')
      else if (S.step === 'form') go(S.image?.kind === 'photo' ? 'photo' : 'gallery')
    }
    window.scrollTo({ top: 0 })
  }
  function filmBanner() {
    const poster = S.film.tmdb?.poster_path || S.film.local?.tmdb_poster_path
    const orig = S.film.tmdb?.original_title || S.film.local?.original_title || S.film.manual?.original_title
    return html`<div class="card film-banner">${posterHtml(img.tmdb(poster, 'w92'), '')}
      <div class="grow"><b class="display truncate" style="display:block;font-size:18px;font-weight:600">${filmTitle()}</b>
      <span class="muted small">${[filmYear(), orig && orig !== filmTitle() ? orig : null].filter(Boolean).join(' · ') || 'Année inconnue'}</span></div>
      <button class="btn btn-ghost sm" data-change-film>Changer</button></div>`
  }
  page.addEventListener('click', (e) => { if (e.target.closest('[data-change-film]')) { S.film = null; go('search') } })

  function go(step) {
    S.step = step
    ;({ search: stepSearch, gallery: stepGallery, manual: stepManual, photo: stepPhoto, form: stepForm, done: stepDone })[step]()
  }

  async function openTmdbFilm(id, local) {
    try {
      const details = await api.server(`/api/tmdb?action=movie&id=${id}`)
      S.film = { tmdb: details, local: local || ADM.visuals.find((v) => v.film.tmdb_id === id)?.film }
      S.image = null
      go('gallery')
    } catch (err) {
      toast(errMsg(err), 'error')
      if (local) { S.film = { local }; go('photo') }
    }
  }

  // ── A. Recherche ────────────────────────────────────────────────────
  function stepSearch() {
    frame(html`<div class="stack" style="gap:20px">
      <div class="search">${icon('search')}<input class="input" style="height:62px;font-size:18px" type="search" data-q value="${S.q}" placeholder="Nom du film (ex. Mario, Interstellar…)" aria-label="Rechercher un film sur TMDB" autocomplete="off" enterkeyhint="search" autofocus><span class="clear hidden" data-spin style="right:16px"><span class="spinner"></span></span></div>
      <div data-out></div>
      <div class="card pad row wrap between"><div><b>Film introuvable sur TMDB ?</b><p class="muted small">Créez la fiche à la main, puis photographiez l’affiche.</p></div>
        <button class="btn btn-outline" data-manual>${icon('pen')} Créer manuellement</button></div></div>`)
    const input = $('[data-q]', page)
    const out = $('[data-out]', page)
    let seq = 0, t, page1 = 1, total = 0, results = []
    const draw = (locals, error) => {
      setHTML(out, html`${error ? html`<div class="alert error" style="margin-bottom:16px">${error}</div>` : ''}
        ${locals.length ? html`<section style="margin-bottom:22px"><p class="eyebrow" style="margin-bottom:8px">Déjà au catalogue</p><div class="stack tight">${locals.map((f) => html`
          <button class="card row" style="padding:10px;text-align:left;border-color:var(--brand-200);background:var(--brand-50)" data-local="${f.id}">
            <div style="width:42px;flex-shrink:0">${posterHtml(img.tmdb(f.tmdb_poster_path, 'w92'), '')}</div>
            <span class="grow"><b>${f.title}</b><br><span class="muted small">${yearOf(f) || 'Année inconnue'} · ${plural(ADM.visuals.filter((v) => v.film_id === f.id).length, 'visuel')}</span></span><span class="badge brand">Au catalogue</span></button>`)}</div></section>` : ''}
        ${results.length ? html`<section><p class="eyebrow" style="margin-bottom:8px">Résultats TMDB</p>
          <div class="gal">${results.map((r) => html`<button class="result-tile" data-tmdb="${r.id}">${posterHtml(img.tmdb(r.poster_path, 'w185'), '')}
            <span><b class="clamp2">${r.title}</b>${r.original_title !== r.title ? html`<span class="xs muted clamp2" style="font-style:italic">${r.original_title}</span>` : ''}<span class="small muted">${r.release_date?.slice(0, 4) || 'Date inconnue'}</span></span></button>`)}</div>
          ${page1 < total ? html`<div class="row" style="justify-content:center;margin-top:16px"><button class="btn btn-secondary" data-more>Plus de résultats</button></div>` : ''}</section>`
          : input.value.trim().length >= 2 && !error && seq ? html`<p class="muted">Aucun film trouvé sur TMDB pour « ${input.value.trim()} ».</p>` : ''}`)
    }
    const localMatches = (q) => {
      const seen = new Map()
      for (const v of ADM.visuals) if (!seen.has(v.film_id) && matchesQuery(`${v.film.title} ${v.film.original_title || ''} ${yearOf(v.film) || ''}`, q)) seen.set(v.film_id, v.film)
      return [...seen.values()].slice(0, 8)
    }
    const search = async () => {
      const q = input.value.trim()
      S.q = input.value
      if (q.length < 2) { results = []; seq = 0; setHTML(out, ''); return }
      const id = ++seq
      $('[data-spin]', page).classList.remove('hidden')
      let error = null
      try { const r = await api.server(`/api/tmdb?action=search&q=${encodeURIComponent(q)}`); if (id !== seq) return; results = r.results; page1 = r.page; total = r.total_pages } catch (err) { if (id !== seq) return; results = []; error = errMsg(err) }
      $('[data-spin]', page)?.classList.add('hidden')
      draw(localMatches(q), error)
    }
    input.oninput = () => { clearTimeout(t); t = setTimeout(search, 350) }
    out.onclick = async (e) => {
      const tm = e.target.closest('[data-tmdb]')
      if (tm) return busy(tm, () => openTmdbFilm(Number(tm.dataset.tmdb)))
      const lo = e.target.closest('[data-local]')
      if (lo) {
        const f = ADM.visuals.find((v) => v.film_id === lo.dataset.local)?.film
        if (f?.tmdb_id) return busy(lo, () => openTmdbFilm(f.tmdb_id, f))
        S.film = { local: f }; return go('photo')
      }
      const more = e.target.closest('[data-more]')
      if (more) busy(more, async () => { try { const r = await api.server(`/api/tmdb?action=search&q=${encodeURIComponent(input.value.trim())}&page=${page1 + 1}`); results = results.concat(r.results); page1 = r.page; draw(localMatches(input.value), null) } catch (err) { toast(errMsg(err), 'error') } })
    }
    $('[data-manual]', page).onclick = () => { S.film = { manual: { title: input.value.trim(), original_title: '', release_year: '', director: '', overview: '' } }; go('manual') }
    if (input.value.trim().length >= 2) search()
  }

  // ── B. Galerie de TOUS les visuels du film ──────────────────────────
  function stepGallery() {
    const movie = S.film.tmdb
    const owned = new Map(filmVisuals().filter((v) => v.tmdb_file_path).map((v) => [v.tmdb_file_path, v]))
    const g = groupPosters(movie.posters)
    const tile = (p) => { const dup = owned.get(p.file_path); return html`<div class="gtile">
      <button class="pick" data-pick="${p.file_path}" aria-label="Choisir ce visuel (${languageName(p.iso_639_1)})${dup ? ', déjà en stock' : ''}">${posterHtml(img.tmdb(p.file_path, 'w342'), '')}</button>
      <span class="lang">${p.iso_639_1 && p.iso_639_1 !== 'xx' ? p.iso_639_1 : 'sans texte'}</span>
      <button class="zoom" data-zoom="${p.file_path}" aria-label="Agrandir">${icon('maximize')}</button>
      ${dup ? html`<span class="owned">${icon('check')} Déjà en stock</span>` : ''}</div>` }
    const section = (title, list, extra = '') => (list.length ? html`<section ${raw(extra)}><p class="eyebrow" style="margin-bottom:10px">${title} <span style="color:var(--ink-4)">(${list.length})</span></p><div class="gal">${list.map(tile)}</div></section>` : '')
    frame(html`<div class="stack" style="gap:24px">
      <p class="muted" style="margin-top:-8px">Touchez le visuel qui correspond exactement à votre affiche physique. ${plural(movie.posters.length, 'visuel')} sur TMDB.</p>
      <button class="dashed-btn" style="height:54px;margin:0" data-photo>${icon('camera')} Visuel introuvable ? Ajouter ma propre affiche</button>
      ${movie.posters.length ? '' : html`<div class="empty"><div class="ico">${icon('camera')}</div><h3>Aucun visuel sur TMDB</h3><p>Photographiez votre affiche.</p></div>`}
      ${section('Affiches françaises', g.fr)}${section('Affiches sans texte', g.none)}${section('Affiches anglaises', g.en)}
      ${g.others.length ? html`<button class="btn btn-secondary" style="align-self:center" data-others>${icon('chevD')} Voir les autres langues (${plural(g.others.reduce((s, [, l]) => s + l.length, 0), 'visuel')}, ${plural(g.others.length, 'langue')})</button>
        <div class="stack hidden" style="gap:24px" data-others-box>${g.others.map(([lang, list]) => section(`Langue : ${languageName(lang)}`, list))}</div>` : ''}</div>`)
    const pick = async (path) => {
      const dup = owned.get(path)
      if (dup) {
        const r = await confirmDialog({ title: 'Visuel déjà enregistré', confirmLabel: 'Ajouter du stock',
          message: html`<p>Ce visuel existe déjà (<b class="mono">${dup.reference_code}</b>, ${plural(totalQuantity(dup), 'exemplaire')}). Pour éviter un doublon, ajoutez plutôt des exemplaires à cette référence.</p>` })
        if (r) { navigate(A(`/affiche/${dup.id}`)); setTimeout(() => addStockSheet(findVisual(dup.id), {}, ADM.refreshView), 120) }
        return
      }
      S.image = { kind: 'tmdb', poster: movie.posters.find((p) => p.file_path === path) }
      go('form')
    }
    page.onclick = (e) => {
      const z = e.target.closest('[data-zoom]')
      if (z) {
        const lb = lightbox(img.tmdb(z.dataset.zoom, 'original'), 'Visuel TMDB', html`<button class="btn btn-gold lg" data-choose>${icon('check')} Choisir ce visuel</button>`)
        $('[data-choose]', lb.el).onclick = () => { lb.close(); pick(z.dataset.zoom) }
        return
      }
      const p = e.target.closest('[data-pick]')
      if (p) return pick(p.dataset.pick)
      if (e.target.closest('[data-photo]')) return go('photo')
      const o = e.target.closest('[data-others]')
      if (o) { o.remove(); $('[data-others-box]', page).classList.remove('hidden') }
    }
  }

  // ── Fiche film manuelle ─────────────────────────────────────────────
  function stepManual() {
    const m = S.film.manual
    frame(html`<form class="card pad stack" novalidate data-form>
      <h2 class="display" style="font-size:20px;font-weight:600">Nouveau film (hors TMDB)</h2><div data-err></div>
      <div class="field"><label for="m-title">Titre français *</label><input class="input" id="m-title" name="title" value="${m.title}" autofocus></div>
      <div class="grid2"><div class="field"><label for="m-orig">Titre original</label><input class="input" id="m-orig" name="original_title" value="${m.original_title}"></div>
        <div class="field"><label for="m-year">Année de sortie</label><input class="input" id="m-year" name="release_year" inputmode="numeric" maxlength="4" value="${m.release_year}"></div></div>
      <div class="field"><label for="m-dir">Réalisation</label><input class="input" id="m-dir" name="director" value="${m.director}"></div>
      <div class="field"><label for="m-ov">Synopsis (facultatif)</label><textarea class="textarea" id="m-ov" name="overview">${m.overview}</textarea></div>
      <button class="btn btn-primary lg" type="submit">${icon('camera')} Continuer : photographier l’affiche</button></form>`)
    $('[data-form]', page).onsubmit = (e) => {
      e.preventDefault()
      const f = e.target
      const year = f.release_year.value.trim()
      const err = !f.title.value.trim() ? 'Le titre est obligatoire.' : year && !/^(18[89]\d|19\d\d|20\d\d|21\d\d)$/.test(year) ? 'Année invalide (ex. 1987).' : null
      if (err) return setHTML($('[data-err]', page), html`<div class="alert error">${err}</div>`)
      S.film = { manual: { title: f.title.value.trim(), original_title: f.original_title.value.trim(), release_year: year, director: f.director.value.trim(), overview: f.overview.value.trim() } }
      go('photo')
    }
  }

  // ── Photo personnelle ───────────────────────────────────────────────
  function stepPhoto() {
    frame(html`<div class="card pad"><h2 class="display" style="font-size:20px;font-weight:600">Ajouter ma propre affiche</h2>
      <p class="muted small" style="margin:4px 0 16px">Photographiez l’affiche physique ou importez une image. ${S.film?.tmdb || S.film?.local ? 'Les informations du film sont conservées : seul le visuel est personnalisé.' : ''}</p><div data-photo></div></div>`)
    photoCapture($('[data-photo]', page), (photo) => { S.image = { kind: 'photo', photo }; go('form') })
  }

  // ── C. Quantités, emplacements, prix, visibilité ────────────────────
  function stepForm() {
    const fmts = activeFormats()
    const defLoc = lastLocation() || ADM.locations.find((l) => l.is_active)?.id || ''
    let lines = fmts.map((f, i) => ({ formatId: f.id, locationId: defLoc, qty: i === 0 ? 1 : 0 }))
    const preview = S.image.kind === 'photo' ? S.image.photo.previewUrl : img.tmdb(S.image.poster.file_path, 'w500')
    const big = S.image.kind === 'photo' ? S.image.photo.previewUrl : img.tmdb(S.image.poster.file_path, 'original')
    const label = S.image.kind === 'photo' ? defaultVisualLabel('photo') : defaultVisualLabel('tmdb', S.image.poster.iso_639_1)
    const locOptions = (sel) => html`${ADM.locations.filter((l) => l.is_active || l.id === sel).map((l) => html`<option value="${l.id}" ${attr(l.id === sel, 'selected')}>${l.name}</option>`)}<option value="__new">+ Nouvel emplacement…</option>`
    frame(html`<div class="split side-l has-sticky">
      <div class="stack" style="align-items:center">
        <button style="all:unset;cursor:zoom-in;width:100%;max-width:220px" data-zoom-sel aria-label="Agrandir le visuel choisi">${posterHtml(preview, 'Visuel choisi', { eager: true, cls: 'shadow' })}</button>
        <span class="badge brand">${S.image.kind === 'photo' ? 'Photo personnelle' : `TMDB · ${languageName(S.image.poster.iso_639_1)}`}</span>
        <button class="btn btn-ghost sm" data-change-img>Changer de visuel</button></div>
      <form class="stack" style="gap:18px" data-form novalidate>
        <div data-err></div>
        <div class="card pad stack">
          <div><h2 class="display" style="font-size:19px;font-weight:600">Quantités et emplacements</h2>
            <p class="muted small" style="margin-top:2px">Une ligne par format et par emplacement. Ajoutez une ligne si les exemplaires sont rangés à plusieurs endroits.</p></div>
          <div class="qtable" data-lines></div>
          <button type="button" class="btn btn-ghost sm" style="align-self:flex-start;color:var(--brand-700)" data-add-line>${icon('plus')} Ajouter une ligne (autre emplacement)</button>
          ${ADM.locations.length ? '' : html`<div class="alert info">Aucun emplacement n’existe encore : choisissez « + Nouvel emplacement… » dans la liste.</div>`}
        </div>
        <div class="card pad stack">
          <div class="field"><label for="f-label">Nom du visuel</label><input class="input" id="f-label" name="label" value="${label}"><span class="hint">Pour distinguer les affiches d’un même film (ex. « Affiche teaser », « Affiche personnage »).</span></div>
          ${switchHtml('published', true, 'Publiée dans la vitrine', 'Visible par les clients tant qu’il reste des exemplaires. Décochez pour l’enregistrer en « Masquée ».')}
          <details><summary class="link" style="cursor:pointer;text-decoration:none">${icon('chevD')} Prix personnalisé (facultatif)</summary>
            <div class="grid2" style="margin-top:12px">${fmts.map((f) => html`<div class="field"><label for="pr-${f.id}">${f.label}</label>
              <div class="input-wrap"><input class="input" id="pr-${f.id}" data-price="${f.id}" inputmode="decimal" placeholder="${centsToInput(f.default_price_cents) || '0,00'}"><span style="position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--ink-3)">€</span></div>
              <span class="hint">${f.default_price_cents !== null ? `Par défaut : ${formatPrice(f.default_price_cents)}` : 'Aucun prix par défaut (voir Réglages)'}</span></div>`)}</div></details>
        </div>
        <div class="sticky-save"><button class="btn btn-primary lg block" type="submit" data-save>${icon('checkCircle')} <span data-save-label>Enregistrer l’affiche</span></button></div>
      </form></div>`)
    const drawLines = () => {
      setHTML($('[data-lines]', page), lines.map((ln, i) => html`<div class="qrow" data-line="${i}">
        <div class="stack tight"><div class="row wrap" style="gap:8px">
          <select class="select" style="width:auto;min-width:150px;height:44px" data-l-format aria-label="Format">${fmts.map((f) => html`<option value="${f.id}" ${attr(f.id === ln.formatId, 'selected')}>${f.label}</option>`)}</select>
          <select class="select" style="width:auto;min-width:170px;height:44px" data-l-loc aria-label="Emplacement"><option value="" ${attr(!ln.locationId, 'selected')} disabled>Emplacement…</option>${locOptions(ln.locationId)}</select>
          ${lines.length > 1 ? html`<button type="button" class="icon-btn" data-l-del aria-label="Supprimer la ligne">${icon('trash')}</button>` : ''}</div></div>
        ${stepperHtml(`q${i}`, ln.qty, { label: `Quantité ligne ${i + 1}` })}</div>`))
      const total = lines.reduce((s, l) => s + l.qty, 0)
      $('[data-save-label]', page).textContent = `Enregistrer l’affiche${total ? ` · ${total} ex.` : ''}`
    }
    drawLines()
    const lineIndex = (el) => Number(el.closest('[data-line]').dataset.line)
    const linesBox = $('[data-lines]', page)
    linesBox.addEventListener('input', (e) => { if (e.target.closest('[data-stepper]')) { lines[lineIndex(e.target)].qty = Math.max(0, Math.floor(Number(e.target.value)) || 0); const total = lines.reduce((s, l) => s + l.qty, 0); $('[data-save-label]', page).textContent = `Enregistrer l’affiche${total ? ` · ${total} ex.` : ''}` } })
    linesBox.addEventListener('change', async (e) => {
      const i = lineIndex(e.target)
      if (e.target.matches('[data-l-format]')) lines[i].formatId = Number(e.target.value)
      if (e.target.matches('[data-l-loc]')) {
        if (e.target.value === '__new') {
          const name = await promptDialog('Nouvel emplacement', 'Nom de l’emplacement', 'Ex. Réserve B, Carton 3')
          if (name) { try { const l = await api.insert('locations', { name }); ADM.locations = await api.locations(); lines[i].locationId = l.id; toast(`Emplacement « ${l.name} » créé`) } catch (err) { toast(errMsg(err), 'error') } }
          drawLines()
        } else lines[i].locationId = e.target.value
      }
    })
    linesBox.addEventListener('click', (e) => { if (e.target.closest('[data-l-del]')) { lines.splice(lineIndex(e.target), 1); drawLines() } })
    $('[data-add-line]', page).onclick = () => { lines.push({ formatId: fmts[0]?.id, locationId: '', qty: 1 }); drawLines() }
    $('[data-zoom-sel]', page).onclick = () => lightbox(big, 'Visuel choisi')
    $('[data-change-img]', page).onclick = () => go(S.image.kind === 'photo' ? 'photo' : 'gallery')

    $('[data-form]', page).onsubmit = (e) => {
      e.preventDefault()
      const f = e.target
      const err = (m) => { setHTML($('[data-err]', page), html`<div class="alert error" role="alert">${m}</div>`); window.scrollTo({ top: 0, behavior: 'smooth' }) }
      const stock = lines.filter((l) => l.qty > 0)
      if (stock.some((l) => !l.locationId)) return err('Choisissez l’emplacement de chaque ligne de stock.')
      const keys = stock.map((l) => `${l.formatId}:${l.locationId}`)
      if (new Set(keys).size !== keys.length) return err('Deux lignes ont le même format et le même emplacement : regroupez-les.')
      const prices = []
      for (const fm of fmts) {
        const v = $(`[data-price="${fm.id}"]`, page).value
        const c = parsePriceToCents(v)
        if (Number.isNaN(c)) return err(`Prix invalide pour « ${fm.label} » (ex. 12,50).`)
        if (c !== null) prices.push({ format_id: fm.id, price_cents: c })
      }
      busy($('[data-save]', page), async () => {
        let uploaded = []
        try {
          let visual
          if (S.image.kind === 'photo') {
            const folder = `visuals/${crypto.randomUUID()}`
            const full = `${folder}/full.jpg`, thumb = `${folder}/thumb.jpg`
            await api.upload(full, S.image.photo.full); uploaded.push(full)
            await api.upload(thumb, S.image.photo.thumb); uploaded.push(thumb)
            visual = { source: 'photo', image_path: full, thumb_path: thumb }
          } else visual = { source: 'tmdb', tmdb_file_path: S.image.poster.file_path, tmdb_language: S.image.poster.iso_639_1 }
          visual.label = f.label.value.trim()
          visual.status = f.published.checked ? 'published' : 'hidden'
          const lf = localFilm()
          const t = S.film.tmdb
          const film = lf ? { id: lf.id, title: lf.title }
            : t ? { tmdb_id: t.id, title: t.title, original_title: t.original_title, release_date: t.release_date, release_year: yearOf(t), overview: t.overview || null, genres: t.genres, runtime: t.runtime, director: t.director, tmdb_poster_path: t.poster_path }
              : { title: S.film.manual.title, original_title: S.film.manual.original_title || null, release_year: S.film.manual.release_year ? Number(S.film.manual.release_year) : null, director: S.film.manual.director || null, overview: S.film.manual.overview || null }
          const r = await api.rpc('create_poster', { p: { film, visual, stock: stock.map((l) => ({ format_id: l.formatId, location_id: l.locationId, quantity: l.qty })), prices } })
          if (r.status === 'duplicate') {
            await api.removeFiles(uploaded).catch(() => {})
            toast('Ce visuel existait déjà : ouverture de sa fiche.', 'info')
            await loadAdminData()
            return navigate(A(`/affiche/${r.visual_id}`))
          }
          const firstLoc = stock[0]?.locationId
          if (firstLoc) rememberLocation(firstLoc)
          await loadAdminData()
          ADM.movementVersion++
          S.createdId = r.visual_id
          S.film = { ...S.film, local: findVisual(r.visual_id)?.film, manual: undefined }
          toast('Affiche enregistrée')
          go('done')
        } catch (ex) {
          await api.removeFiles(uploaded).catch(() => {})
          err(errMsg(ex))
        }
      })
    }
  }

  // ── Terminé ─────────────────────────────────────────────────────────
  function stepDone() {
    const v = findVisual(S.createdId)
    const visible = v && isPubliclyVisible(v, activeFormatIds())
    frame(html`<div class="card pad stack" style="max-width:560px;margin:0 auto;align-items:center;text-align:center">
      <div style="width:140px;position:relative">${posterHtml(v ? img.visual(v, 'card') : null, '', { cls: 'shadow' })}
        <span style="position:absolute;right:-10px;bottom:-10px;width:44px;height:44px;border-radius:50%;background:var(--ok);color:#fff;display:flex;align-items:center;justify-content:center;border:4px solid #fff">${icon('check')}</span></div>
      <div><p class="display" style="font-size:24px;font-weight:600">${v?.film.title}</p>
        <p class="muted"><span class="mono" style="color:var(--ink)">${v?.reference_code}</span>${v?.label ? ` · ${v.label}` : ''}</p>
        <p class="small" style="margin-top:8px;font-weight:700;color:${visible ? 'var(--ok)' : 'var(--ink-3)'}">${visible ? 'Visible dès maintenant dans la vitrine.' : v?.status === 'hidden' ? 'Masquée : invisible dans la vitrine.' : 'Invisible tant qu’aucun exemplaire n’est en stock.'}</p></div>
      <div class="stack tight" style="width:100%">
        <button class="btn btn-primary lg block" data-another>${icon('plus')} Ajouter un autre visuel de ce film</button>
        <button class="btn btn-secondary lg block" data-new>Nouvelle affiche (autre film)</button>
        <div class="row" style="justify-content:center;gap:18px;margin-top:6px"><a class="link small" href="${A(`/affiche/${S.createdId}`)}">Voir la fiche</a>${visible ? html`<a class="link small" href="/affiche/${S.createdId}" target="_blank" rel="noopener">Voir dans la vitrine</a>` : ''}</div></div></div>`)
    $('[data-another]', page).onclick = () => { S.image = null; go(S.film?.tmdb ? 'gallery' : 'photo') }
    $('[data-new]', page).onclick = () => { S.film = null; S.image = null; S.q = ''; setQuery(new URLSearchParams()); go('search') }
  }

  // « Ajouter un autre visuel de ce film » depuis une fiche : ?film=<id>
  const filmParam = qs().get('film')
  const f = filmParam && ADM.visuals.find((v) => v.film_id === filmParam)?.film
  if (f) {
    setHTML(page, html`<div class="boot" style="min-height:200px"><span class="spinner"></span> Chargement des affiches du film…</div>`)
    if (f.tmdb_id) await openTmdbFilm(f.tmdb_id, f)
    else { S.film = { local: f }; go('photo') }
  } else go('search')
}

   Q. INVENTAIRE PDF (A4, miniatures ≈ 3 cm, cases de suivi au stylo)
   ═══════════════════════════════════════════════════════════════════════ */
const THUMB_PX = { w: 120, h: 180 }
async function thumbDataUrl(url) {
  const ctrl = new AbortController()
  const timer = setTimeout(() => ctrl.abort(), 15000)
  try {
    const res = await fetch(url, { mode: 'cors', signal: ctrl.signal })
    if (!res.ok) throw new Error(String(res.status))
    const bmp = await createImageBitmap(await res.blob())
    const c = document.createElement('canvas')
    c.width = THUMB_PX.w; c.height = THUMB_PX.h
    const ctx = c.getContext('2d')
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height)
    const k = Math.max(c.width / bmp.width, c.height / bmp.height)
    ctx.drawImage(bmp, (c.width - bmp.width * k) / 2, (c.height - bmp.height * k) / 2, bmp.width * k, bmp.height * k)
    bmp.close?.()
    return c.toDataURL('image/jpeg', 0.82)
  } finally { clearTimeout(timer) }
}
async function prepareThumbs(rows, onProgress) {
  const ids = [...new Set(rows.map((r) => r.visualId))]
  const out = {}
  let i = 0, done = 0
  const worker = async () => {
    while (i < ids.length) {
      const id = ids[i++]
      const v = findVisual(id)
      const url = v ? img.visual(v, 'thumb') : null
      out[id] = url ? await thumbDataUrl(url).catch(() => null) : null
      onProgress(++done, ids.length)
    }
  }
  await Promise.all(Array.from({ length: Math.min(6, ids.length) }, worker))
  return out
}

function inventoryDoc({ rows, opts, thumbs, scopeLabel }) {
  const s = ADM.settings
  const date = fmtDateTime(new Date())
  const copies = rows.reduce((a, r) => a + r.quantity, 0)
  const INK = '#211d18', MUTED = '#6b6458', LINE = '#cfc6b6', DARK = '#142c26'
  // pdfmake modifie les objets qu'il met en page : chaque case / ligne doit être un objet neuf.
  const box = () => ({ canvas: [{ type: 'rect', x: 0, y: 1, w: 8.5, h: 8.5, lineWidth: 0.9, lineColor: INK }], width: 13 })
  const writeLine = () => ({ canvas: [{ type: 'line', x1: 0, y1: 11, x2: 116, y2: 11, lineWidth: 0.5, lineColor: '#9b9386' }] })
  const widths = [...(opts.thumbnails ? [62] : []), '*', 62, 30, 74, ...(opts.prices ? [44] : []), 124]
  const head = [...(opts.thumbnails ? ['Visuel'] : []), 'Film · référence', 'Format', 'Qté', 'Emplacement', ...(opts.prices ? ['Prix'] : []), 'Suivi manuel']
    .map((t, i, arr) => ({ text: t.toUpperCase(), style: 'th', alignment: t === 'Qté' ? 'center' : t === 'Prix' ? 'right' : 'left', ...(i === arr.length ? {} : {}) }))
  const ncol = head.length
  const body = [head]
  let group = null
  for (const r of rows) {
    if (opts.sort === 'location' && r.location !== group) {
      group = r.location
      const n = rows.filter((x) => x.location === group).reduce((a, x) => a + x.quantity, 0)
      body.push([{ text: group === '—' ? 'Références épuisées' : `${group} · ${plural(n, 'exemplaire')}`, colSpan: ncol, style: 'group' }, ...Array(ncol - 1).fill({})])
    }
    const thumb = thumbs[r.visualId]
    const cells = []
    if (opts.thumbnails) cells.push(thumb ? { image: thumb, width: 57, height: 85 } : { stack: [{ canvas: [{ type: 'rect', x: 0, y: 0, w: 57, h: 85, lineWidth: 0.6, lineColor: LINE, dash: { length: 3 } }] }, { text: 'Image\nindisponible', fontSize: 6, color: MUTED, margin: [0, -52, 0, 0], alignment: 'center' }], width: 57 })
    cells.push({ stack: [
      { text: r.title, bold: true, fontSize: 10 },
      { text: r.year ? String(r.year) : 'Année inconnue', color: MUTED, fontSize: 8, margin: [0, 1, 0, 0] },
      { text: r.reference, bold: true, fontSize: 8.5, margin: [0, 2, 0, 0], characterSpacing: 0.3 },
      ...(r.label ? [{ text: r.label, color: MUTED, fontSize: 8 }] : []),
      ...(r.hidden ? [{ text: 'Masquée dans la vitrine', color: '#7a5b29', fontSize: 7 }] : []),
    ] })
    cells.push({ text: r.format })
    cells.push(r.soldOut ? { text: 'Épuisé', color: '#a3261f', bold: true, fontSize: 8, alignment: 'center' } : { text: String(r.quantity), bold: true, fontSize: 13, alignment: 'center' })
    cells.push({ text: r.location })
    if (opts.prices) cells.push({ text: r.price !== null && r.price !== undefined ? formatPrice(r.price) : '—', alignment: 'right' })
    cells.push({ stack: [
      { columns: [box(), { text: 'Réservé', width: 46 }, box(), { text: 'Retiré', width: 40 }], columnGap: 0, fontSize: 8.5 },
      { text: 'Nom · date · remarque', fontSize: 6.5, color: MUTED, margin: [0, 5, 0, 0] },
      writeLine(), ...(opts.thumbnails ? [writeLine(), writeLine()] : []),
    ] })
    body.push(cells)
  }
  return {
    pageSize: 'A4', pageMargins: [28, 74, 28, 42],
    info: { title: `Inventaire des affiches — ${s.cinema_name}`, author: s.catalog_name },
    header: () => ({ margin: [28, 22, 28, 0], stack: [
      { columns: [
        { stack: [{ text: 'Inventaire des affiches', fontSize: 15, bold: true, color: DARK }, { text: `${s.catalog_name} · Cinéma ${s.cinema_name} · ${scopeLabel}`, fontSize: 8.5, color: MUTED, margin: [0, 2, 0, 0] }] },
        { stack: [{ text: `Généré le ${date}`, fontSize: 8, color: MUTED }, { text: `${plural(rows.length, 'ligne')} · ${plural(copies, 'exemplaire')}`, fontSize: 8, color: MUTED }], alignment: 'right', width: 'auto' },
      ] },
      { canvas: [{ type: 'line', x1: 0, y1: 6, x2: 539, y2: 6, lineWidth: 1.6, lineColor: DARK }] },
    ] }),
    footer: (p, n) => ({ margin: [28, 14, 28, 0], columns: [{ text: `${s.catalog_name} — ${s.cinema_name}`, fontSize: 7.5, color: MUTED }, { text: `Page ${p} / ${n}`, alignment: 'right', fontSize: 7.5, color: MUTED }] }),
    content: rows.length ? [{
      table: { headerRows: 1, dontBreakRows: true, widths, body },
      layout: {
        fillColor: (i, node) => (i === 0 ? DARK : node.table.body[i]?.[0]?.style === 'group' ? '#efe8da' : i % 2 === 0 ? '#f7f3ec' : null),
        hLineWidth: (i) => (i === 0 ? 0 : 0.6), vLineWidth: () => 0, hLineColor: () => LINE,
        paddingLeft: () => 4, paddingRight: () => 4, paddingTop: () => 5, paddingBottom: () => 5,
      },
    }] : [{ text: 'Aucune affiche ne correspond aux options choisies.', color: MUTED, margin: [0, 20, 0, 0] }],
    styles: { th: { bold: true, fontSize: 7.5, color: '#ffffff', characterSpacing: 0.4 }, group: { bold: true, fontSize: 10, color: DARK, margin: [0, 2, 0, 2] } },
    defaultStyle: { font: 'Roboto', fontSize: 9, color: INK, lineHeight: 1.1 },
  }
}

  setHTML(page, html`${pageHead('Inventaire PDF', 'Document A4 imprimable (couleur ou noir et blanc) pour le comptage et le suivi au stylo.')}
    <div class="split side-r">
      <div class="card pad stack">

        <div class="field ${o.scope === 'location' ? '' : 'hidden'}" data-locfield><label for="inv-loc">Emplacement</label><select class="select" id="inv-loc">${ADM.locations.map((l) => html`<option value="${l.id}" ${attr(l.id === o.locationId, 'selected')}>${l.name}</option>`)}</select></div>

        <div class="stack tight" style="padding:14px;border:1px solid var(--line);border-radius:16px;background:var(--bg)">
          ${switchHtml('thumbs', o.thumbnails, 'Avec miniatures', 'Environ 3 cm de haut par affiche.')}${switchHtml('prices', o.prices, 'Avec prix')}</div>
        <p class="muted small">Chaque ligne comporte les cases <b>☐ Réservé</b> et <b>☐ Retiré</b> et une zone pour écrire un nom, une date ou une remarque. Une ligne n’est jamais coupée entre deux pages ; l’en-tête du tableau est répété sur chaque page.</p>
      </div>
      <aside><div class="card pad stack">${icon('printer')}
        <div><p class="display" style="font-size:26px;font-weight:600" data-count></p><p class="muted small" data-scope></p></div>
        <button class="btn btn-primary lg block" data-gen>${icon('printer')} Générer le PDF</button>
        <div class="hidden stack tight" data-progress><div class="progress"><div style="width:0%"></div></div><p class="xs muted" data-ptext></p></div>
        <div class="hidden stack tight" data-ready><div class="alert success">PDF prêt.</div>
          <a class="btn btn-primary block" data-dl download>${icon('download')} Télécharger</a>
          <a class="btn btn-secondary block" data-open target="_blank" rel="noopener">${icon('external')} Ouvrir pour imprimer</a></div>
      </div></aside></div>`)
  const scopeLabel = () => (o.scope === 'all' ? 'Inventaire complet' : o.scope === 'available' ? 'Affiches disponibles' : `Emplacement : ${ADM.locations.find((l) => l.id === o.locationId)?.name || '?'}`)
  const rows = () => buildInventoryRows(ADM.visuals, ADM.formats, ADM.locations, o)
  const sync = () => {
    const r = rows()
    $('[data-count]', page).textContent = plural(r.length, 'ligne')
    $('[data-scope]', page).textContent = `${plural(r.reduce((a, x) => a + x.quantity, 0), 'exemplaire')} · ${scopeLabel()}`
    $('[data-locfield]', page).classList.toggle('hidden', o.scope !== 'location')
    $('[data-gen]', page).disabled = !r.length
    if (result) { URL.revokeObjectURL(result); result = null }
    $('[data-ready]', page).classList.add('hidden')
  }
  page.addEventListener('change', (e) => {
    if (e.target.closest('[data-seg="scope"]')) o.scope = e.detail
    if (e.target.closest('[data-seg="sort"]')) o.sort = e.detail
    if (e.target.id === 'inv-loc') o.locationId = e.target.value
    if (e.target.name === 'thumbs') o.thumbnails = e.target.checked
    if (e.target.name === 'prices') o.prices = e.target.checked
    sync()
  })
  $('[data-gen]', page).onclick = (e) => busy(e.currentTarget, async () => {
    const prog = $('[data-progress]', page)
    const bar = $('.progress > div', page)
    const text = $('[data-ptext]', page)
    prog.classList.remove('hidden')
    try {
      text.textContent = 'Chargement du générateur PDF…'
      const pdfMake = await loadPdfMake()
      const r = rows()
      let thumbs = {}
      if (o.thumbnails) {
        thumbs = await prepareThumbs(r, (d, n) => { bar.style.width = `${Math.round((d / n) * 100)}%`; text.textContent = `Préparation des miniatures ${d}/${n}…` })
        const missing = Object.values(thumbs).filter((x) => !x).length
        if (missing) toast(`${plural(missing, 'miniature indisponible', 'miniatures indisponibles')} : remplacée${missing > 1 ? 's' : ''} par un cadre vide.`, 'info')
      }
      bar.style.width = '100%'
      text.textContent = 'Mise en page du document…'
      const blob = await new Promise((res, rej) => { try { pdfMake.createPdf(inventoryDoc({ rows: r, opts: o, thumbs, scopeLabel: scopeLabel() })).getBlob(res) } catch (err) { rej(err) } })
      result = URL.createObjectURL(blob)
      const name = `inventaire-affiches-${new Date().toISOString().slice(0, 10)}.pdf`
      Object.assign($('[data-dl]', page), { href: result, download: name })
      $('[data-open]', page).href = result
      $('[data-ready]', page).classList.remove('hidden')
    } catch (err) {
      console.error(err)
      toast('La génération du PDF a échoué. Réessayez, éventuellement sans miniatures.', 'error')
    } finally { prog.classList.add('hidden') }
  })
  ADM.refreshView = sync
  sync()
}

      <form class="row wrap" data-new-format><input class="input grow" style="min-width:200px" name="label" placeholder="Nouveau format (ex. Format 120 × 160)" aria-label="Nom du nouveau format"><button class="btn btn-secondary" type="submit">${icon('plus')} Ajouter un format</button></form>`)}
    ${section('Emplacements', 'Zones de rangement physiques (privées).', html`<a class="card list-link" href="${A('/emplacements')}"><span class="ico">${icon('pin')}</span><span class="grow"><b>Gérer les emplacements</b><br><span class="muted small">${plural(ADM.locations.length, 'emplacement')}</span></span>${icon('chevR')}</a>`)}
    ${section('Inventaire PDF', 'Options proposées par défaut.', html`<div class="card pad stack">${switchHtml('pdf_include_thumbnails', s.pdf_include_thumbnails, 'Miniatures des affiches')}${switchHtml('pdf_include_prices', s.pdf_include_prices, 'Colonne des prix')}</div>`)}
    ${section('QR code de la vitrine', 'À imprimer et afficher dans le hall du cinéma.', html`<div class="card pad qr-box"><div class="qr" data-qr><span class="spinner"></span></div>
      <div class="stack tight"><p class="mono small" style="word-break:break-all">${location.origin}/</p><p class="muted small">Les clients scannent ce code pour consulter les affiches disponibles, sans compte ni application. Il pointe vers l’adresse publique : il reste valable après le transfert de l’administration.</p>
        <div class="row wrap"><button class="btn btn-secondary sm" data-qr-png>${icon('download')} QR code (PNG)</button><button class="btn btn-primary sm" data-qr-pdf>${icon('printer')} Affichette à imprimer (PDF)</button></div></div></div>`)}
    ${section('Mon compte', '', html`<div class="card pad stack">
      <div><p class="label">Adresse e-mail</p><p class="mono">${ADM.profile.email}</p><p class="small muted">${ROLE_LABELS[ADM.profile.role]}</p></div>
      <div class="field"><label for="me-name">Nom affiché dans l’historique</label><input class="input" id="me-name" value="${ADM.profile.display_name || ''}" placeholder="${ADM.profile.email}"></div></div>
      <form class="card pad stack" data-pw novalidate><p style="font-weight:800">Modifier le mot de passe</p>
        ${passwordField('current', 'Mot de passe actuel')}
        ${passwordField('pw', 'Nouveau mot de passe', { autocomplete: 'new-password', hint: `${MIN_PASSWORD} caractères minimum` })}
        ${passwordField('pw2', 'Confirmer le nouveau mot de passe', { autocomplete: 'new-password' })}
        <button class="btn btn-primary" style="align-self:flex-start" type="submit">${icon('key')} Changer le mot de passe</button></form>
      <button class="btn btn-danger-ghost" style="align-self:flex-start" data-logout>${icon('logout')} Se déconnecter</button>`)}
    </div>`)

  const saveSettings = async (patch, msg = 'Réglages enregistrés') => {
    try { await api.update('app_settings', { id: true }, patch); ADM.settings = await api.settings(); applyBrand(ADM.settings); toast(msg); return true }
    catch (err) { toast(errMsg(err), 'error'); return false }
  }
  // Interrupteurs (vitrine, PDF)
  page.addEventListener('change', async (e) => {
    const n = e.target.name
    if (['show_prices', 'show_recent', 'pdf_include_thumbnails', 'pdf_include_prices'].includes(n)) {
      if (!owner) { e.target.checked = !e.target.checked; return toast('Réglage réservé à l’administrateur principal.', 'error') }
      if (!(await saveSettings({ [n]: e.target.checked }))) e.target.checked = !e.target.checked
    }
  })
  const cat = $('[data-catalog]', page)
  cat.onsubmit = (e) => {
    e.preventDefault()
    const f = e.target
    if (!f.catalog_name.value.trim() || !f.cinema_name.value.trim()) return toast('Le nom du catalogue et celui du cinéma sont obligatoires.', 'error')
    busy($('[type=submit]', f), () => saveSettings({
      catalog_name: f.catalog_name.value.trim(), cinema_name: f.cinema_name.value.trim(), tagline: f.tagline.value.trim(), contact_note: f.contact_note.value.trim(),
      accent_color: f.accent_color.value.toLowerCase() === '#1b3a32' ? null : f.accent_color.value, recent_count: Math.min(24, Math.max(0, Math.round(Number(f.recent_count.value)) || 0)),
    }).then((r) => { if (r) { ADM.shell = false; render() } }))
  }
  $('[data-color-reset]', page).onclick = () => { cat.accent_color.value = '#1b3a32' }
  // Logo
  $('[data-logo]', page).onclick = () => $('[data-logo-file]', page).click()
  $('[data-logo-file]', page).onchange = async (e) => {
    const file = e.target.files?.[0]
    if (!file) return
    if (!/^image\/(png|jpeg|webp)$/.test(file.type) || file.size > 10 * 1024 * 1024) return toast('Logo : image PNG, JPEG ou WebP de 10 Mo maximum.', 'error')
    await busy($('[data-logo]', page), async () => {
      try {
        const bmp = await createImageBitmap(file)
        const k = Math.min(1, 512 / Math.max(bmp.width, bmp.height))
        const c = document.createElement('canvas'); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k)
        c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height)
        const blob = await new Promise((r) => c.toBlob(r, 'image/png'))
        const path = `branding/logo-${Date.now()}.png`
        await api.upload(path, blob)
        const old = s.logo_path
        if (await saveSettings({ logo_path: path }, 'Logo mis à jour')) { await api.removeFiles([old]).catch(() => {}); ADM.shell = false; render() }
      } catch (err) { toast(errMsg(err), 'error') }
    })
  }
  const rm = $('[data-logo-rm]', page)
  if (rm) rm.onclick = async () => { const old = s.logo_path; if (await saveSettings({ logo_path: null }, 'Logo retiré')) { await api.removeFiles([old]).catch(() => {}); ADM.shell = false; render() } }

  // Formats et prix par défaut
  const drawFormats = () => setHTML($('[data-formats]', page), ADM.formats.map((f) => html`<div class="card" style="padding:14px" data-fid="${f.id}"><div class="row wrap">
    <div class="field grow" style="min-width:160px"><label for="fl-${f.id}">Libellé</label><input class="input" id="fl-${f.id}" data-fl value="${f.label}"></div>
    <div class="field" style="width:140px"><label for="fp-${f.id}">Prix par défaut (€)</label><input class="input" id="fp-${f.id}" data-fp inputmode="decimal" placeholder="Non défini" value="${centsToInput(f.default_price_cents)}"></div>
    <div style="padding-top:22px">${switchHtml(`fa-${f.id}`, f.is_active, 'Actif')}</div></div></div>`))
  drawFormats()
  const fmtBox = $('[data-formats]', page)
  const saveFormat = async (id, patch, msg) => { try { await api.update('formats', { id }, patch); ADM.formats = await api.formats(); toast(msg) } catch (err) { toast(errMsg(err), 'error'); drawFormats() } }
  fmtBox.addEventListener('focusout', (e) => {
    const card = e.target.closest('[data-fid]')
    if (!card) return
    const id = Number(card.dataset.fid)
    const f = ADM.formats.find((x) => x.id === id)
    if (e.target.matches('[data-fl]') && e.target.value.trim() && e.target.value.trim() !== f.label) saveFormat(id, { label: e.target.value.trim() }, 'Format renommé')
    if (e.target.matches('[data-fp]')) {
      const c = parsePriceToCents(e.target.value)
      if (Number.isNaN(c)) return toast('Prix invalide (ex. 8,50).', 'error')
      if (c !== f.default_price_cents) saveFormat(id, { default_price_cents: c }, 'Prix par défaut enregistré')
    }
  })
  fmtBox.addEventListener('change', (e) => { if (e.target.name?.startsWith('fa-')) saveFormat(Number(e.target.name.slice(3)), { is_active: e.target.checked }, e.target.checked ? 'Format activé' : 'Format désactivé') })
  $('[data-new-format]', page).onsubmit = (e) => {
    e.preventDefault()
    const label = e.target.label.value.trim()
    if (!label) return
    const code = normalize(label).replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || `format-${Date.now()}`
    busy($('[type=submit]', e.target), async () => {
      try { await api.insert('formats', { code, label, sort_order: Math.max(0, ...ADM.formats.map((f) => f.sort_order)) + 1 }); ADM.formats = await api.formats(); e.target.reset(); drawFormats(); toast('Format ajouté') } catch (err) { toast(errMsg(err), 'error') }
    })
  }

  // QR code
  const publicUrl = `${location.origin}/`
  loadQr().then((qrcode) => {
    const qr = qrcode(0, 'M'); qr.addData(publicUrl); qr.make()
    $('[data-qr]', page).innerHTML = qr.createSvgTag({ cellSize: 4, margin: 2, scalable: true })
    $('[data-qr-png]', page).onclick = () => {
      const n = qr.getModuleCount(), size = 1024, m = 4, cell = Math.floor(size / (n + m * 2))
      const c = document.createElement('canvas'); c.width = c.height = cell * (n + m * 2)
      const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height); ctx.fillStyle = '#000'
      for (let r = 0; r < n; r++) for (let col = 0; col < n; col++) if (qr.isDark(r, col)) ctx.fillRect((col + m) * cell, (r + m) * cell, cell, cell)
      const a = document.createElement('a'); a.href = c.toDataURL('image/png'); a.download = 'qr-code-vitrine-affiches.png'; a.click()
    }
  }).catch(() => setHTML($('[data-qr]', page), html`<p class="xs muted">QR code indisponible (connexion).</p>`))
  $('[data-qr-pdf]', page).onclick = (e) => busy(e.currentTarget, async () => {
    try {
      const pdfMake = await loadPdfMake()
      const st = ADM.settings
      pdfMake.createPdf({
        pageSize: 'A4', pageMargins: [50, 70, 50, 50], info: { title: 'Affichette QR code' },
        content: [
          { text: st.cinema_name.toUpperCase(), alignment: 'center', fontSize: 13, bold: true, characterSpacing: 4, color: '#9d7737' },
          { text: 'Les affiches de cinéma', alignment: 'center', fontSize: 34, bold: true, color: '#142c26', margin: [0, 16, 0, 6] },
          { text: 'sont en vente au cinéma !', alignment: 'center', fontSize: 20, color: '#142c26' },
          { qr: publicUrl, fit: 290, alignment: 'center', margin: [0, 44, 0, 30], foreground: '#000' },
          { text: 'Scannez ce code avec l’appareil photo de votre téléphone', alignment: 'center', fontSize: 15, bold: true, color: '#211d18' },
          { text: 'pour découvrir toutes les affiches disponibles, leurs formats et leurs prix.', alignment: 'center', fontSize: 12, color: '#6b6458', margin: [0, 6, 0, 0] },
          { text: st.contact_note || '', alignment: 'center', fontSize: 12, color: '#6b6458', margin: [0, 28, 0, 0] },
          { text: publicUrl, alignment: 'center', fontSize: 10, color: '#9a9184', margin: [0, 10, 0, 0] },
        ],
        defaultStyle: { font: 'Roboto' },
      }).download('affichette-qr-code.pdf')
    } catch (err) { toast(errMsg(err), 'error') }
  })

  // Mon compte
  const nameInput = $('#me-name', page)
  nameInput.onblur = async () => {
    const v = nameInput.value.trim()
    if (v === (ADM.profile.display_name || '')) return
    try { await api.rpc('update_my_display_name', { p_name: v }); ADM.profile.display_name = v || null; toast('Nom enregistré') } catch (err) { toast(errMsg(err), 'error') }
  }
  $('[data-pw]', page).onsubmit = (e) => {
    e.preventDefault()
    const f = e.target
    const problem = passwordProblem(f.pw.value, f.pw2.value)
    if (problem) return toast(problem, 'error')
    busy($('[type=submit]', f), async () => {
      // Protection : le mot de passe actuel est revérifié avant toute modification.
      const { error: e1 } = await sb.auth.signInWithPassword({ email: ADM.profile.email, password: f.current.value })
      if (e1) return toast('Mot de passe actuel incorrect.', 'error')
      const { error } = await sb.auth.updateUser({ password: f.pw.value })
      if (error) return toast(pwError(error), 'error')
      f.reset(); toast('Mot de passe modifié')
    })
  }
  $('[data-logout]', page).onclick = () => signOut()
}

/* ═══════════════════════════════════════════════════════════════════════
   S. DÉMARRAGE
   ═══════════════════════════════════════════════════════════════════════ */
async function render({ scroll = false } = {}) {
  const route = matchRoute(location.pathname)
  if (route.redirect) history.replaceState(null, '', route.redirect)
  const prev = currentRoute
  currentRoute = route
  $('#meta-robots').content = route.area === 'admin' ? 'noindex, nofollow, noarchive' : 'index, follow'
  if (route.area === 'public') await renderPublic(route)
  else await renderAdmin(route)
  if (scroll && !(prev?.area === 'public' && route.area === 'public')) window.scrollTo(0, 0)
}

function renderConfigError(kind) {
  setHTML($('#app'), html`<main class="auth"><div class="auth-card"><div class="auth-head">${logoHtml(null)}<h1>${kind === 'not-configured' ? 'Configuration requise' : 'Site momentanément indisponible'}</h1></div>
    <div class="alert info">${kind === 'not-configured'
      ? raw('Le site n’est pas encore relié à Supabase. Ajoutez <b>SUPABASE_URL</b> et <b>SUPABASE_ANON_KEY</b> dans Vercel → Settings → Environment Variables, puis redéployez (voir le guide de mise en service).')
      : 'Le serveur ne répond pas. Vérifiez votre connexion puis rechargez la page.'}</div>
    <button class="btn btn-primary block" style="margin-top:16px" onclick="location.reload()">Recharger</button></div></main>`)
}

async function boot() {
  try { CONFIG = await loadConfig() } catch (e) { return renderConfigError(e.message) }
  if (!window.supabase?.createClient) return renderConfigError('cdn')
  sb = window.supabase.createClient(CONFIG.supabaseUrl, CONFIG.supabaseAnonKey, {
    auth: { flowType: 'implicit', persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, storage: authStorage, storageKey: 'ca-auth' },
  })
  sb.auth.onAuthStateChange((event) => {
    if (event === 'PASSWORD_RECOVERY' && LINK.type !== 'invite') LINK.type = LINK.type || 'recovery'
  })
  // Les liens reçus par e-mail (invitation, mot de passe) arrivent parfois sur la page d'accueil :
  // on attend que Supabase ait lu le lien, puis on affiche la bonne page.
  if (LINK.type || LINK.error) await sb.auth.getSession()
  const path = location.pathname
  if (LINK.type === 'invite' && !path.endsWith('/activation')) history.replaceState(null, '', A('/activation'))
  else if (LINK.type === 'recovery' && !path.endsWith('/nouveau-mot-de-passe') && !path.endsWith('/activation')) history.replaceState(null, '', A('/nouveau-mot-de-passe'))
  await render()
}
boot()
</script>
