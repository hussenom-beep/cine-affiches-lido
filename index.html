ADMIN_PAGES.history = async (page) => {
  const periods = [['today', 'Aujourd’hui'], ['7d', '7 jours'], ['30d', '30 jours'], ['all', 'Tout']]
  setHTML(page, html`${pageHead('Historique', 'Toutes les entrées et sorties de stock, horodatées, avec le compte qui les a faites.')}
    <div class="stack tight">
      <div class="search">${icon('search')}<input class="input" type="search" data-q value="${qs().get('q') || ''}" placeholder="Film, référence, commentaire, emplacement, administrateur…" aria-label="Rechercher dans l’historique"></div>
      <div class="grid2" style="gap:8px">
        <select class="select" data-reason aria-label="Motif"><option value="">Motif : tous</option>${Object.entries(REASONS).map(([k, l]) => html`<option value="${k}">Motif : ${l}</option>`)}</select>
        <select class="select" data-loc aria-label="Emplacement"><option value="">Emplacement : tous</option>${ADM.locations.map((l) => html`<option value="${l.id}">Emplacement : ${l.name}</option>`)}</select>
      </div>
      ${segHtml('period', '30d', periods)}
    </div>
    <div data-list style="margin-top:22px"></div>
    <div class="row" style="justify-content:center;margin-top:18px"><button class="btn btn-secondary hidden" data-more>Charger les mouvements plus anciens</button></div>`)
  let items = [], seq = 0
  const since = (p) => { if (p === 'all') return undefined; const d = new Date(); if (p === 'today') { d.setHours(0, 0, 0, 0); return d } return new Date(Date.now() - (p === '7d' ? 7 : 30) * 864e5) }
  const query = (beforeId) => api.movements({ text: $('[data-q]', page).value, reason: $('[data-reason]', page).value || undefined, locationId: $('[data-loc]', page).value || undefined, since: since(segValue(page, 'period')), beforeId, limit: 50 })
  const draw = () => setHTML($('[data-list]', page), items.length ? movementList(items) : html`<div class="empty"><div class="ico">${icon('history')}</div><h3>Aucun mouvement</h3><p>Aucun mouvement ne correspond à ces critères.</p></div>`)
  const load = async () => {
    const id = ++seq
    setHTML($('[data-list]', page), html`<span class="spinner"></span>`)
    try { const r = await query(); if (id !== seq) return; items = r; draw(); $('[data-more]', page).classList.toggle('hidden', r.length < 50) } catch (e) { setHTML($('[data-list]', page), html`<div class="alert error">${errMsg(e)}</div>`) }
  }
  let t
  $('[data-q]', page).oninput = () => { clearTimeout(t); t = setTimeout(load, 300) }
  $('[data-reason]', page).onchange = load
  $('[data-loc]', page).onchange = load
  $('[data-seg="period"]', page).addEventListener('change', load)
  $('[data-more]', page).onclick = (e) => busy(e.currentTarget, async () => { try { const r = await query(items.at(-1).id); items = items.concat(r); draw(); $('[data-more]', page).classList.toggle('hidden', r.length < 50) } catch (err) { toast(errMsg(err), 'error') } })
  ADM.refreshView = load
  load()
}
/* ═══════════════════════════════════════════════════════════════════════
   K bis. RÉSERVATIONS CLIENTS (saisies en caisse par les administrateurs)
   Nom et téléphone : visibles uniquement dans l'espace interne, masqués par défaut,
   effacés automatiquement 30 jours après la vente ou l'annulation.
   ═══════════════════════════════════════════════════════════════════════ */
const RES_TONE = { overdue: 'danger', to_notify: 'soon', to_remind: 'soon', waiting: 'gray', ready: 'ok', sold: 'gray', cancelled: 'gray' }
const resaInfo = (r) => reservationInfo(r, findVisual(r.visual_id), ADM.settings)
const resaLabel = (r) => `n° ${r.number}`

function resaStateText(r, info) {
  const v = findVisual(r.visual_id)
  if (info.state === 'waiting') return `En vente le ${formatDay(v?.available_from, { day: 'numeric', month: 'long' })} · le délai de retrait démarrera ce jour-là`
  if (info.state === 'overdue') return `Délai dépassé depuis ${plural(-info.daysLeft, 'jour')} (retrait avant le ${formatDay(info.due, { day: 'numeric', month: 'long' })})`
  if (info.due) return `À retirer avant le ${formatDay(info.due, { day: 'numeric', month: 'long' })}${info.daysLeft === 0 ? ' (aujourd’hui)' : ` · ${plural(info.daysLeft, 'jour')} restant${info.daysLeft > 1 ? 's' : ''}`}`
  return ''
}

function resaCard(r, { showVisual = true } = {}) {
  const v = findVisual(r.visual_id)
  const f = ADM.formats.find((x) => x.id === r.format_id)
  const l = ADM.locations.find((x) => x.id === r.location_id)
  const info = resaInfo(r)
  const active = r.status === 'active'
  const purged = Boolean(r.purged_at)
  const sellable = active && info.state !== 'waiting'
  return html`<article class="resa ${active ? info.state : ''}" data-resa="${r.id}">
    ${showVisual ? html`<a href="${A(`/affiche/${r.visual_id}`)}" aria-label="Fiche de l’affiche">${posterHtml(v ? img.visual(v, 'thumb') : null, v?.film.title || '')}</a>` : html`<span class="resa-num">${icon('bookmark')}</span>`}
    <div style="min-width:0">
      <div class="row wrap" style="gap:6px;justify-content:space-between;align-items:flex-start">
        <h3>${showVisual ? html`<a href="${A(`/affiche/${r.visual_id}`)}">${v?.film.title || 'Affiche'}</a>` : `Réservation ${resaLabel(r)}`}</h3>
        <span class="badge ${RES_TONE[info.state]}">${RES_STATES[info.state]}</span></div>
      <p class="meta-line">${showVisual ? html`<span class="mono">${v?.reference_code || ''}</span> · Réservation ${resaLabel(r)} · ` : ''}${f?.label || ''} · ${l?.name || ''} · ${plural(r.quantity, 'exemplaire')}</p>
      <div class="who">${purged ? html`<span class="muted small">Données du client effacées</span>` : html`<span>${icon('users')} ${r.customer_name}</span>
        ${active ? html`<span class="phone" data-phone>${maskPhone(r.customer_phone)} <button class="btn btn-ghost sm" style="height:28px;padding:0 8px" data-act="reveal" aria-label="Afficher le numéro">${icon('eye')}</button></span>` : ''}`}</div>
      ${r.note && !purged ? html`<p class="small" style="margin-top:4px;color:var(--ink-2);font-style:italic">« ${r.note} »</p>` : ''}
      <p class="meta-line">${active ? resaStateText(r, info) : `${RES_STATES[r.status]} le ${fmtDate(r.closed_at)}${r.closed_by_name ? ` par ${r.closed_by_name}` : ''}`}</p>
      <p class="meta-line">Créée le ${fmtDate(r.created_at)}${r.created_by_name ? ` par ${r.created_by_name}` : ''}${r.notified_at ? ` · client prévenu le ${fmtDate(r.notified_at)}` : ''}${r.reminded_at ? ` · rappelé le ${fmtDate(r.reminded_at)}` : ''}</p>
    </div>
    ${active ? html`<div class="actions">
      ${info.state === 'to_notify' ? html`<button class="btn btn-accent sm" data-act="notified">${icon('check')} Client prévenu</button>` : ''}
      ${info.state === 'to_remind' ? html`<button class="btn btn-accent sm" data-act="reminded">${icon('check')} Rappel fait</button>` : ''}
      ${sellable ? html`<button class="btn btn-primary sm" data-act="sell">${icon('checkCircle')} Retirée · vendre</button>` : ''}
      ${sellable ? html`<button class="btn btn-secondary sm" data-act="extend">${icon('clock')} Prolonger</button>` : ''}
      <button class="btn btn-ghost sm" data-act="edit">${icon('pen')} Modifier</button>
      <button class="btn btn-danger-ghost sm" data-act="cancel">${icon('x')} ${info.state === 'overdue' ? 'Annuler et remettre en vente' : 'Annuler'}</button>
    </div>` : !purged ? html`<div class="actions"><button class="btn btn-ghost sm" data-act="purge">${icon('trash')} Effacer les données du client maintenant</button></div>` : ''}
  </article>`
}

/** Actions sur les cartes de réservation (délégation d'événements). */
function bindResaActions(root, after) {
  root.addEventListener('click', async (e) => {
    const b = e.target.closest('[data-resa] [data-act]')
    if (!b) return
    const r = ADM.reservations.find((x) => x.id === b.closest('[data-resa]').dataset.resa)
    if (!r) return
    const act = b.dataset.act
    const rpc = (name, args, msg) => busy(b, async () => {
      try { await api.rpc(name, args); toast(msg); await resaRefresh(after) } catch (err) { toast(errMsg(err), 'error') }
    })
    if (act === 'reveal') {
      const box = b.closest('[data-phone]')
      setHTML(box, html`<a href="tel:${r.customer_phone}" class="link">${icon('phone')} ${formatPhone(r.customer_phone)}</a>`)
      return
    }
    if (act === 'notified') return rpc('update_reservation', { p_id: r.id, p: { notified: true } }, 'Client prévenu : noté.')
    if (act === 'reminded') return rpc('update_reservation', { p_id: r.id, p: { reminded: true } }, 'Rappel noté.')
    if (act === 'sell') {
      const f = ADM.formats.find((x) => x.id === r.format_id), l = ADM.locations.find((x) => x.id === r.location_id)
      if (!(await confirmDialog({ title: 'Le client a retiré son affiche ?', confirmLabel: 'Enregistrer la vente',
        message: html`<p>Vente de <b>${plural(r.quantity, 'exemplaire')}</b> (${f?.label} · ${l?.name}) pour la réservation ${resaLabel(r)}. L’historique indiquera seulement le numéro de réservation.</p>` }))) return
      return rpc('complete_reservation', { p_id: r.id }, `Réservation ${resaLabel(r)} : vente enregistrée.`)
    }
    if (act === 'cancel') {
      if (!(await confirmDialog({ title: 'Annuler la réservation ?', danger: true, confirmLabel: 'Annuler la réservation',
        message: html`<p>${plural(r.quantity, 'exemplaire')} redevien${r.quantity > 1 ? 'nent' : 't'} disponible${r.quantity > 1 ? 's' : ''} à la vente. Le nom et le numéro du client seront effacés dans 30 jours.</p>` }))) return
      return rpc('cancel_reservation', { p_id: r.id }, 'Réservation annulée.')
    }
    if (act === 'purge') {
      if (!(await confirmDialog({ title: 'Effacer les données du client ?', danger: true, confirmLabel: 'Effacer',
        message: html`<p>Le nom, le téléphone et la note de cette réservation terminée seront définitivement effacés (par exemple à la demande du client).</p>` }))) return
      return rpc('purge_reservations', { p_id: r.id }, 'Données du client effacées.')
    }
    if (act === 'extend') {
      const info = resaInfo(r)
      const m = openModal({ title: 'Prolonger le délai de retrait', size: 'sm',
        body: html`<div class="stack"><p class="muted small">Réservation ${resaLabel(r)} · retrait prévu avant le ${formatDay(info.due)}</p>
          <div class="row between" style="padding:12px;border:1px solid var(--line);border-radius:16px;background:var(--surface)"><b>Jours supplémentaires</b>${stepperHtml('days', 7, { min: 1, max: 60, label: 'Jours supplémentaires' })}</div>
          <p class="hint">Le nouveau délai part de la date prévue (ou d’aujourd’hui si elle est dépassée).</p></div>`,
        footer: html`<button class="btn btn-primary lg block" data-ok>${icon('clock')} Prolonger</button>` })
      $('[data-ok]', m.el).onclick = (ev) => busy(ev.currentTarget, async () => {
        const base = info.due && info.due > todayParis() ? info.due : todayParis()
        try { await api.rpc('update_reservation', { p_id: r.id, p: { due_date: addDays(base, stepperValue(m.el, 'days')), reminded: false } }); m.close(); toast('Délai prolongé.'); await resaRefresh(after) } catch (err) { toast(errMsg(err), 'error') }
      })
      return
    }
    if (act === 'edit') {
      const stock = findVisual(r.visual_id)?.stocks.find((s) => s.id === r.stock_id)
      const maxQty = stock ? Math.max(r.quantity, stock.quantity - stockReserved(stock.id) + r.quantity) : r.quantity
      const cur = splitCivility(r.customer_name)
      const m = openModal({ title: `Modifier la réservation ${resaLabel(r)}`, size: 'sm',
        body: html`<form class="stack" data-edit novalidate>
          ${nameField('re-name', cur.civ, cur.name)}
          <div class="field"><label for="re-phone">Téléphone</label><input class="input" id="re-phone" name="phone" type="tel" inputmode="tel" autocomplete="off" value="${formatPhone(r.customer_phone)}"></div>
          <div class="field"><span class="label">Quantité</span>${stepperHtml('qty', r.quantity, { min: 1, max: maxQty, label: 'Quantité réservée' })}</div>
          <div class="field"><label for="re-note">Note (facultatif)</label><input class="input" id="re-note" name="note" maxlength="300" autocomplete="off" value="${r.note || ''}"></div></form>`,
        footer: html`<button class="btn btn-primary lg block" data-ok>Enregistrer</button>` })
      $('[data-ok]', m.el).onclick = (ev) => {
        const f = $('[data-edit]', m.el)
        const problem = resaFormProblem(f.name.value, f.phone.value)
        if (problem) return toast(problem, 'error')
        busy(ev.currentTarget, async () => {
          try {
            await api.rpc('update_reservation', { p_id: r.id, p: { customer_name: withCivility(f.civ.value, f.name.value), customer_phone: f.phone.value, note: f.note.value.trim(), quantity: stepperValue(m.el, 'qty') } })
            m.close(); toast('Réservation modifiée.'); await resaRefresh(after)
          } catch (err) { toast(errMsg(err), 'error') }
        })
      }
    }
  })
}

/** Civilité facultative (M. / Mme), enregistrée devant le nom : effacée avec lui après 30 jours. */
const CIVILITIES = [['M.', 'M.'], ['Mme', 'Mme'], ['', '—']]
/** Champ « Nom du client » précédé d'un petit menu déroulant M. / Mme / — (M. par défaut). */
const nameField = (id, civ, name) => html`<div class="field"><label for="${id}">Nom du client</label>
  <div class="row" style="gap:8px;flex-wrap:nowrap">
    <select class="select civ-select" name="civ" aria-label="Civilité (facultatif)">${CIVILITIES.map(([v, l]) => html`<option value="${v}" ${attr(v === civ, 'selected')}>${l}</option>`)}</select>
    <input class="input grow" id="${id}" name="name" maxlength="75" autocomplete="off" autocapitalize="words" placeholder="Prénom Nom" value="${name}" style="min-width:0"></div></div>`
function splitCivility(full) {
  const m = /^(M\.|Mme)\s+(.+)$/.exec(String(full || ''))
  return m ? { civ: m[1], name: m[2] } : { civ: '', name: String(full || '') }
}
const withCivility = (civ, name) => (civ ? `${civ} ${name.trim()}` : name.trim())

function resaFormProblem(name, phone) {
  if (!String(name || '').trim()) return 'Indiquez le nom du client.'
  const p = String(phone || '').replace(/[^0-9+]/g, '')
  if (!/^\+?[0-9]{6,15}$/.test(p)) return 'Numéro de téléphone invalide.'
  return null
}

      ${nameField('rs-name', 'M.', '')}
      <div class="field"><label for="rs-phone">Téléphone</label><input class="input" id="rs-phone" name="phone" type="tel" inputmode="tel" autocomplete="off" placeholder="06 12 34 56 78"></div>
      <div class="field"><label for="rs-note">Note (facultatif)</label><input class="input" id="rs-note" name="note" maxlength="300" autocomplete="off" placeholder="Ex. préfère être appelé après 18 h"></div>
      <p class="hint">${icon('lock')} Nom et numéro visibles uniquement par les administrateurs, effacés 30 jours après le retrait ou l’annulation.</p></form>`,
    footer: html`<button class="btn btn-primary lg block" data-ok>${icon('bookmark')} Enregistrer la réservation</button>` })
  const f = $('[data-reserve]', m.el)

    if (e.target.name !== 'row') return
    const r = rows.find((x) => x.stock.id === e.target.value)
    const st = $('[data-stepper="qty"]', m.el)
    st.dataset.max = String(r.free); st.querySelector('input').max = String(r.free)
    if (stepperValue(m.el, 'qty') > r.free) st.querySelector('input').value = String(r.free)
  })
  $('[data-ok]', m.el).onclick = (ev) => {
    const problem = resaFormProblem(f.name.value, f.phone.value)
    if (problem) return toast(problem, 'error')
    const row = rows.find((x) => x.stock.id === f.row.value)
    busy(ev.currentTarget, async () => {
      try {
        const out = await api.rpc('create_reservation', { p_visual_id: v.id, p_format_id: row.format.id, p_location_id: row.location.id, p_quantity: stepperValue(m.el, 'qty'),

        m.close()
        toast(`Réservation n° ${out.number} enregistrée.`)
        await resaRefresh(after)
      } catch (err) { toast(errMsg(err), 'error') }
    })
  }

/* ═══════════════════════════════════════════════════════════════════════
   O. PHOTO PERSONNELLE : prise de vue, recadrage, compression
   ═══════════════════════════════════════════════════════════════════════ */
const PHOTO = { maxBytes: 25 * 1024 * 1024, full: 1600, thumb: 480 }
function canvasToBlob(canvas, quality) {
  return new Promise((res, rej) => canvas.toBlob((b) => (b ? res(b) : rej(new AppError('Échec de la compression de l’image.'))), 'image/jpeg', quality))
}
function scaleCanvas(src, maxSide) {
  const k = Math.min(1, maxSide / Math.max(src.width, src.height))
  const c = document.createElement('canvas')
  c.width = Math.max(1, Math.round(src.width * k)); c.height = Math.max(1, Math.round(src.height * k))
  const ctx = c.getContext('2d')
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height)
  ctx.imageSmoothingQuality = 'high'
  ctx.drawImage(src, 0, 0, c.width, c.height)
  return c
}

/** Affiche le choix de photo puis le recadrage dans `box`. onDone({ full, thumb, previewUrl }) */
function photoCapture(box, onDone) {
  let cropper = null, url = null
  const pickView = () => {
    cropper?.destroy(); cropper = null
    if (url) { URL.revokeObjectURL(url); url = null }
    setHTML(box, html`<div class="stack">
      <input type="file" accept="image/*" capture="environment" class="hidden" data-cam>
      <input type="file" accept="image/jpeg,image/png,image/webp,image/heic,image/heif" class="hidden" data-file>
      <button type="button" class="photo-choice primary" data-open="cam">${icon('camera')}<span><b>Prendre une photo</b><span>Avec l’appareil photo du téléphone</span></span></button>
      <button type="button" class="photo-choice" data-open="file">${icon('imagePlus')}<span><b>Choisir une image</b><span>Galerie photo, ou fichier de l’ordinateur (JPEG, PNG, WebP)</span></span></button></div>`)
  }
  box.onclick = (e) => {
    const o = e.target.closest('[data-open]')
    if (o) $(o.dataset.open === 'cam' ? '[data-cam]' : '[data-file]', box).click()
    const r = e.target.closest('[data-rot]')
    if (r && cropper) cropper.rotate(Number(r.dataset.rot))
    if (e.target.closest('[data-again]')) pickView()
    const ok2 = e.target.closest('[data-crop-ok]')
    if (ok2) busy(ok2, async () => {
      try {
        const canvas = cropper.getCroppedCanvas({ maxWidth: 4000, maxHeight: 4000, fillColor: '#fff', imageSmoothingQuality: 'high' })
        if (!canvas) throw new AppError('Recadrage impossible.')
        const full = await canvasToBlob(scaleCanvas(canvas, PHOTO.full), 0.86)
        const thumb = await canvasToBlob(scaleCanvas(canvas, PHOTO.thumb), 0.8)
        await onDone({ full, thumb, previewUrl: URL.createObjectURL(full) })
      } catch (err) { toast(errMsg(err), 'error') }
    })
  }
  box.onchange = async (e) => {
    const input = e.target
    if (input.type !== 'file' || !input.files?.[0]) return
    const file = input.files[0]
    input.value = ''
    const typeOk = /^image\//.test(file.type) || /\.(jpe?g|png|webp|heic|heif)$/i.test(file.name)
    if (!typeOk) return toast('Format non pris en charge. Utilisez une photo JPEG, PNG ou WebP.', 'error')
    if (file.size > PHOTO.maxBytes) return toast('Image trop lourde (25 Mo maximum).', 'error')
    let Cropper
    try { Cropper = await loadCropper() } catch (err) { return toast(errMsg(err), 'error') }
    url = URL.createObjectURL(file)
    setHTML(box, html`<div class="stack">
      <div class="crop-stage"><img src="${url}" alt="Photo à recadrer" data-crop></div>
      <div class="row wrap between">${segHtml('ratio', '2:3', [['2:3', 'Affiche 2:3'], ['3:4', '3:4'], ['free', 'Libre']])}
        <div class="row" style="gap:4px"><button type="button" class="icon-btn" data-rot="-90" aria-label="Pivoter à gauche">${icon('rotL')}</button><button type="button" class="icon-btn" data-rot="90" aria-label="Pivoter à droite">${icon('rotR')}</button></div></div>
      <p class="hint">Faites glisser et pincez pour cadrer l’affiche. L’image est compressée avant l’envoi.</p>
      <div class="row"><button type="button" class="btn btn-secondary" data-again>${icon('rotL')} Autre photo</button><button type="button" class="btn btn-primary block" data-crop-ok>${icon('check')} Valider le cadrage</button></div></div>`)
    const imgEl = $('[data-crop]', box)
    imgEl.onerror = () => { toast('Impossible de lire cette image sur cet appareil (format HEIC ?). Essayez une photo JPEG.', 'error'); pickView() }
    imgEl.onload = () => {
      cropper = new Cropper(imgEl, { viewMode: 1, aspectRatio: 2 / 3, autoCropArea: 0.92, dragMode: 'move', background: false, checkOrientation: true, responsive: true })
    }
    $('[data-seg="ratio"]', box).addEventListener('change', (ev) => cropper?.setAspectRatio({ '2:3': 2 / 3, '3:4': 3 / 4, free: NaN }[ev.detail]))
  }
  pickView()
  return { destroy: () => { cropper?.destroy(); if (url) URL.revokeObjectURL(url) } }
}

function photoSheet(onSave) {
  const m = openModal({ title: 'Photo personnelle', size: 'lg', body: html`<div data-photo></div>` })

ADMIN_PAGES.add = async (page) => {
  const S = { step: 'search', film: null, image: null, createdId: null, q: '' }
  // film = { local?: Film, tmdb?: Details, manual?: {...} } ; image = { kind:'tmdb', poster } | { kind:'photo', photo }

  const localFilm = () => S.film?.local || (S.film?.tmdb && ADM.visuals.find((v) => v.film.tmdb_id === S.film.tmdb.id)?.film) || null
  const filmVisuals = () => { const lf = localFilm(); return lf ? ADM.visuals.filter((v) => v.film_id === lf.id) : [] }
  const filmTitle = () => S.film?.tmdb?.title || S.film?.local?.title || S.film?.manual?.title || ''
  const filmYear = () => S.film?.tmdb ? yearOf(S.film.tmdb) : S.film?.local ? yearOf(S.film.local) : Number(S.film?.manual?.release_year) || null

  const STEP_LABEL = { search: '1 · Rechercher le film', gallery: '2 · Choisir le visuel exact', manual: '1 · Créer la fiche du film', photo: '2 · Photographier l’affiche', form: '3 · Quantités, emplacements et prix', done: 'Terminé' }
  function frame(content) {
    page.onclick = null
    const back = ['gallery', 'manual', 'photo', 'form'].includes(S.step)
    setHTML(page, html`${pageHead(S.step === 'done' ? 'Affiche enregistrée' : 'Ajouter une affiche', STEP_LABEL[S.step], back ? { back: ['#', 'Retour'] } : {})}
      ${S.film && ['gallery', 'photo', 'form'].includes(S.step) ? filmBanner() : ''}${content}`)
    const b = $('.back', page)
    if (b) b.onclick = (e) => {
      e.preventDefault(); e.stopPropagation()
      if (S.step === 'gallery' || S.step === 'manual') go('search')
      else if (S.step === 'photo') go(S.film?.tmdb ? 'gallery' : S.film?.manual ? 'manual' : 'search')
      else if (S.step === 'form') go(S.image?.kind === 'photo' ? 'photo' : 'gallery')
    }
    window.scrollTo({ top: 0 })
  }
  function filmBanner() {
    const poster = S.film.tmdb?.poster_path || S.film.local?.tmdb_poster_path
    const orig = S.film.tmdb?.original_title || S.film.local?.original_title || S.film.manual?.original_title
    return html`<div class="card film-banner">${posterHtml(img.tmdb(poster, 'w92'), '')}
      <div class="grow"><b class="display truncate" style="display:block;font-size:18px;font-weight:600">${filmTitle()}</b>
      <span class="muted small">${[filmYear(), orig && orig !== filmTitle() ? orig : null].filter(Boolean).join(' · ') || 'Année inconnue'}</span></div>
      <button class="btn btn-ghost sm" data-change-film>Changer</button></div>`
  }
  page.addEventListener('click', (e) => { if (e.target.closest('[data-change-film]')) { S.film = null; go('search') } })

  function go(step) {
    S.step = step
    ;({ search: stepSearch, gallery: stepGallery, manual: stepManual, photo: stepPhoto, form: stepForm, done: stepDone })[step]()
  }

  async function openTmdbFilm(id, local) {
    try {
      const details = await api.server(`/api/tmdb?action=movie&id=${id}`)
      S.film = { tmdb: details, local: local || ADM.visuals.find((v) => v.film.tmdb_id === id)?.film }
      S.image = null
      go('gallery')
    } catch (err) {
      toast(errMsg(err), 'error')
      if (local) { S.film = { local }; go('photo') }
    }
  }

  // ── A. Recherche ────────────────────────────────────────────────────
  function stepSearch() {
    frame(html`<div class="stack" style="gap:20px">
      <div class="search">${icon('search')}<input class="input" style="height:62px;font-size:18px" type="search" data-q value="${S.q}" placeholder="Nom du film (ex. Mario, Interstellar…)" aria-label="Rechercher un film sur TMDB" autocomplete="off" enterkeyhint="search" autofocus><span class="clear hidden" data-spin style="right:16px"><span class="spinner"></span></span></div>
      <div data-out></div>
      <div class="card pad row wrap between"><div><b>Film introuvable sur TMDB ?</b><p class="muted small">Créez la fiche à la main, puis photographiez l’affiche.</p></div>
        <button class="btn btn-outline" data-manual>${icon('pen')} Créer manuellement</button></div></div>`)
    const input = $('[data-q]', page)
    const out = $('[data-out]', page)
    let seq = 0, t, page1 = 1, total = 0, results = []
    const draw = (locals, error) => {
      setHTML(out, html`${error ? html`<div class="alert error" style="margin-bottom:16px">${error}</div>` : ''}
        ${locals.length ? html`<section style="margin-bottom:22px"><p class="eyebrow" style="margin-bottom:8px">Déjà au catalogue</p><div class="stack tight">${locals.map((f) => html`
          <button class="card row" style="padding:10px;text-align:left;border-color:var(--brand-200);background:var(--brand-50)" data-local="${f.id}">
            <div style="width:42px;flex-shrink:0">${posterHtml(img.tmdb(f.tmdb_poster_path, 'w92'), '')}</div>
            <span class="grow"><b>${f.title}</b><br><span class="muted small">${yearOf(f) || 'Année inconnue'} · ${plural(ADM.visuals.filter((v) => v.film_id === f.id).length, 'visuel')}</span></span><span class="badge brand">Au catalogue</span></button>`)}</div></section>` : ''}
        ${results.length ? html`<section><p class="eyebrow" style="margin-bottom:8px">Résultats TMDB</p>
          <div class="gal">${results.map((r) => html`<button class="result-tile" data-tmdb="${r.id}">${posterHtml(img.tmdb(r.poster_path, 'w185'), '')}
            <span><b class="clamp2">${r.title}</b>${r.original_title !== r.title ? html`<span class="xs muted clamp2" style="font-style:italic">${r.original_title}</span>` : ''}<span class="small muted">${r.release_date?.slice(0, 4) || 'Date inconnue'}</span></span></button>`)}</div>
          ${page1 < total ? html`<div class="row" style="justify-content:center;margin-top:16px"><button class="btn btn-secondary" data-more>Plus de résultats</button></div>` : ''}</section>`
          : input.value.trim().length >= 2 && !error && seq ? html`<p class="muted">Aucun film trouvé sur TMDB pour « ${input.value.trim()} ».</p>` : ''}`)
    }
    const localMatches = (q) => {
      const seen = new Map()
      for (const v of ADM.visuals) if (!seen.has(v.film_id) && matchesQuery(`${v.film.title} ${v.film.original_title || ''} ${yearOf(v.film) || ''}`, q)) seen.set(v.film_id, v.film)
      return [...seen.values()].slice(0, 8)
    }
    const search = async () => {
      const q = input.value.trim()
      S.q = input.value
      if (q.length < 2) { results = []; seq = 0; setHTML(out, ''); return }
      const id = ++seq
      $('[data-spin]', page).classList.remove('hidden')
      let error = null
      try { const r = await api.server(`/api/tmdb?action=search&q=${encodeURIComponent(q)}`); if (id !== seq) return; results = r.results; page1 = r.page; total = r.total_pages } catch (err) { if (id !== seq) return; results = []; error = errMsg(err) }
      $('[data-spin]', page)?.classList.add('hidden')
      draw(localMatches(q), error)
    }
    input.oninput = () => { clearTimeout(t); t = setTimeout(search, 350) }
    out.onclick = async (e) => {
      const tm = e.target.closest('[data-tmdb]')
      if (tm) return busy(tm, () => openTmdbFilm(Number(tm.dataset.tmdb)))
      const lo = e.target.closest('[data-local]')
      if (lo) {
        const f = ADM.visuals.find((v) => v.film_id === lo.dataset.local)?.film
        if (f?.tmdb_id) return busy(lo, () => openTmdbFilm(f.tmdb_id, f))
        S.film = { local: f }; return go('photo')
      }
      const more = e.target.closest('[data-more]')
      if (more) busy(more, async () => { try { const r = await api.server(`/api/tmdb?action=search&q=${encodeURIComponent(input.value.trim())}&page=${page1 + 1}`); results = results.concat(r.results); page1 = r.page; draw(localMatches(input.value), null) } catch (err) { toast(errMsg(err), 'error') } })
    }
    $('[data-manual]', page).onclick = () => { S.film = { manual: { title: input.value.trim(), original_title: '', release_year: '', director: '', overview: '' } }; go('manual') }
    if (input.value.trim().length >= 2) search()
  }

  // ── B. Galerie de TOUS les visuels du film ──────────────────────────
  function stepGallery() {
    const movie = S.film.tmdb
    const owned = new Map(filmVisuals().filter((v) => v.tmdb_file_path).map((v) => [v.tmdb_file_path, v]))
    const g = groupPosters(movie.posters)
    const tile = (p) => { const dup = owned.get(p.file_path); return html`<div class="gtile">
      <button class="pick" data-pick="${p.file_path}" aria-label="Choisir ce visuel (${languageName(p.iso_639_1)})${dup ? ', déjà en stock' : ''}">${posterHtml(img.tmdb(p.file_path, 'w342'), '')}</button>
      <span class="lang">${p.iso_639_1 && p.iso_639_1 !== 'xx' ? p.iso_639_1 : 'sans texte'}</span>
      <button class="zoom" data-zoom="${p.file_path}" aria-label="Agrandir">${icon('maximize')}</button>
      ${dup ? html`<span class="owned">${icon('check')} Déjà en stock</span>` : ''}</div>` }
    const section = (title, list, extra = '') => (list.length ? html`<section ${raw(extra)}><p class="eyebrow" style="margin-bottom:10px">${title} <span style="color:var(--ink-4)">(${list.length})</span></p><div class="gal">${list.map(tile)}</div></section>` : '')
    frame(html`<div class="stack" style="gap:24px">
      <p class="muted" style="margin-top:-8px">Touchez le visuel qui correspond exactement à votre affiche physique. ${plural(movie.posters.length, 'visuel')} sur TMDB.</p>
      <button class="dashed-btn" style="height:54px;margin:0" data-photo>${icon('camera')} Visuel introuvable ? Ajouter ma propre affiche</button>
      ${movie.posters.length ? '' : html`<div class="empty"><div class="ico">${icon('camera')}</div><h3>Aucun visuel sur TMDB</h3><p>Photographiez votre affiche.</p></div>`}
      ${section('Affiches françaises', g.fr)}${section('Affiches sans texte', g.none)}${section('Affiches anglaises', g.en)}
      ${g.others.length ? html`<button class="btn btn-secondary" style="align-self:center" data-others>${icon('chevD')} Voir les autres langues (${plural(g.others.reduce((s, [, l]) => s + l.length, 0), 'visuel')}, ${plural(g.others.length, 'langue')})</button>
        <div class="stack hidden" style="gap:24px" data-others-box>${g.others.map(([lang, list]) => section(`Langue : ${languageName(lang)}`, list))}</div>` : ''}</div>`)
    const pick = async (path) => {
      const dup = owned.get(path)
      if (dup) {
        const r = await confirmDialog({ title: 'Visuel déjà enregistré', confirmLabel: 'Ajouter du stock',
          message: html`<p>Ce visuel existe déjà (<b class="mono">${dup.reference_code}</b>, ${plural(totalQuantity(dup), 'exemplaire')}). Pour éviter un doublon, ajoutez plutôt des exemplaires à cette référence.</p>` })
        if (r) { navigate(A(`/affiche/${dup.id}`)); setTimeout(() => addStockSheet(findVisual(dup.id), {}, ADM.refreshView), 120) }
        return
      }
      S.image = { kind: 'tmdb', poster: movie.posters.find((p) => p.file_path === path) }
      go('form')
    }
    page.onclick = (e) => {
      const z = e.target.closest('[data-zoom]')
      if (z) {
        const lb = lightbox(img.tmdb(z.dataset.zoom, 'original'), 'Visuel TMDB', html`<button class="btn btn-gold lg" data-choose>${icon('check')} Choisir ce visuel</button>`)
        $('[data-choose]', lb.el).onclick = () => { lb.close(); pick(z.dataset.zoom) }
        return
      }
      const p = e.target.closest('[data-pick]')
      if (p) return pick(p.dataset.pick)
      if (e.target.closest('[data-photo]')) return go('photo')
      const o = e.target.closest('[data-others]')
      if (o) { o.remove(); $('[data-others-box]', page).classList.remove('hidden') }
    }
  }

  // ── Fiche film manuelle ─────────────────────────────────────────────
  function stepManual() {
    const m = S.film.manual
    frame(html`<form class="card pad stack" novalidate data-form>
      <h2 class="display" style="font-size:20px;font-weight:600">Nouveau film (hors TMDB)</h2><div data-err></div>
      <div class="field"><label for="m-title">Titre français *</label><input class="input" id="m-title" name="title" value="${m.title}" autofocus></div>
      <div class="grid2"><div class="field"><label for="m-orig">Titre original</label><input class="input" id="m-orig" name="original_title" value="${m.original_title}"></div>
        <div class="field"><label for="m-year">Année de sortie</label><input class="input" id="m-year" name="release_year" inputmode="numeric" maxlength="4" value="${m.release_year}"></div></div>
      <div class="field"><label for="m-dir">Réalisation</label><input class="input" id="m-dir" name="director" value="${m.director}"></div>
      <div class="field"><label for="m-ov">Synopsis (facultatif)</label><textarea class="textarea" id="m-ov" name="overview">${m.overview}</textarea></div>
      <button class="btn btn-primary lg" type="submit">${icon('camera')} Continuer : photographier l’affiche</button></form>`)
    $('[data-form]', page).onsubmit = (e) => {
      e.preventDefault()
      const f = e.target
      const year = f.release_year.value.trim()
      const err = !f.title.value.trim() ? 'Le titre est obligatoire.' : year && !/^(18[89]\d|19\d\d|20\d\d|21\d\d)$/.test(year) ? 'Année invalide (ex. 1987).' : null
      if (err) return setHTML($('[data-err]', page), html`<div class="alert error">${err}</div>`)
      S.film = { manual: { title: f.title.value.trim(), original_title: f.original_title.value.trim(), release_year: year, director: f.director.value.trim(), overview: f.overview.value.trim() } }
      go('photo')
    }
  }

  // ── Photo personnelle ───────────────────────────────────────────────
  function stepPhoto() {
    frame(html`<div class="card pad"><h2 class="display" style="font-size:20px;font-weight:600">Ajouter ma propre affiche</h2>
      <p class="muted small" style="margin:4px 0 16px">Photographiez l’affiche physique ou importez une image. ${S.film?.tmdb || S.film?.local ? 'Les informations du film sont conservées : seul le visuel est personnalisé.' : ''}</p><div data-photo></div></div>`)
    photoCapture($('[data-photo]', page), (photo) => { S.image = { kind: 'photo', photo }; go('form') })
  }

  // ── C. Quantités, emplacements, prix, visibilité ────────────────────
  function stepForm() {
    const fmts = activeFormats()
    const defLoc = lastLocation() || ADM.locations.find((l) => l.is_active)?.id || ''
    let lines = fmts.map((f, i) => ({ formatId: f.id, locationId: defLoc, qty: i === 0 ? 1 : 0 }))
    const preview = S.image.kind === 'photo' ? S.image.photo.previewUrl : img.tmdb(S.image.poster.file_path, 'w500')
    const big = S.image.kind === 'photo' ? S.image.photo.previewUrl : img.tmdb(S.image.poster.file_path, 'original')
    const label = S.image.kind === 'photo' ? defaultVisualLabel('photo') : defaultVisualLabel('tmdb', S.image.poster.iso_639_1)
    const locOptions = (sel) => html`${ADM.locations.filter((l) => l.is_active || l.id === sel).map((l) => html`<option value="${l.id}" ${attr(l.id === sel, 'selected')}>${l.name}</option>`)}<option value="__new">+ Nouvel emplacement…</option>`
    frame(html`<div class="split side-l has-sticky">
      <div class="stack" style="align-items:center">
        <button style="all:unset;cursor:zoom-in;width:100%;max-width:220px" data-zoom-sel aria-label="Agrandir le visuel choisi">${posterHtml(preview, 'Visuel choisi', { eager: true, cls: 'shadow' })}</button>
        <span class="badge brand">${S.image.kind === 'photo' ? 'Photo personnelle' : `TMDB · ${languageName(S.image.poster.iso_639_1)}`}</span>
        <button class="btn btn-ghost sm" data-change-img>Changer de visuel</button></div>
      <form class="stack" style="gap:18px" data-form novalidate>
        <div data-err></div>
        <div class="card pad stack">
          <div><h2 class="display" style="font-size:19px;font-weight:600">Quantités et emplacements</h2>
            <p class="muted small" style="margin-top:2px">Une ligne par format et par emplacement. Ajoutez une ligne si les exemplaires sont rangés à plusieurs endroits.</p></div>
          <div class="qtable" data-lines></div>
          <button type="button" class="btn btn-ghost sm" style="align-self:flex-start;color:var(--brand-700)" data-add-line>${icon('plus')} Ajouter une ligne (autre emplacement)</button>
          ${ADM.locations.length ? '' : html`<div class="alert info">Aucun emplacement n’existe encore : choisissez « + Nouvel emplacement… » dans la liste.</div>`}
        </div>
        <div class="card pad stack">
          <div class="field"><label for="f-label">Nom du visuel</label><input class="input" id="f-label" name="label" value="${label}"><span class="hint">Pour distinguer les affiches d’un même film (ex. « Affiche teaser », « Affiche personnage »).</span></div>
          ${switchHtml('published', true, 'Publiée dans la vitrine', 'Visible par les clients tant qu’il reste des exemplaires. Décochez pour l’enregistrer en « Masquée ».')}
          <div class="field"><label for="f-from">En vente à partir du (facultatif)</label><input class="input" id="f-from" name="available_from" type="date" min="${todayParis()}">
            <span class="hint">Pour une affiche reçue mais pas encore vendable (film encore à l’affiche). La vitrine indique « Bientôt » et elle peut déjà être réservée pour des clients.</span></div>
          <details><summary class="link" style="cursor:pointer;text-decoration:none">${icon('chevD')} Prix personnalisé (facultatif)</summary>
            <div class="grid2" style="margin-top:12px">${fmts.map((f) => html`<div class="field"><label for="pr-${f.id}">${f.label}</label>
              <div class="input-wrap"><input class="input" id="pr-${f.id}" data-price="${f.id}" inputmode="decimal" placeholder="${centsToInput(f.default_price_cents) || '0,00'}"><span style="position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--ink-3)">€</span></div>
              <span class="hint">${f.default_price_cents !== null ? `Par défaut : ${formatPrice(f.default_price_cents)}` : 'Aucun prix par défaut (voir Réglages)'}</span></div>`)}</div></details>
        </div>
        <div class="sticky-save"><button class="btn btn-primary lg block" type="submit" data-save>${icon('checkCircle')} <span data-save-label>Enregistrer l’affiche</span></button></div>
      </form></div>`)
    const drawLines = () => {
      setHTML($('[data-lines]', page), lines.map((ln, i) => html`<div class="qrow" data-line="${i}">
        <div class="stack tight"><div class="row wrap" style="gap:8px">
          <select class="select" style="width:auto;min-width:150px;height:44px" data-l-format aria-label="Format">${fmts.map((f) => html`<option value="${f.id}" ${attr(f.id === ln.formatId, 'selected')}>${f.label}</option>`)}</select>
          <select class="select" style="width:auto;min-width:170px;height:44px" data-l-loc aria-label="Emplacement"><option value="" ${attr(!ln.locationId, 'selected')} disabled>Emplacement…</option>${locOptions(ln.locationId)}</select>
          ${lines.length > 1 ? html`<button type="button" class="icon-btn" data-l-del aria-label="Supprimer la ligne">${icon('trash')}</button>` : ''}</div></div>
        ${stepperHtml(`q${i}`, ln.qty, { label: `Quantité ligne ${i + 1}` })}</div>`))
      const total = lines.reduce((s, l) => s + l.qty, 0)
      $('[data-save-label]', page).textContent = `Enregistrer l’affiche${total ? ` · ${total} ex.` : ''}`
    }
    drawLines()
    const lineIndex = (el) => Number(el.closest('[data-line]').dataset.line)
    const linesBox = $('[data-lines]', page)
    linesBox.addEventListener('input', (e) => { if (e.target.closest('[data-stepper]')) { lines[lineIndex(e.target)].qty = Math.max(0, Math.floor(Number(e.target.value)) || 0); const total = lines.reduce((s, l) => s + l.qty, 0); $('[data-save-label]', page).textContent = `Enregistrer l’affiche${total ? ` · ${total} ex.` : ''}` } })
    linesBox.addEventListener('change', async (e) => {
      const i = lineIndex(e.target)
      if (e.target.matches('[data-l-format]')) lines[i].formatId = Number(e.target.value)
      if (e.target.matches('[data-l-loc]')) {
        if (e.target.value === '__new') {
          const name = await promptDialog('Nouvel emplacement', 'Nom de l’emplacement', 'Ex. Réserve B, Carton 3')
          if (name) { try { const l = await api.insert('locations', { name }); ADM.locations = await api.locations(); lines[i].locationId = l.id; toast(`Emplacement « ${l.name} » créé`) } catch (err) { toast(errMsg(err), 'error') } }
          drawLines()
        } else lines[i].locationId = e.target.value
      }
    })
    linesBox.addEventListener('click', (e) => { if (e.target.closest('[data-l-del]')) { lines.splice(lineIndex(e.target), 1); drawLines() } })
    $('[data-add-line]', page).onclick = () => { lines.push({ formatId: fmts[0]?.id, locationId: '', qty: 1 }); drawLines() }
    $('[data-zoom-sel]', page).onclick = () => lightbox(big, 'Visuel choisi')
    $('[data-change-img]', page).onclick = () => go(S.image.kind === 'photo' ? 'photo' : 'gallery')

    $('[data-form]', page).onsubmit = (e) => {
      e.preventDefault()
      const f = e.target
      const err = (m) => { setHTML($('[data-err]', page), html`<div class="alert error" role="alert">${m}</div>`); window.scrollTo({ top: 0, behavior: 'smooth' }) }
      const stock = lines.filter((l) => l.qty > 0)
      if (stock.some((l) => !l.locationId)) return err('Choisissez l’emplacement de chaque ligne de stock.')
      const keys = stock.map((l) => `${l.formatId}:${l.locationId}`)
      if (new Set(keys).size !== keys.length) return err('Deux lignes ont le même format et le même emplacement : regroupez-les.')
      const prices = []
      for (const fm of fmts) {
        const v = $(`[data-price="${fm.id}"]`, page).value
        const c = parsePriceToCents(v)
        if (Number.isNaN(c)) return err(`Prix invalide pour « ${fm.label} » (ex. 12,50).`)
        if (c !== null) prices.push({ format_id: fm.id, price_cents: c })
      }
      busy($('[data-save]', page), async () => {
        let uploaded = []
        try {
          let visual
          if (S.image.kind === 'photo') {
            const folder = `visuals/${crypto.randomUUID()}`
            const full = `${folder}/full.jpg`, thumb = `${folder}/thumb.jpg`
            await api.upload(full, S.image.photo.full); uploaded.push(full)
            await api.upload(thumb, S.image.photo.thumb); uploaded.push(thumb)
            visual = { source: 'photo', image_path: full, thumb_path: thumb }
          } else visual = { source: 'tmdb', tmdb_file_path: S.image.poster.file_path, tmdb_language: S.image.poster.iso_639_1 }
          visual.label = f.label.value.trim()
          visual.status = f.published.checked ? 'published' : 'hidden'
          if (f.available_from.value) visual.available_from = f.available_from.value
          const lf = localFilm()
          const t = S.film.tmdb
          const film = lf ? { id: lf.id, title: lf.title }
            : t ? { tmdb_id: t.id, title: t.title, original_title: t.original_title, release_date: t.release_date, release_year: yearOf(t), overview: t.overview || null, genres: t.genres, runtime: t.runtime, director: t.director, tmdb_poster_path: t.poster_path }
              : { title: S.film.manual.title, original_title: S.film.manual.original_title || null, release_year: S.film.manual.release_year ? Number(S.film.manual.release_year) : null, director: S.film.manual.director || null, overview: S.film.manual.overview || null }
          const r = await api.rpc('create_poster', { p: { film, visual, stock: stock.map((l) => ({ format_id: l.formatId, location_id: l.locationId, quantity: l.qty })), prices } })
          if (r.status === 'duplicate') {
            await api.removeFiles(uploaded).catch(() => {})
            toast('Ce visuel existait déjà : ouverture de sa fiche.', 'info')
            await loadAdminData()
            return navigate(A(`/affiche/${r.visual_id}`))
          }
          const firstLoc = stock[0]?.locationId
          if (firstLoc) rememberLocation(firstLoc)
          await loadAdminData()
          ADM.movementVersion++
          S.createdId = r.visual_id
          S.film = { ...S.film, local: findVisual(r.visual_id)?.film, manual: undefined }
          toast('Affiche enregistrée')
          go('done')
        } catch (ex) {
          await api.removeFiles(uploaded).catch(() => {})
          err(errMsg(ex))
        }
      })
    }
  }

  // ── Terminé ─────────────────────────────────────────────────────────
  function stepDone() {
    const v = findVisual(S.createdId)
    const visible = v && isPubliclyVisible(v, activeFormatIds(), ADM.reservations)
    frame(html`<div class="card pad stack" style="max-width:560px;margin:0 auto;align-items:center;text-align:center">
      <div style="width:140px;position:relative">${posterHtml(v ? img.visual(v, 'card') : null, '', { cls: 'shadow' })}
        <span style="position:absolute;right:-10px;bottom:-10px;width:44px;height:44px;border-radius:50%;background:var(--ok);color:#fff;display:flex;align-items:center;justify-content:center;border:4px solid #fff">${icon('check')}</span></div>
      <div><p class="display" style="font-size:24px;font-weight:600">${v?.film.title}</p>
        <p class="muted"><span class="mono" style="color:var(--ink)">${v?.reference_code}</span>${v?.label ? ` · ${v.label}` : ''}</p>
        <p class="small" style="margin-top:8px;font-weight:700;color:${visible ? 'var(--ok)' : 'var(--ink-3)'}">${visible ? 'Visible dès maintenant dans la vitrine.' : v?.status === 'hidden' ? 'Masquée : invisible dans la vitrine.' : 'Invisible tant qu’aucun exemplaire n’est en stock.'}</p></div>
      <div class="stack tight" style="width:100%">
        <button class="btn btn-primary lg block" data-another>${icon('plus')} Ajouter un autre visuel de ce film</button>
        <button class="btn btn-secondary lg block" data-new>Nouvelle affiche (autre film)</button>
        <div class="row" style="justify-content:center;gap:18px;margin-top:6px"><a class="link small" href="${A(`/affiche/${S.createdId}`)}">Voir la fiche</a>${visible ? html`<a class="link small" href="/affiche/${S.createdId}" target="_blank" rel="noopener">Voir dans la vitrine</a>` : ''}</div></div></div>`)
    $('[data-another]', page).onclick = () => { S.image = null; go(S.film?.tmdb ? 'gallery' : 'photo') }
    $('[data-new]', page).onclick = () => { S.film = null; S.image = null; S.q = ''; setQuery(new URLSearchParams()); go('search') }
  }

  // « Ajouter un autre visuel de ce film » depuis une fiche : ?film=<id>
  const filmParam = qs().get('film')
  const f = filmParam && ADM.visuals.find((v) => v.film_id === filmParam)?.film
  if (f) {
    setHTML(page, html`<div class="boot" style="min-height:200px"><span class="spinner"></span> Chargement des affiches du film…</div>`)
    if (f.tmdb_id) await openTmdbFilm(f.tmdb_id, f)
    else { S.film = { local: f }; go('photo') }
  } else go('search')
}

/* ═══════════════════════════════════════════════════════════════════════
   Q. IMPRESSIONS : liste de stock (A4) et catalogue papier (une page par affiche)
   ═══════════════════════════════════════════════════════════════════════ */
const THUMB_PX = { w: 120, h: 180 }
async function fetchImageBlob(url, init = {}) {
  const ctrl = new AbortController()
  const timer = setTimeout(() => ctrl.abort(), 15000)
  try {
    const res = await fetch(url, { ...init, signal: ctrl.signal })
    if (!res.ok) throw new Error(String(res.status))
    const blob = await res.blob()
    if (!blob.size || (blob.type && !blob.type.startsWith('image/'))) throw new Error('not an image')
    return blob
  } finally { clearTimeout(timer) }
}
/** Décode une image (createImageBitmap, ou <img> en secours pour les anciens navigateurs). */
async function decodeImage(blob) {
  try { return await createImageBitmap(blob) } catch {}
  const u = URL.createObjectURL(blob)
  try {
    const im = new Image()
    im.src = u
    await im.decode()
    return im
  } finally { setTimeout(() => URL.revokeObjectURL(u), 1000) }
}
/**
 * Miniature JPEG (data URL) pour le PDF.
 * 1) Lecture directe SANS le cache du navigateur : une affiche déjà affichée à l'écran est en cache
 *    sans autorisation « CORS », ce qui ferait échouer la lecture.
 * 2) En secours : relais du site (/api/image), réservé aux administrateurs.
 */
async function imageDataUrl(url, token, { w: boxW, h: boxH, fit = 'cover', quality = 0.82 }) {
  let blob
  try { blob = await fetchImageBlob(url, { mode: 'cors', cache: 'no-store', credentials: 'omit' }) } catch {
    blob = await fetchImageBlob(`/api/image?src=${encodeURIComponent(url)}`, { headers: token ? { authorization: `Bearer ${token}` } : {} })
  }
  const bmp = await decodeImage(blob)
  const w = bmp.width || bmp.naturalWidth, h = bmp.height || bmp.naturalHeight
  if (!w || !h) throw new Error('image vide')
  const c = document.createElement('canvas')
  if (fit === 'cover') { c.width = boxW; c.height = boxH } else {
    // « contain » : proportions d'origine, sans dépasser la boîte (et sans agrandir)
    const k = Math.min(boxW / w, boxH / h, 1)
    c.width = Math.round(w * k); c.height = Math.round(h * k)
  }
  const ctx = c.getContext('2d')
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height)
  const k = fit === 'cover' ? Math.max(c.width / w, c.height / h) : c.width / w
  ctx.drawImage(bmp, (c.width - w * k) / 2, (c.height - h * k) / 2, w * k, h * k)
  bmp.close?.()
  return { data: c.toDataURL('image/jpeg', quality), w: c.width, h: c.height }
}
const thumbDataUrl = async (url, token) => (await imageDataUrl(url, token, { w: THUMB_PX.w, h: THUMB_PX.h })).data
async function prepareThumbs(rows, onProgress) {
  const ids = [...new Set(rows.map((r) => r.visualId))]
  const out = {}
  const token = (await sb.auth.getSession()).data.session?.access_token
  let i = 0, done = 0
  const worker = async () => {
    while (i < ids.length) {
      const id = ids[i++]
      const v = findVisual(id)
      const url = v ? img.visual(v, 'thumb') : null
      out[id] = url ? await thumbDataUrl(url, token).catch((err) => { console.warn('[pdf] miniature indisponible', url, err?.message); return null }) : null
      onProgress(++done, ids.length)
    }
  }
  await Promise.all(Array.from({ length: Math.min(6, ids.length) }, worker))
  return out
}

/**
 * Liste de stock : miniature (≈ 2 cm), film, format, emplacement, stock (dont réservés), case « Vu ».
 * Tri alphabétique ou par emplacement (regroupé). Aucun prix (ils ne figurent que sur le catalogue papier).
 */
function inventoryDoc({ rows, opts, thumbs, scopeLabel }) {
  const s = ADM.settings
  const date = fmtDateTime(new Date())
  const copies = rows.reduce((a, r) => a + r.quantity, 0)
  const INK = '#211d18', MUTED = '#6b6458', LINE = '#d8cfbf', DARK = '#17120c', GOLD = '#a5823f', ORANGE = '#b9561a'
  const byLocation = opts.sort === 'location'
  const TW = 38, TH = 57  // miniature ≈ 1,3 × 2 cm
  // pdfmake modifie les objets qu'il met en page : chaque case doit être un objet neuf.
  const box = () => ({ canvas: [{ type: 'rect', x: 0, y: 0, w: 11, h: 11, r: 1.5, lineWidth: 1, lineColor: INK }], width: 11, alignment: 'center', margin: [6, 0, 0, 0] })
  const widths = [...(opts.thumbnails ? [TW + 2] : []), '*', 70, ...(byLocation ? [] : [86]), 58, 26]
  const head = [...(opts.thumbnails ? [''] : []), 'Film · référence', 'Format', ...(byLocation ? [] : ['Emplacement']), 'Stock', 'Vu']
    .map((t) => ({ text: t.toUpperCase(), style: 'th', alignment: t === 'Stock' || t === 'Vu' ? 'center' : 'left' }))
  const ncol = head.length
  const body = [head]
  let group = null
  for (const r of rows) {
    if (byLocation && r.location !== group) {
      group = r.location
      const g = rows.filter((x) => x.location === group)
      body.push([{ text: group === '—' ? 'Références épuisées' : `${group}   ·   ${plural(g.length, 'ligne')} · ${plural(g.reduce((a, x) => a + x.quantity, 0), 'exemplaire')}`, colSpan: ncol, style: 'group' }, ...Array(ncol - 1).fill({})])
    }
    const thumb = thumbs[r.visualId]
    const cells = []
    if (opts.thumbnails) cells.push(thumb ? { image: thumb, width: TW, height: TH } : { canvas: [{ type: 'rect', x: 0, y: 0, w: TW, h: TH, lineWidth: 0.6, lineColor: LINE, dash: { length: 2 } }] })
    cells.push({ stack: [
      { text: r.title, bold: true, fontSize: 10 },
      { text: [{ text: r.reference, bold: true, color: GOLD, characterSpacing: 0.3 }, { text: `${r.year ? `  ·  ${r.year}` : ''}${r.label ? `  ·  ${r.label}` : ''}`, color: MUTED }], fontSize: 8, margin: [0, 2, 0, 0] },
      ...(r.hidden ? [{ text: 'Masquée dans la vitrine', color: MUTED, italics: true, fontSize: 7.5 }] : []),
    ], margin: [0, 4, 0, 0] })
    cells.push({ text: r.format, margin: [0, 4, 0, 0] })
    if (!byLocation) cells.push({ text: r.location, margin: [0, 4, 0, 0] })
    cells.push(r.soldOut ? { text: 'Épuisé', color: '#a3261f', bold: true, fontSize: 8, alignment: 'center', margin: [0, 6, 0, 0] }
      : { stack: [{ text: String(r.quantity), bold: true, fontSize: 13 }, ...(r.reserved ? [{ text: `dont ${r.reserved} rés.`, fontSize: 7, color: ORANGE, bold: true }] : [])], alignment: 'center', margin: [0, 2, 0, 0] })
    cells.push({ stack: [box()], margin: [0, 6, 0, 0] })
    body.push(cells)
  }
  return {
    pageSize: 'A4', pageMargins: [28, 74, 28, 40],
    info: { title: `Stock des affiches — ${brandNames(s).full}`, author: brandNames(s).full },
    header: () => ({ margin: [28, 22, 28, 0], stack: [
      { columns: [
        { stack: [{ text: byLocation ? 'Stock par emplacement' : 'Stock par ordre alphabétique', fontSize: 15, bold: true, color: DARK }, { text: `${brandNames(s).full} · ${scopeLabel}`, fontSize: 8.5, color: MUTED, margin: [0, 2, 0, 0] }] },
        { stack: [{ text: `Imprimé le ${date}`, fontSize: 8, color: MUTED }, { text: `${plural(rows.length, 'ligne')} · ${plural(copies, 'exemplaire')}`, fontSize: 8, color: MUTED }], alignment: 'right', width: 'auto' },
      ] },
      { canvas: [{ type: 'line', x1: 0, y1: 6, x2: 539, y2: 6, lineWidth: 1.2, lineColor: GOLD }] },
    ] }),
    footer: (p, n) => ({ margin: [28, 12, 28, 0], columns: [{ text: brandNames(s).full, fontSize: 7.5, color: MUTED }, { text: `Page ${p} / ${n}`, alignment: 'right', fontSize: 7.5, color: MUTED }] }),
    content: rows.length ? [{
      table: { headerRows: 1, dontBreakRows: true, widths, body },
      layout: {
        fillColor: (i, node) => (i === 0 ? DARK : node.table.body[i]?.[0]?.style === 'group' ? '#f1e7d3' : null),
        hLineWidth: (i) => (i === 0 ? 0 : 0.6), vLineWidth: () => 0, hLineColor: () => LINE,
        paddingLeft: () => 4, paddingRight: () => 4, paddingTop: () => 4, paddingBottom: () => 4,
      },
    }] : [{ text: 'Aucune affiche ne correspond aux options choisies.', color: MUTED, margin: [0, 20, 0, 0] }],
    styles: { th: { bold: true, fontSize: 7.5, color: '#ffffff', characterSpacing: 0.4 }, group: { bold: true, fontSize: 10, color: DARK, margin: [0, 2, 0, 2] } },
    defaultStyle: { font: 'Roboto', fontSize: 9, color: INK, lineHeight: 1.1 },
  }
}

/**
 * Catalogue papier : une page A4 par affiche, pour les personnes qui n'utilisent pas le téléphone.
 * Affiche en grand, titre, formats disponibles avec leur prix (jamais les quantités), référence en gros.
 */
function catalogueDoc(list, images, { prices = true } = {}) {
  const s = ADM.settings
  const n = brandNames(s)
  const INK = '#17120c', MUTED = '#6b6152', GOLD = '#a5823f', ORANGE = '#c25a17', LINE = '#e3d6bd'
  const today = formatDay(todayParis())
  const pages = list.map((v, i) => {
    const im = images[v.id]
    // La page doit toujours tenir sur une seule feuille : l'affiche rapetisse un peu s'il y a plus de texte.
    const hasOrig = v.film.original_title && v.film.original_title !== v.film.title
    const MAX_W = 340
    const MAX_H = 490 - (isUpcoming(v) ? 40 : 0) - (hasOrig ? 18 : 0) - (v.film.title.length > 34 ? 26 : 0) - (v.film.title.length > 50 ? 26 : 0) - (v.label && v.label.length > 40 ? 16 : 0)
    let w = MAX_W, h = MAX_H
    if (im) { const k = Math.min(MAX_W / im.w, MAX_H / im.h); w = im.w * k; h = im.h * k }
    const poster = im ? { image: im.data, width: w, height: h } : { stack: [{ canvas: [{ type: 'rect', x: 0, y: 0, w: MAX_H * 2 / 3, h: MAX_H, lineWidth: 1, lineColor: LINE }] }, { text: 'Image indisponible', alignment: 'center', margin: [0, -MAX_H / 2 - 8, 0, 0], color: MUTED, fontSize: 12 }], width: MAX_H * 2 / 3 }
    const fm = catalogueFormats(v, ADM.formats)
    const meta = [yearOf(v.film), v.film.director, v.label].filter(Boolean).join('   ·   ')
    const pill = (f) => ({
      table: { body: [[{ text: [{ text: f.label, bold: true }, ...(prices && f.price !== null && f.price !== undefined ? [{ text: `   ${formatPriceShort(f.price)}`, bold: true, color: INK }] : [])], fontSize: 14, margin: [10, 5, 10, 5] }]] },
      layout: { hLineWidth: () => 1.2, vLineWidth: () => 1.2, hLineColor: () => INK, vLineColor: () => INK },
    })
    return [
      // Affiche encadrée d'un filet doré, centrée
      { columns: [{ width: '*', text: '' }, { width: 'auto', table: { body: [[{ ...poster, margin: [0, 0, 0, 0] }]] },
        layout: { hLineWidth: () => 1.5, vLineWidth: () => 1.5, hLineColor: () => GOLD, vLineColor: () => GOLD, paddingLeft: () => 0, paddingRight: () => 0, paddingTop: () => 0, paddingBottom: () => 0 } }, { width: '*', text: '' }], margin: [0, 4, 0, 0] },
      { text: v.film.title, fontSize: v.film.title.length > 34 ? 22 : 27, bold: true, alignment: 'center', color: INK, margin: [0, 16, 0, 0] },
      ...(hasOrig ? [{ text: v.film.original_title, italics: true, alignment: 'center', color: MUTED, fontSize: 12, margin: [0, 2, 0, 0] }] : []),
      ...(meta ? [{ text: meta, alignment: 'center', color: MUTED, fontSize: 12, margin: [0, 5, 0, 0] }] : []),
      ...(isUpcoming(v) ? [{ table: { widths: ['*'], body: [[{ text: [{ text: 'BIENTÔT   ', bold: true, characterSpacing: 1 }, `En vente à partir du ${formatDay(v.available_from)} · réservation possible en caisse`], fontSize: 11.5, color: '#ffffff', alignment: 'center', margin: [6, 5, 6, 5] }]] },
        layout: { fillColor: () => ORANGE, hLineWidth: () => 0, vLineWidth: () => 0 }, margin: [30, 12, 30, 0] }] : []),
      { columns: [{ width: '*', text: '' }, ...fm.map((f) => ({ width: 'auto', ...pill(f) })), { width: '*', text: '' }], columnGap: 12, margin: [0, 16, 0, 0] },
      { canvas: [{ type: 'line', x1: 0, y1: 0, x2: 515, y2: 0, lineWidth: 0.8, lineColor: LINE }], margin: [0, 18, 0, 10] },
      { columns: [
        { stack: [{ text: 'RÉFÉRENCE À INDIQUER EN CAISSE', fontSize: 9, bold: true, color: MUTED, characterSpacing: 1 }, { text: v.reference_code, fontSize: 30, bold: true, color: ORANGE, characterSpacing: 1.5, margin: [0, 2, 0, 0] }] },
        { text: 'Montrez cette page ou donnez la référence\nau comptoir : nous vous apportons l’affiche.', fontSize: 10.5, color: MUTED, alignment: 'right', margin: [0, 10, 0, 0], width: 'auto' },
      ] },
      ...(i < list.length - 1 ? [{ text: '', pageBreak: 'after' }] : []),
    ]
  })
  return {
    pageSize: 'A4', pageMargins: [40, 58, 40, 46],
    info: { title: list.length === 1 ? `${list[0].film.title} — catalogue ${n.full}` : `Catalogue des affiches — ${n.full}`, author: n.full },
    header: () => ({ margin: [40, 22, 40, 0], stack: [
      { columns: [{ text: [{ text: `${n.catalog.toUpperCase()}  `, color: GOLD, characterSpacing: 3, fontSize: 9, bold: true }, { text: n.cinema.toUpperCase(), color: INK, characterSpacing: 2, fontSize: 11, bold: true }] },
        { text: 'Catalogue des affiches', fontSize: 9, color: MUTED, alignment: 'right', margin: [0, 2, 0, 0] }] },
      { canvas: [{ type: 'line', x1: 0, y1: 6, x2: 515, y2: 6, lineWidth: 1, lineColor: GOLD }] },
    ] }),
    footer: () => ({ margin: [40, 14, 40, 0], text: `Catalogue du ${today} · disponibilité à confirmer en caisse`, fontSize: 8.5, color: MUTED, alignment: 'center' }),
    content: pages.flat(),
    defaultStyle: { font: 'Roboto', fontSize: 11, color: INK, lineHeight: 1.15 },
  }
}

/** Prépare les grandes images du catalogue (≈ 1100 px de haut : nettes à l'impression, PDF raisonnable). */
async function prepareCatalogueImages(list, onProgress) {
  const out = {}
  const token = (await sb.auth.getSession()).data.session?.access_token
  let i = 0, done = 0
  const worker = async () => {
    while (i < list.length) {
      const v = list[i++]
      const url = img.visual(v, 'large')
      out[v.id] = url ? await imageDataUrl(url, token, { w: 740, h: 1110, fit: 'contain', quality: 0.86 }).catch((err) => { console.warn('[pdf] affiche indisponible', url, err?.message); return null }) : null
      onProgress(++done, list.length)
    }
  }
  await Promise.all(Array.from({ length: Math.min(4, list.length) }, worker))
  return out
}

/**
 * Fenêtre d'impression du catalogue papier (une affiche, une sélection ou tout le catalogue).
 * Après impression, un bouton marque les pages comme rangées dans le classeur.
 */
function catalogueModal(list, title, after) {
  if (!list.length) return toast('Aucune affiche à imprimer.', 'info')
  let url = null
  const m = openModal({ title, size: 'sm',
    body: html`<div class="stack">
      <p class="muted small">${plural(list.length, 'page')} A4, une par affiche : l’affiche en grand, les formats disponibles et la référence à indiquer en caisse (jamais les quantités).</p>
      ${switchHtml('cat-prices', true, 'Avec les prix', 'Les prix ne figurent que sur ce catalogue papier (tarifs des Réglages et prix personnalisés).')}
      <button class="btn btn-primary lg block" data-gen>${icon('printer')} Créer le PDF</button>
      <div class="hidden stack tight" data-progress><div class="progress"><div style="width:0%"></div></div><p class="xs muted" data-ptext></p></div>
      <div class="hidden stack tight" data-ready><div class="alert success">PDF prêt.</div>
        <a class="btn btn-primary block" data-dl download>${icon('download')} Télécharger</a>
        <a class="btn btn-secondary block" data-open target="_blank" rel="noopener">${icon('external')} Ouvrir pour imprimer</a>
        <div style="border-top:1px solid var(--line);padding-top:12px;margin-top:4px" class="stack tight">
          <p class="small">Une fois les pages imprimées et rangées :</p>
          <button class="btn btn-accent block" data-mark>${icon('check')} ${list.length > 1 ? `Marquer les ${list.length} pages comme ajoutées au classeur` : 'Marquer comme ajoutée au classeur'}</button></div></div>
    </div>`,
    onClose: () => { if (url) setTimeout(() => URL.revokeObjectURL(url), 60_000) } })
  $('[data-gen]', m.el).onclick = (e) => busy(e.currentTarget, async () => {
    const prog = $('[data-progress]', m.el), bar = $('.progress > div', m.el), text = $('[data-ptext]', m.el)
    prog.classList.remove('hidden')
    try {
      text.textContent = 'Chargement du générateur PDF…'
      const pdfMake = await loadPdfMake()
      const images = await prepareCatalogueImages(list, (d, n) => { bar.style.width = `${Math.round((d / n) * 100)}%`; text.textContent = `Préparation des affiches ${d}/${n}…` })
      const missing = Object.values(images).filter((x) => !x).length
      if (missing) toast(`${plural(missing, 'affiche indisponible', 'affiches indisponibles')} : remplacée${missing > 1 ? 's' : ''} par un cadre avec le titre.`, 'info')
      text.textContent = 'Mise en page…'
      const blob = await new Promise((res, rej) => { try { pdfMake.createPdf(catalogueDoc(list, images, { prices: $('input[name="cat-prices"]', m.el).checked })).getBlob(res) } catch (err) { rej(err) } })
      url = URL.createObjectURL(blob)
      const name = list.length === 1 ? `catalogue-${list[0].reference_code}.pdf` : `catalogue-affiches-${todayParis()}.pdf`
      Object.assign($('[data-dl]', m.el), { href: url, download: name })
      $('[data-open]', m.el).href = url
      $('[data-gen]', m.el).classList.add('hidden')
      $('[data-ready]', m.el).classList.remove('hidden')
    } catch (err) {
      console.error(err)
      toast('La création du PDF a échoué. Réessayez.', 'error')
    } finally { prog.classList.add('hidden') }
  })
  $('[data-mark]', m.el).onclick = (e) => busy(e.currentTarget, async () => {
    try {
      await api.rpc('set_binder', { p_ids: list.map((v) => v.id), p_in: true })
      for (const v of list) { const x = findVisual(v.id); if (x) x.binder_added_at = new Date().toISOString() }
      m.close()
      toast(list.length > 1 ? `${list.length} pages marquées dans le classeur.` : 'Page marquée dans le classeur.')
      after?.()
    } catch (err) { toast(errMsg(err), 'error') }
  })
}

/** Pages à retirer du classeur (affiche plus en stock, masquée ou archivée) : validation une par une. */
function binderRemoveHtml(toRemove, { compact = false } = {}) {
  if (!toRemove.length) return ''
  return html`<div class="card pad stack" style="border-color:#f6cfb0;background:var(--accent-bg)">
    <p style="font-weight:800;color:#8a3d0e">${icon('bell')} ${plural(toRemove.length, 'page')} à retirer du classeur</p>
    ${compact ? '' : html`<p class="small" style="color:#8a3d0e">Ces affiches ne sont plus en stock (ou plus proposées) : retirez leur page du classeur papier, puis validez.</p>`}
    <div class="stack tight">${toRemove.map((v) => html`<div class="row" style="gap:10px;background:var(--surface);border-radius:12px;padding:8px 10px">
      <span style="width:34px;flex-shrink:0">${posterHtml(img.visual(v, 'thumb'), '')}</span>
      <span class="grow" style="min-width:0"><b class="clamp1">${v.film.title}</b><br><span class="xs muted"><span class="mono">${v.reference_code}</span>${v.label ? ` · ${v.label}` : ''}</span></span>
      <button class="btn btn-secondary sm" data-binder-out="${v.id}">${icon('check')} Retirée</button></div>`)}</div></div>`
}
function bindBinderActions(root, after) {
  root.addEventListener('click', (e) => {
    const b = e.target.closest('[data-binder-out]')
    if (!b) return
    busy(b, async () => {
      try {
        await api.rpc('set_binder', { p_ids: [b.dataset.binderOut], p_in: false })
        const v = findVisual(b.dataset.binderOut); if (v) v.binder_added_at = null
        toast('Page retirée du classeur : noté.')
        after?.()
      } catch (err) { toast(errMsg(err), 'error') }
    })
  })
}

ADMIN_PAGES.inventory = async (page) => {
  const preset = qs().get('emplacement')
  const o = { scope: preset ? 'location' : 'all', locationId: preset || ADM.locations[0]?.id, thumbnails: ADM.settings.pdf_include_thumbnails !== false, sort: preset ? 'alpha' : 'location' }
  let result = null
  setHTML(page, html`${pageHead('Liste de stock', 'Document A4 pour l’inventaire physique (case « Vu » à cocher) ou comme copie de secours. Pour les clients : le catalogue papier.')}
    <div class="split side-r">
      <div class="card pad stack">
        <div class="field"><span class="label">Contenu</span>${segHtml('scope', o.scope, [['all', 'Inventaire complet'], ['available', 'Disponibles'], ['location', 'Un emplacement']], 'block')}</div>
        <div class="field ${o.scope === 'location' ? '' : 'hidden'}" data-locfield><label for="inv-loc">Emplacement</label><select class="select" id="inv-loc">${ADM.locations.map((l) => html`<option value="${l.id}" ${attr(l.id === o.locationId, 'selected')}>${l.name}</option>`)}</select></div>
        <div class="field"><span class="label">Tri</span>${segHtml('sort', o.sort, [['alpha', 'Alphabétique'], ['location', 'Par emplacement']], 'block')}</div>
        <div class="stack tight" style="padding:14px;border:1px solid var(--line);border-radius:16px;background:var(--bg)">
          ${switchHtml('thumbs', o.thumbnails, 'Avec miniatures', 'Environ 2 cm de haut, pour reconnaître chaque affiche.')}</div>
        <p class="muted small">Chaque ligne : film et référence, format, emplacement, stock (avec les exemplaires réservés) et une case <b>☐ Vu</b> à cocher pendant le comptage. Aucun prix. L’en-tête est répété sur chaque page.</p>
      </div>
      <aside><div class="card pad stack">${icon('printer')}
        <div><p class="display" style="font-size:26px;font-weight:600" data-count></p><p class="muted small" data-scope></p></div>
        <button class="btn btn-primary lg block" data-gen>${icon('printer')} Générer le PDF</button>
        <div class="hidden stack tight" data-progress><div class="progress"><div style="width:0%"></div></div><p class="xs muted" data-ptext></p></div>
        <div class="hidden stack tight" data-ready><div class="alert success">PDF prêt.</div>
          <a class="btn btn-primary block" data-dl download>${icon('download')} Télécharger</a>
          <a class="btn btn-secondary block" data-open target="_blank" rel="noopener">${icon('external')} Ouvrir pour imprimer</a></div>
      </div></aside></div>`)
  const scopeLabel = () => (o.scope === 'all' ? 'Inventaire complet' : o.scope === 'available' ? 'Affiches disponibles' : `Emplacement : ${ADM.locations.find((l) => l.id === o.locationId)?.name || '?'}`)
  const rows = () => buildInventoryRows(ADM.visuals, ADM.formats, ADM.locations, { ...o, reservations: ADM.reservations })
  const sync = () => {
    const r = rows()
    $('[data-count]', page).textContent = plural(r.length, 'ligne')
    $('[data-scope]', page).textContent = `${plural(r.reduce((a, x) => a + x.quantity, 0), 'exemplaire')} · ${scopeLabel()}`
    $('[data-locfield]', page).classList.toggle('hidden', o.scope !== 'location')
    $('[data-gen]', page).disabled = !r.length
    if (result) { URL.revokeObjectURL(result); result = null }
    $('[data-ready]', page).classList.add('hidden')
  }
  page.addEventListener('change', (e) => {
    if (e.target.closest('[data-seg="scope"]')) o.scope = e.detail
    if (e.target.closest('[data-seg="sort"]')) o.sort = e.detail
    if (e.target.id === 'inv-loc') o.locationId = e.target.value
    if (e.target.name === 'thumbs') o.thumbnails = e.target.checked
    sync()
  })
  $('[data-gen]', page).onclick = (e) => busy(e.currentTarget, async () => {
    const prog = $('[data-progress]', page)
    const bar = $('.progress > div', page)
    const text = $('[data-ptext]', page)
    prog.classList.remove('hidden')
    try {
      text.textContent = 'Chargement du générateur PDF…'
      const pdfMake = await loadPdfMake()
      const r = rows()
      let thumbs = {}
      if (o.thumbnails) {
        thumbs = await prepareThumbs(r, (d, n) => { bar.style.width = `${Math.round((d / n) * 100)}%`; text.textContent = `Préparation des miniatures ${d}/${n}…` })
        const missing = Object.values(thumbs).filter((x) => !x).length
        if (missing) toast(`${plural(missing, 'miniature indisponible', 'miniatures indisponibles')} : remplacée${missing > 1 ? 's' : ''} par un cadre vide.`, 'info')
      }
      bar.style.width = '100%'
      text.textContent = 'Mise en page du document…'
      const blob = await new Promise((res, rej) => { try { pdfMake.createPdf(inventoryDoc({ rows: r, opts: o, thumbs, scopeLabel: scopeLabel() })).getBlob(res) } catch (err) { rej(err) } })
      result = URL.createObjectURL(blob)
      const name = `stock-affiches-${o.sort === 'location' ? 'par-emplacement' : 'alphabetique'}-${todayParis()}.pdf`
      Object.assign($('[data-dl]', page), { href: result, download: name })
      $('[data-open]', page).href = result
      $('[data-ready]', page).classList.remove('hidden')
    } catch (err) {
      console.error(err)
      toast('La génération du PDF a échoué. Réessayez, éventuellement sans miniatures.', 'error')
    } finally { prog.classList.add('hidden') }
  })
  ADM.refreshView = sync
  sync()
}

        ${passwordField('pw2', 'Confirmer le nouveau mot de passe', { autocomplete: 'new-password' })}

    catch (err) { toast(errMsg(err), 'error'); return false }

  // Interrupteurs (vitrine, PDF)
  page.addEventListener('change', async (e) => {
    const n = e.target.name
    if (['show_prices', 'show_recent', 'pdf_include_thumbnails'].includes(n)) {
      if (!owner) { e.target.checked = !e.target.checked; return toast('Réglage réservé à l’administrateur principal.', 'error') }
      if (!(await saveSettings({ [n]: e.target.checked }))) e.target.checked = !e.target.checked
    }
  })
  const cat = $('[data-catalog]', page)
  cat.onsubmit = (e) => {
    e.preventDefault()
    const f = e.target
    if (!f.catalog_name.value.trim() || !f.cinema_name.value.trim()) return toast('Le nom du catalogue et celui du cinéma sont obligatoires.', 'error')
    busy($('[type=submit]', f), () => saveSettings({
      catalog_name: f.catalog_name.value.trim(), cinema_name: f.cinema_name.value.trim(), tagline: f.tagline.value.trim(), contact_note: f.contact_note.value.trim(),
      accent_color: f.accent_color.value.toLowerCase() === DEFAULT_ACCENT ? null : f.accent_color.value, recent_count: Math.min(24, Math.max(0, Math.round(Number(f.recent_count.value)) || 0)),
    }).then((r) => { if (r) { ADM.shell = false; render() } }))
  }
  $('[data-color-reset]', page).onclick = () => { cat.accent_color.value = DEFAULT_ACCENT }
  // Logo
  $('[data-logo]', page).onclick = () => $('[data-logo-file]', page).click()
  $('[data-logo-file]', page).onchange = async (e) => {
    const file = e.target.files?.[0]
    if (!file) return
    if (!/^image\/(png|jpeg|webp)$/.test(file.type) || file.size > 10 * 1024 * 1024) return toast('Logo : image PNG, JPEG ou WebP de 10 Mo maximum.', 'error')
    await busy($('[data-logo]', page), async () => {
      try {
        const bmp = await createImageBitmap(file)
        const k = Math.min(1, 512 / Math.max(bmp.width, bmp.height))
        const c = document.createElement('canvas'); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k)
        c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height)
        const blob = await new Promise((r) => c.toBlob(r, 'image/png'))
